<!-- ============================================================
     REAL REFRACTION.
     A displacement map, fed to the backdrop. The map is neutral grey
     (128,128) through the middle and ramps to black/full in the outer
     14%, so the picture behind the pane is BENT at the bezel and left
     alone in the centre — which is what a pane of glass actually does,
     and what a blur can only imply.

     Scale 8, measured against 14 and 22 side by side over this
     background: 14 smears, 22 melts, 8 bends.

     Only Chromium honours url() in backdrop-filter today. The script
     below feature-tests it and adds .has-refraction; without that
     class the CSS bevel does the job instead, so Safari — which is
     what he actually uses — gets the fallback and never gets a
     broken-looking pane.
     ============================================================ -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <filter id="mz-glass" x="0%" y="0%" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feImage href="data:image/svg+xml;utf8,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20width%3D%27100%27%20height%3D%27100%27%3E%3Cdefs%3E%3ClinearGradient%20id%3D%27gx%27%20x1%3D%270%27%20y1%3D%270%27%20x2%3D%271%27%20y2%3D%270%27%3E%3Cstop%20offset%3D%270%27%20stop-color%3D%27%23000000%27%2F%3E%3Cstop%20offset%3D%270.14%27%20stop-color%3D%27%23800000%27%2F%3E%3Cstop%20offset%3D%270.86%27%20stop-color%3D%27%23800000%27%2F%3E%3Cstop%20offset%3D%271%27%20stop-color%3D%27%23ff0000%27%2F%3E%3C%2FlinearGradient%3E%3ClinearGradient%20id%3D%27gy%27%20x1%3D%270%27%20y1%3D%270%27%20x2%3D%270%27%20y2%3D%271%27%3E%3Cstop%20offset%3D%270%27%20stop-color%3D%27%23000000%27%2F%3E%3Cstop%20offset%3D%270.14%27%20stop-color%3D%27%23008000%27%2F%3E%3Cstop%20offset%3D%270.86%27%20stop-color%3D%27%23008000%27%2F%3E%3Cstop%20offset%3D%271%27%20stop-color%3D%27%2300ff00%27%2F%3E%3C%2FlinearGradient%3E%3C%2Fdefs%3E%3Crect%20width%3D%27100%27%20height%3D%27100%27%20fill%3D%27url%28%23gx%29%27%2F%3E%3Crect%20width%3D%27100%27%20height%3D%27100%27%20fill%3D%27url%28%23gy%29%27%20style%3D%27mix-blend-mode%3Ascreen%27%2F%3E%3C%2Fsvg%3E" result="m" preserveAspectRatio="none" x="0%" y="0%" width="100%" height="100%"/>
    <feDisplacementMap in="SourceGraphic" in2="m" scale="8" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</defs></svg>
<script>
  /* CSS.supports() LIES HERE, AND I CHECKED ON THE DEVICE.
     iPadOS 18.3 Safari answers YES to backdrop-filter: url() and then
     renders no backdrop effect at all — and because the url() sits in
     the same filter list as the blur, it drops the blur with it. The
     result on his actual iPad was flat translucent boxes with no
     glass whatsoever: worse than never having tried.

     So the support query is not enough. -webkit-touch-callout is a
     WebKit-only property, which makes it a reliable tell for the
     engine that has this bug — and it correctly also covers Chrome
     and Edge on iOS, which are WebKit underneath and share it.

     Verified both ways: Chromium true, iPad Safari 18.3 false. */
  try {
    var C = window.CSS;
    if (C && C.supports &&
        C.supports("backdrop-filter", "url(#mz-glass)") &&
        !C.supports("-webkit-touch-callout", "none")) {
      document.documentElement.className += " has-refraction";
    }
  } catch (e) {}
</script>

/* ============================================================
   MEZZO — the whole app.

   Three tabs and nothing else. Everything on screen is either
   something he taps or a number he reads; there is no navigation to
   learn and no screen he can end up on without a way back, because
   the tabs never leave.

   Money is never computed here. resolve_fee prices a student,
   record_fee_payment writes the rupees, reminder_queue decides who is
   late — and this tenant's config already says "one nudge, one day
   late", so the list that comes back IS his list. Filtering it here
   would be how his screen and his WhatsApp start disagreeing.
   ============================================================ */

    who: null,                // the student card: {enrollment,member,name,sport,batch,phone}
    nsDays: [],               // the days ticked on the add-student form
    nsPlan: 1,                // how many months they are paying for
    nsErr: {},                // per-field messages on the add form

    register: null,           // rows from attendance_month

    level = level === undefined ? 1 : level;
    var t = a.currentTime;
    var o = a.createOscillator(); o.type = "sine";
    o.frequency.setValueAtTime(190, t);
    o.frequency.exponentialRampToValueAtTime(96, t + 0.11);
    var g = a.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.26 * level, t + 0.005);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
    o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + 0.26);
    stroke(0.035, 1400, 0.10 * level, 0.5);
  }

  function gate() {
    tabs.hidden = true;
    root.innerHTML =
      '<div class="gate"><div class="ginner">' +
        '<img src="assets/img/logo-white.png" alt="" />' +
        "<h1>Mezzo School of Music</h1>" +
        "<p>Sign in to open the register</p>" +
        (S.err ? '<div class="err">' + esc(S.err) + "</div>" : "") +
        '<label class="field"><span>Email</span>' +
          '<div class="sf"><input id="em" type="email" autocomplete="username" inputmode="email" />' +
          '<svg class="wire" viewBox="0 0 300 20" preserveAspectRatio="none" aria-hidden="true">' +
          '<path vector-effect="non-scaling-stroke" d="M0 10 C 75 8.6 75 8.6 150 10 C 225 11.4 225 11.4 300 10"/></svg></div></label>' +
        '<label class="field"><span>Password</span>' +
          '<div class="pf" id="pf"><div class="pkeys" id="pkeys">' + keyboardHtml() + "</div>" +
          '<input id="pw" type="password" autocomplete="current-password" /></div></label>' +
        '<button class="btn" id="go">Sign in</button>' +
      "</div></div>";
    /* Never a value= on these two. This repo is public, and a prefilled
       password here is a live credential on the open web that stays in
       git history after it is removed. */
    var go = document.getElementById("go");
    var pw = document.getElementById("pw");
    var keys = document.getElementById("pkeys");

    /* Press one more key per character, release on delete. Long
       passwords wrap round the keyboard rather than running out of it. */
    var was = 0;
    if (pw && keys) {
      pw.oninput = function () {
        var n = pw.value.length, all = keys.children;
        for (var i = 0; i < all.length; i++) all[i].className = all[i].className.replace(" on", "");
        for (var k = 0; k < n; k++) {
          var note = ORDER[k % ORDER.length];
          for (var j = 0; j < all.length; j++) {
            if (+all[j].getAttribute("data-note") === note) { all[j].className += " on"; break; }
          }
        }
        if (n > was) tone(ORDER[(n - 1) % ORDER.length]);
        was = n;
      };
    }

    /* The email field is a string, and every letter plucks it. You
       WRITE your name on a string and you PLAY your password on the
       keys — that is the whole idea, and both halves have to respond
       per character or the idea is only half there.

       Two things keep it from becoming a nuisance. It is much quieter
       than the keys, and it is throttled: an email address typed at
       speed would otherwise fire thirty notes in two seconds, which is
       a machine gun, not an instrument. The notes are a low pentatonic
       so any order of them is consonant — you cannot play a wrong one. */
    var PLUCK = [45, 47, 50, 52, 55];          /* A minor pentatonic, low */
    var em = document.getElementById("em");
    var wire = document.querySelector(".wire");
    var wirePath = wire && wire.querySelector("path");
    var lastPluck = 0, twang = null;

    /* RESTARTING AN ANIMATION BY TOGGLING A CLASS IS NOT RELIABLE.
       The old way was remove the class, read offsetWidth to force a
       reflow, add it back. That works in Chrome and does nothing in
       WebKit — and he is on an iPad, so for him the string moved once,
       on the first letter, and then never again however hard he typed.
       Two reasons it was never going to hold: the animation is on the
       <path> but the reflow was forced on its parent <svg>, and SVG
       elements do not reliably have offsetWidth at all.

       So the animation is driven directly instead. Cancel the running
       one, start a new one — no classes, no reflow, no guessing about
       what a browser decided to batch. */
    /* NO TWO PLUCKS ARE THE SAME.
       The first version rang down an identical curve every time —
       same amplitude, same direction, same shape — so however often
       you plucked it, it moved in exactly one way and read as a
       mechanism rather than a string.

       A real string does not do that. Where you catch it decides the
       shape of the wave, how hard decides the amplitude, and it never
       lands twice in the same place. So each keystroke picks a fresh
       one: the belly of the wave moves along the string, the pull goes
       up or down, and both the size and the ring-down time vary. */
    function wave() {
      var at   = 0.22 + Math.random() * 0.56;      /* where it was caught */
      var x    = 300 * at;
      var lift = 10 - Math.random() * 4;
      var up   = Math.random() < 0.5 ? -1 : 1;
      var y    = 10 + lift * up;
      /* one belly, at a different place along the string each time */
      return "M0 10 C " + (x * 0.45).toFixed(1) + " 10 " + (x * 0.7).toFixed(1) + " " + y.toFixed(1) +
             " " + x.toFixed(1) + " " + y.toFixed(1) +
             " C " + (x + (300 - x) * 0.3).toFixed(1) + " " + y.toFixed(1) +
             " " + (x + (300 - x) * 0.55).toFixed(1) + " 10 300 10";
    }

    function pluckString() {
      if (!wirePath) return;
      wirePath.setAttribute("d", wave());          /* a new shape to ring down */
      if (!wirePath.animate) return;               /* very old browser: shape only */

      var amp  = 0.75 + Math.random() * 0.5;
      var dir  = Math.random() < 0.5 ? -1 : 1;
      var dur  = 430 + Math.random() * 220;
      var frames = [], n = 7;
      for (var i = 0; i <= n; i++) {
        /* an exponential decay, alternating sides, ending at rest */
        var k = i === n ? 1 : (1 - i / n) * amp * (i % 2 ? -dir : dir) + (i === 0 ? 0 : 0);
        frames.push({ transform: "scaleY(" + (i === n ? 1 : (k * 4).toFixed(2)) + ")",
                      offset: i / n });
      }
      if (twang) twang.cancel();
      twang = wirePath.animate(frames, { duration: dur, easing: "cubic-bezier(.25,.7,.4,1)" });
    }

    if (em && wire) {
      em.oninput = function () {
        pluckString();
        var now = +new Date();
        if (now - lastPluck > 55) {
          lastPluck = now;
          /* Was tone(..., 0.42) — a bare sine at under half level,
             which under a guitar-string animation was barely there.
             A pluck has a transient and a filter that closes as it
             dies, so it carries at a fraction of the loudness a sine
             needs, and it is the sound the band is drawing. */
          pluck(PLUCK[em.value.length % PLUCK.length], 0.95);
        }
      };
    }

    /* Right password: the keys run up the scale under your hand and
       settle on a chord. Wrong one: a dull low pair and a shake, which
       is what a wrong note actually sounds like. */
    function glissando() {
      var all = keys ? keys.children : [];
      ORDER.forEach(function (note, i) {
        setTimeout(function () {
          tone(note);
          for (var j = 0; j < all.length; j++) {
            if (+all[j].getAttribute("data-note") === note) {
              all[j].className += " on";
              break;
            }
          }
        }, i * 34);
      });
      setTimeout(function () { [60, 64, 67, 72].forEach(function (n) { tone(n); }); }, ORDER.length * 34 + 90);
    }
    function wrongNote() {
      tone(47); tone(48);                      /* a semitone apart, on purpose */
      var pf = document.getElementById("pf");
      if (pf) { pf.classList.remove("shake"); void pf.offsetWidth; pf.classList.add("shake"); }
    }

    function submit() {
      var email = document.getElementById("em").value.trim();
      var pass = pw.value;
      if (!email || !pass) { S.err = "Enter the email and password."; return render(); }
      go.disabled = true; go.textContent = "Signing in…";
      MZ.signIn(email, pass).then(function () {
        S.err = "";
        glissando();
        /* Let it finish playing before the screen changes under it. */
        setTimeout(boot, 700);
      }).catch(function (e) {
        go.disabled = false; go.textContent = "Sign in"; wrongNote(); fail(e);
      });
    }
    go.onclick = submit;
    pw.onkeydown = function (e) { if (e.key === "Enter") submit(); };
  }

  /* ---------- chrome ---------- */
  function header(sub) {
    return '<div class="top">' +
      '<img src="assets/img/logo-white.png" alt="" />' +
      '<div class="t"><b>Mezzo</b><span>' + esc(sub) + "</span></div>" +
      '<button id="out">Sign out</button></div>';
  }
  function drawTabs() {
    tabs.hidden = false;
    /* Three marks, drawn in the same hairline as the violin on his
       card, and each one earns its tab rather than illustrating it:
       a metronome counts days the way it counts beats, a bell rings
       until somebody answers, and a drum head seen face-on is also
       the shape of a coin. */
    var ICON = {
      /* Was a metronome, and at 26px a metronome is a triangle with a
         line through it — it said "music", not "attendance", and the
         tab already says Attendance in words underneath. This is the
         thing he actually does: a sheet with staff lines and a tick
         struck across the corner of it. */
      register: '<svg viewBox="0 0 24 24"><path d="M14.6 3.2H6.2a1.8 1.8 0 0 0-1.8 1.8v14a1.8 1.8 0 0 0 1.8 1.8h7.6"/>' +
                '<path d="M7.6 8.4h6.6M7.6 12h6.6M7.6 15.6h3.4"/>' +
                '<path d="M12.9 16.6 15.8 19.6 21.2 12.4" stroke-width="2.1"/></svg>',
      dues:     '<svg viewBox="0 0 24 24"><path d="M12 3.2a6.6 6.6 0 0 1 6.6 6.6c0 4 1.2 5.6 2.2 6.6H3.2c1-1 2.2-2.6 2.2-6.6A6.6 6.6 0 0 1 12 3.2z"/><path d="M10 19.4a2.1 2.1 0 0 0 4 0"/><path d="M12 3.2V1.6"/></svg>',
      /* Two concentric circles read as a target, or an aperture, or a
         drum head — anything except money. This is a banknote with a
         rupee on it, which at 26px is the one shape nobody has to
         work out. */
      money:    '<svg viewBox="0 0 24 24"><rect x="2.4" y="6" width="19.2" height="12" rx="2.2"/>' +
                '<path d="M9.4 9.6h4.6M9.4 12h4.6M13 9.6c1.6 0 1.6 2.4 0 2.4h-3.6l4 3.4"/>' +
                '<path d="M5.2 9.1v5.8M18.8 9.1v5.8"/></svg>'
    };
    var T = [["register", "Attendance"], ["dues", "Dues"], ["money", "Money"]];
    tabs.innerHTML = T.map(function (t) {
      return '<button data-tab="' + t[0] + '"' + (S.tab === t[0] ? ' class="on"' : "") +
        '><span class="ic">' + ICON[t[0]] + "</span>" + t[1] + "</button>";
    }).join("");
  }

  /* ============================================================
     TAB 1 — REGISTER
     Opens on today, because 99 times out of 100 that is why the app
     is open. The month grid is one tap away and reads the SAME
     function, so the two can never disagree.
     ============================================================ */
  function loadRegister() {
    S.register = null;
    var r = S.mode === "today"
      ? { from: S.day, to: S.day }
      : MZ.monthRange(S.month.y, S.month.m);
    return MZ.register(r.from, r.to).then(function (rows) {
      /* Array.isArray, not `rows || []`. PostgREST answers an error
         with a four-key OBJECT, which is truthy, and the register then
         called .forEach on it and took the whole tab down with a
         TypeError instead of showing an empty day. Anything that is
         not a list is no rows. */
      S.register = { rows: Array.isArray(rows) ? rows : [], from: r.from, to: r.to };
      render();
    }).catch(fail);
  }

  /* One filter word. The ring is drawn, not printed: the same
     stroke-dashoffset trick as the tick, so choosing a filter looks
     like circling something rather than a button lighting up.

     The <svg> carries an explicit width. It is a REPLACED element, so
     left+right do not stretch it — without a width it falls back to
     its intrinsic viewBox size and the ring runs off the page. */
  function word(val, label, on, attr, hue) {
    return '<button class="' + (on ? "on" : "") + '" data-' + attr + '="' + val + '"' +
      (hue ? ' style="--marker:' + hue + '"' : "") + ">" + label +
      '<svg class="ring" viewBox="0 0 120 34" preserveAspectRatio="none" aria-hidden="true">' +
      '<path d="M60 3 C 22 3, 3 9, 3 17 C 3 26, 26 31, 62 31 C 96 31, 117 26, 117 17 ' +
      'C 117 9, 98 4, 57 3"/></svg></button>';
  }

  /* ============================================================
     GOING BACK MORE THAN ONE MONTH

     The arrows step one month at a time, which is fine for last month
     and useless for six months ago — twelve taps and a lot of waiting
     on a 180ms round trip each. Tapping the date opens a strip of the
     last twelve months; one tap lands anywhere in a year.
     ============================================================ */
  function monthStrip() {
    if (!S.monthPick) return "";
    var now = new Date(), out = "";
    for (var k = 0; k < 12; k++) {
      var d = new Date(now.getFullYear(), now.getMonth() - k, 1);
      var y = d.getFullYear(), m = d.getMonth() + 1;
      var on = S.month && S.month.y === y && S.month.m === m;
      out += '<button class="mchip' + (on ? " on" : "") + '" data-jump="' + y + "-" + m + '">' +
        "<b>" + d.toLocaleDateString("en-IN", { month: "short" }) + "</b>" +
        "<span>" + (y === now.getFullYear() ? "" : String(y).slice(2)) + "</span></button>";
    }
    return '<div class="mstrip">' + out + "</div>";
  }

  function viewRegister() {
    var body = "";
    if (S.mode === "today") {
      body += '<div class="daybar">' +
        '<button data-day="-1">‹</button>' +
        '<button class="d" data-months="1"><b>' + esc(dayName(S.day)) + "</b><span>" +
          (S.day === MZ.todayIso() ? "Today" : (isSunday(S.day) ? "Sunday · closed" : "")) +
        "</span></button>" +
        '<button data-day="1"' + (S.day >= MZ.todayIso() ? " disabled" : "") + ">›</button>" +
        /* INSIDE the daybar. As a sibling it had no positioned
           ancestor, so position:absolute walked all the way up and the
           peg landed on top of Sign out. */
        '<button class="peg" data-add="1" aria-label="Add a student">' +
        '<svg viewBox="0 0 24 24" aria-hidden="true">' +
          '<path d="M4 20.2l1-4.2L16.1 4.9a2 2 0 0 1 2.9 0l.1.1a2 2 0 0 1 0 2.9L8.2 19.2z"/>' +
          '<path d="M14.6 6.4l3 3"/><path d="M5 16l3 3.2"/></svg>' +
        '<span class="lbl">Add</span></button>' +
      "</div>";
    } else {
      var mn = new Date(S.month.y, S.month.m - 1, 1)
        .toLocaleDateString("en-IN", { month: "long", year: "numeric" });
      body += '<div class="daybar">' +
        '<button data-mon="-1">‹</button>' +
        '<button class="d" data-months="1"><b>' + esc(mn) + "</b><span>tap to jump</span></button>" +
        '<button data-mon="1">›</button>' +
        '<button class="peg" data-add="1" aria-label="Add a student">' +
        '<svg viewBox="0 0 24 24" aria-hidden="true">' +
          '<path d="M4 20.2l1-4.2L16.1 4.9a2 2 0 0 1 2.9 0l.1.1a2 2 0 0 1 0 2.9L8.2 19.2z"/>' +
          '<path d="M14.6 6.4l3 3"/><path d="M5 16l3 3.2"/></svg>' +
        '<span class="lbl">Add</span></button>' +
      "</div>";
    }

    /* THE TOGGLE AND THE SEARCH SHARE A ROW.
       Three full-width bands — date, mode, search — pushed the sheet
       180px down the screen before a single name appeared, on the one
       tab he opens every afternoon. They are one band now. */
    body += monthStrip();
    body += '<div class="band">' +
      '<div class="sub-toggle">' +
        '<button data-mode="today"' + (S.mode === "today" ? ' class="on"' : "") + ">One day</button>" +
        '<button data-mode="month"' + (S.mode === "month" ? ' class="on"' : "") + ">Month</button>" +
      "</div>" +
      (S.register && S.register.rows.length > 12
        ? '<input class="search" id="q" placeholder="Find a name…" value="' + esc(S.q) + '" />'
        : "") +
    "</div>";

    if (!S.register) return body + '<div class="note">Loading…</div>';

    var rows = S.register.rows;

    /* THE FILTER, WRITTEN IN THE MARGIN AND CIRCLED.

       A setlist does not have a row of buttons on it. It has words in
       the margin with one of them circled, which is exactly what a
       filter is. So the control is a line of small marker words and
       the selection is a hand-drawn ring — the third ink mark on the
       page, alongside the tick and the strike. Nothing new to learn:
       whoever understands "struck out means away" already understands
       "circled means that is what I am looking at".

       Two groups on one line, split by a pencil slash:
         · the INSTRUMENTS, built from who is actually in front of him
           today — three words on a quiet Tuesday, seven on a Saturday,
           never a fixed wall of eight
         · the BATCH, weekday against Saturday, which is the one thing
           the day cannot tell him in month view and the thing he asked
           for by name

       Each word is 40px tall rather than the 48 this app holds itself
       to everywhere else. A mis-tap here shows the wrong list for a
       second; a mis-tap on the register marks a child absent. Those
       are not the same risk and should not cost the same screen. */
    var present = [];
    S.register.rows.forEach(function (r) {
      if (r.sport && present.indexOf(r.sport) < 0) present.push(r.sport);
    });
    present.sort();

    /* THE BATCH FILTER IS GONE, because batches are gone. Filtering
       by "weekday or Saturday" meant something when those were the two
       groups; now every child has their own days and the day view
       already picks a day. */
    var showIns = present.length > 1;
    var filterHtml = "";
    if (showIns) {
      filterHtml = '<div class="annot"><div class="row">' +
        word("", "Everyone", !S.fIns, "fi") +
        present.map(function (n) {
          return word(esc(n), esc(n), S.fIns === n, "fi", inst(n).hue);
        }).join("") +
      "</div></div>";
    }

    if (S.fIns) rows = rows.filter(function (r) { return r.sport === S.fIns; });
    if (S.q) {
      var q = S.q.toLowerCase();
      rows = rows.filter(function (r) {
        return (r.member_name || "").toLowerCase().indexOf(q) >= 0 ||
               (r.sport || "").toLowerCase().indexOf(q) >= 0;
      });
    }
    if (!S.register.rows.length) {
      return body + '<div class="card"><div class="note">No students yet.<br><br>' +
        '<button class="btn" data-add="1">Add the first student</button></div></div>';
    }
    /* NO early return for an empty result. Returning here dropped the
       filter row along with the list, so circling a batch nobody is in
       stranded him on a card whose only button cleared the instrument
       and left the batch on. The empty state belongs INSIDE the sheet,
       under the filter that caused it. */

    if (S.mode === "today") {
      var due = rows.filter(function (r) { return runsOn(r.batch_id, S.day); });
      var off = rows.filter(function (r) { return !runsOn(r.batch_id, S.day); });
      /* Never hide the off-day children behind a decision he has to
         remember: a makeup lesson is a real thing, and it is one tap
         away, on the same sheet. */
      /* Circling "Saturday" on a Thursday would otherwise produce an
         empty sheet and a dead end. It is really a request to see the
         Saturday children — which is exactly the makeup-lesson case —
         so open that set instead of showing him nothing. */
      var openOff = S.showOff;
      body += setList(due, off, filterHtml, true, openOff);
    } else {
      /* The month is still the old grid. The annotation goes on a torn
         strip of the same paper so the filter is the one control in
         both modes rather than two that look unrelated. */
      if (filterHtml) body += '<div class="sheetwrap"><div class="setlist" ' +
        'style="padding:8px 16px 4px">' + filterHtml + "</div></div>";
      body += monthGrid(rows);
    }
    return body;
  }

  /* ============================================================
     THE SETLIST

     He is a performer. The thing he already knows how to read at a
     glance, standing up, mid-lesson, is a setlist taped to a wall:
     numbered names, grouped into sets, ticked as they happen and
     struck out when they do not.

     So the sets are the INSTRUMENTS — the noun this school is
     organised around — and the marks are made by hand:

       tick    they came
       strike  they did not
       nothing not yet, which is different from away and must look it

     TAPPING THE LINE MARKS. The whole line is the target, ~52px of it,
     because that is the gesture the sheet is for. Opening a child's
     card is a separate, smaller reach at the right edge, so the common
     act is the easy one and the rare act is the deliberate one.
     ============================================================ */
  function setList(due, off, filterHtml, showBatchTail, openOff) {
    var n = 0, tailOn = false;

    function line(r) {
      n++;
      var st = r.marks && r.marks[S.day];
      var cls = st === "present" ? " present" : st === "absent" ? " absent" : "";
      var bat = MZ.dayLabel(daysOf(r.batch_id));
      return '<div class="sl-ln' + cls + (S.busy[r.enrollment_id] ? " busy" : "") +
          '" data-key="' + r.enrollment_id + '">' +
        '<button class="mark" data-mark="' + r.enrollment_id + '"' +
          ' data-batch="' + (r.batch_id || "") + '" data-note="' + inst(r.sport).note + '"' +
          ' data-now="' + (st || "") + '" aria-label="' + esc(r.member_name) + '">' +
          '<span class="no">' + n + '.</span>' +
          /* drawn by hand, not a font glyph — a tick you make */
          '<svg class="tk" viewBox="0 0 28 28" aria-hidden="true">' +
            '<path d="M4.6 15 L10.7 21.4 L23.8 6"/></svg>' +
          '<span class="who">' + esc(r.member_name) +
            '<svg class="st" viewBox="0 0 300 22" preserveAspectRatio="none" aria-hidden="true">' +
            '<path d="M2 12 C 70 6, 150 16, 298 9"/></svg></span>' +
        "</button>" +
        /* Only in the off-day set — and there it is the whole
           explanation: "Wed, Sat" is WHY this child is not expected on
           a Thursday. In today's set it would be noise colliding with
           the name beside it. */
        (tailOn && showBatchTail && bat ? '<span class="tail">' + esc(bat) + "</span>" : "") +
        '<button class="open" data-who="' + r.enrollment_id + '" data-mem="' + (r.member_id || "") +
          '" data-nm="' + esc(r.member_name) + '" data-sport="' + esc(r.sport || "") +
          '" data-batch="' + (r.batch_id || "") + '" aria-label="Open ' + esc(r.member_name) +
          '">\u203A</button>' +
      "</div>";
    }

    /* One set per instrument, in the school's own order of the day. */
    function sets(rows) {
      var by = {}, order = [];
      rows.forEach(function (r) {
        var k = r.sport || "Other";
        if (!by[k]) { by[k] = []; order.push(k); }
        by[k].push(r);
      });
      order.sort();
      return order.map(function (k) {
        var g = by[k];
        var inn = g.filter(function (r) {
          return r.marks && r.marks[S.day] === "present";
        }).length;
        /* SYMBOL AND WORD, not symbol instead of word. At 22px a
           guitar and a ukulele are the same two circles and a neck,
           and piano and keyboard are the same row of keys — he would
           be identifying his own sections by guessing. The symbol
           earns its place by being the thing that MOVES when a child
           in that section is marked in; the word is what he reads. */
        return '<div class="sl-set" style="--hue:' + inst(k).hue + '">' +
          '<div class="sl-hd"><span class="ig" data-ig="' + esc(k) + '">' +
            svgIcon(inst(k)) + "</span><b>" + esc(k) + "</b>" +
          "<i>" + g.length + (g.length > 1 ? " names" : " name") + "</i>" +
          "<em>" + inn + " in</em></div>" +
          g.map(line).join("") +
        "</div>";
      }).join("");
    }

    var marked = due.filter(function (r) { return r.marks && r.marks[S.day] === "present"; }).length;
    var away   = due.filter(function (r) { return r.marks && r.marks[S.day] === "absent"; }).length;

    var body = '<div class="sheetwrap"><div class="tape l"></div><div class="tape r"></div>' +
      '<div class="setlist">' +
      /* A filtered list must SAY it is filtered. Ten names on a sheet
         that should hold eighty is either a quiet Tuesday or a filter
         he forgot he left on, and those look identical. */
      '<div class="sl-top"><b>' + (S.day === MZ.todayIso() ? "Today" : "That day") + "\u2019s set</b>" +
        "<em>" + marked + " of " + due.length + " in</em></div>" +
      filterHtml +
      /* On its own line, not squeezed into the title — at 375px the
         title, the note and the count fought and the note lost by
         being clipped mid-word. */
      (narrowedBy()
        ? '<button class="sl-narrow" data-clear="1">showing ' + esc(narrowedBy()) +
          " \u00d7</button>"
        : "");

    body += due.length ? sets(due)
          : (narrowedBy() && !off.length
              ? '<div class="sl-note">Nobody matches that.</div>'
              : '<div class="sl-note">No class today.</div>');

    tailOn = true;
    if (off.length && openOff) {
      body += '<div class="sl-set" style="--hue:var(--pencil)">' +
        '<div class="sl-hd"><b>Not usually here today</b><i>' + off.length +
        (off.length > 1 ? " names" : " name") + "</i></div>" + sets(off) + "</div>";
    }

    body += '<div class="sl-foot">' + marked + " ticked \u00b7 " + away +
      " struck \u00b7 " + Math.max(0, due.length - marked - away) + " still to come";
    if (off.length && !openOff) {
      body += '<button class="more" data-off="1">Someone came on an off day? Show ' +
              off.length + " more</button>";
    }
    body += "</div></div></div>";
    return body;
  }

  /* What the sheet is currently narrowed to, in words. Empty when it
     is showing everybody, so the line stays quiet in the normal case. */
  function narrowedBy() {
    var bits = [];
    if (S.fIns) bits.push(S.fIns);
    if (S.q)    bits.push('"' + S.q + '"');
    return bits.length ? bits.filter(Boolean).join(" \u00b7 ") + " only" : "";
  }


  /* ============================================================
     THE ROLL — the month as a player-piano roll

     Each child is a lane, each day a column, and present is a PUNCHED
     HOLE. The pianola is the one instrument where the hole IS the
     note, so a month of attendance is literally a roll you could feed
     through something and hear.

     It is the same two-table grid underneath, unchanged, because that
     grid was taken from 104ms of layout to 27.8ms and repainting it as
     a roll must not give any of that back. Everything below is paint:
     the holes, the perforations and the hatching are backgrounds and
     classes on cells that already existed.
     ============================================================ */
  function monthGrid(rows) {
    var y = S.month.y, m = S.month.m, days = MZ.monthRange(y, m).days;
    var today = MZ.todayIso();
    var head = "", perf = "", i, iso;
    for (i = 1; i <= days; i++) {
      iso = y + "-" + String(m).padStart(2, "0") + "-" + String(i).padStart(2, "0");
      var d = new Date(y, m - 1, i).getDay();
      head += '<th class="' + (isSunday(iso) ? "shut" : "") +
              (iso === today ? " today" : "") + '"><b>' + i + "</b>" +
              DAY_NAMES[d].slice(0, 2) + "</th>";
      perf += '<td class="pf"></td>';
    }

    var body = rows.map(function (r) {
      var cells = "", seen = 0, came = 0;
      for (i = 1; i <= days; i++) {
        iso = y + "-" + String(m).padStart(2, "0") + "-" + String(i).padStart(2, "0");
        var st = r.marks && r.marks[iso];
        var runs = runsOn(r.batch_id, iso) && !isSunday(iso);
        if (st === "present") { came++; seen++; } else if (st === "absent") seen++;
        cells += st === "present" ? '<td class="c pn' + (iso === today ? " today" : "") + '"></td>'
               : st === "absent"  ? '<td class="c ab' + (iso === today ? " today" : "") + '"></td>'
               /* A day this child's class does not run is not
                  "unmarked" — it is never expected, and an empty hole
                  here would read as a register he forgot to punch. */
               : runs ? '<td class="c bl' + (iso === today ? " today" : "") + '"></td>'
                      : '<td class="c shut' + (iso === today ? " today" : "") + '"></td>';
      }
      var rate = seen ? Math.round(came / seen * 100) : 0;
      return '<tr style="--hue:' + inst(r.sport).hue + '">' + cells +
        '<td class="tot"><b>' + (seen ? rate + "%" : "\u2013") + "</b>" +
        '<i style="width:' + (seen ? rate : 0) + '%"></i></td></tr>';
    }).join("");

    /* THE NAME COLUMN COMES OUT OF THE TABLE.
       It was position:sticky on ninety-six cells, and sticky is the
       single most expensive thing left in this view: removing it took
       the layout from 40.1ms to 22.7ms, measured. So the names are
       their own narrow table standing beside the scroller instead —
       the frozen-column pattern — and nothing is sticky at all.

       The two tables stay in step because every row is one fixed
       height in both. They are one line of text; nothing can wrap. */
    var names = rows.map(function (r) {
      return '<tr style="--hue:' + inst(r.sport).hue + '"><td class="nmcol">' +
        esc(r.member_name) + '<span class="sp">' + esc(r.sport || "") + "</span></td></tr>";
    }).join("");

    /* The name table carries the SAME perforation rows. Without them
       its tbody starts 13px above the day table's and every name sits
       against the wrong child's marks — the third time this pair has
       drifted, and the reason both now get identical rows or none. */
    return '<div class="card roll"><div class="gridwrap">' +
      '<table class="reg names"><thead><tr><th class="nmcol"></th></tr></thead>' +
        '<tbody><tr class="perf"><td class="nmcol"></td></tr>' +
          names +
        '<tr class="perf b"><td class="nmcol"></td></tr></tbody></table>' +
      '<div class="gridscroll"><table class="reg days">' +
        "<thead><tr>" + head + '<th class="tot">In</th></tr></thead>' +
        /* the tractor feed, which is what makes it a roll and not a
           spreadsheet with round corners */
        '<tbody><tr class="perf">' + perf + '<td class="tot"></td></tr>' +
          body +
        '<tr class="perf b">' + perf + '<td class="tot"></td></tr></tbody>' +
      "</table></div></div>" +
      '<div class="muted" style="margin-top:10px">Scroll sideways for the rest of the month. ' +
      "Tap <b>One day</b> to mark attendance.</div></div>";
  }

  /* Tap cycles blank → present → absent → blank. One control, three
     states, and the colour says which without reading anything. */
  function cycle(btn) {
    var eid = +btn.getAttribute("data-mark");
    var bid = +btn.getAttribute("data-batch");
    var now = btn.getAttribute("data-now");
    if (!bid) { toast("This student has no class time set."); return; }
    if (S.busy[eid]) return;
    var next = now === "present" ? "absent" : now === "absent" ? null : "present";

    /* PAPER FIRST, INSTRUMENT UNDER IT.
       He is ticking names on a sheet, so the mark sounds like a
       pencil: two strokes for a tick, one long pressed drag for a
       strike-off, a dull brush to rub one out. The child's own
       instrument still speaks underneath at a fifth of the level —
       enough that he learns the sound of his own register and a
       mis-tap is something he HEARS before he looks for it, not
       enough to turn a register into a xylophone. */
    /* The key presses. A row that visibly goes down is the clearest
       receipt there is for a tap, on a screen where a mis-tap marks a
       child absent. */
    /* The setlist gives its own receipt — the line lights under the
       thumb and the tick DRAWS itself — so the key-press animation is
       only for the old row. Both find their container the same way. */
    var row = btn.closest && btn.closest(".sl-ln, .srow");
    if (row && row.classList && row.classList.contains("srow")) {
      row.classList.add("pressed");
      setTimeout(function () { row.classList.remove("pressed"); }, 160);
    }
    var n = +btn.getAttribute("data-note") || 65;
    if (next === "present")     { pencilTick();   tone(n, 0.20); }
    else if (next === "absent")  { pencilStrike(); tone(n - 17, 0.14); }
    else                           paperBrush();
    btn.classList.remove("strike"); void btn.offsetWidth; btn.classList.add("strike");

    /* busy belongs on whichever container the CSS dims: .tick.busy for
       the old row, .sl-ln.busy for the sheet. */
    S.busy[eid] = true; btn.classList.add("busy");
    if (row && row.classList) row.classList.add("busy");
    /* Which section to sound once the paint lands. The sheet is
       re-rendered wholesale on every mark, so the element that should
       move does not exist yet at the moment we decide it should. */
    var mrow = (S.register.rows || []).filter(function (r) { return r.enrollment_id === eid; })[0];
    if (mrow && next) S.pulse = { sport: mrow.sport, kind: next };

    MZ.mark(bid, S.day, eid, next).then(function () {
      delete S.busy[eid];
      var row = (S.register.rows || []).filter(function (r) { return r.enrollment_id === eid; })[0];
      if (row) {
        row.marks = row.marks || {};
        if (next) row.marks[S.day] = next; else delete row.marks[S.day];
      }
      render();
    }).catch(function (e) { delete S.busy[eid]; fail(e); });
  }

  /* ============================================================
     TAB 2 — DUES
     reminder_queue() already knows who is late, and this tenant is
     configured for "one day overdue, keep telling me". Whatever it
     returns is the list. Two buttons per person: send, or paid.
     ============================================================ */
  function loadDues() {
    S.dues = null;
    /* The register rides along in the same round trip. Opening a
       family's card needs their attendance, and asking for it only
       when he taps would put a Tokyo round trip — ~180ms — between the
       tap and anything appearing. */
    var r = MZ.monthRange(S.month.y, S.month.m);
    return Promise.all([MZ.dues(), MZ.register(r.from, r.to)])
      .then(function (x) {
        S.dues = Array.isArray(x[0]) ? x[0] : [];
        S.duesReg = Array.isArray(x[1]) ? x[1] : [];
        render();
      }).catch(fail);
  }
  function waLink(d) {
    var ph = String(d.phone || "").replace(/\D/g, "");
    if (ph.length === 10) ph = "91" + ph;
    var msg = "Namaste" + (d.parent_name ? " " + d.parent_name : "") + ", this is Mezzo School of Music. " +
      "The monthly fee for " + d.member_name + " (" + (d.sport || "class") + ") of " +
      "₹" + Number(d.amount || 0).toLocaleString("en-IN") + " was due on " +
      new Date(d.due_date).toLocaleDateString("en-IN", { day: "numeric", month: "short" }) +
      ". Kindly pay at your convenience. Thank you.";
    return "https://wa.me/" + ph + "?text=" + encodeURIComponent(msg);
  }
  /* ============================================================
     THE TUNER — the dues tab

     Every family is a note being tuned. Dead centre is settled; the
     needle sits FLAT by how many days they are late, and the further
     out, the redder. Late becomes a thing you see the shape of before
     you have read a single number, and a school with nothing owing is
     a screen that has gone perfectly still.

     The list is whatever reminder_queue() returned, in the order it
     returned it. This app does not filter the dues list — that is how
     his screen and his WhatsApp message start disagreeing.
     ============================================================ */
  var TUNER_NOTE = { Piano: "C", Keyboard: "E", Guitar: "E", Violin: "A",
                     Ukulele: "G", Vocals: "A", Drums: "D", Flute: "B" };
  /* days late -> how far off the needle sits, capped and curved so a
     month late and three months late do not look the same. */
  function flatness(days) {
    var d = Number(days) || 0;
    return d <= 0 ? 0 : Math.min(1, Math.pow(d / 26, 0.72));
  }
  /* Three steps, all warm: a nudge, a chase, a problem. Roughly a week,
     three weeks, and beyond. */
  function tuneColour(off) {
    return off < 0.30 ? "var(--warn)" : off < 0.62 ? "#C25A17" : "var(--no)";
  }

  function viewDues() {
    if (!S.dues) return '<div class="note">Loading…</div>';
    if (!S.dues.length) {
      return '<div class="card tuner"><div class="tn-allin">' +
        '<div class="tn-ring"><b>\u2713</b></div>' +
        "<b>The whole school is in tune.</b><span>Nobody is overdue.</span>" +
        '<button class="btn plec" data-other="1">Someone else paid</button>' +
        "</div></div>";
    }
    var total = S.dues.reduce(function (a, d) { return a + Number(d.amount || 0); }, 0);
    return '<div class="card tuner">' +
      '<div class="rowline" style="margin-bottom:4px">' +
        "<div><b style=\"font-size:19px\">" + S.dues.length + " out of tune</b>" +
        '<div class="muted">' + inr(total) + " in total</div></div></div>" +
      '<div class="muted" style="margin:6px 0 12px">Tap a name to hear where they sit</div>' +
      S.dues.map(function (d, i) {
        var off = flatness(d.days_since), hue = inst(d.sport).hue;
        /* NEVER GREEN. Green is "in tune" — settled — and nobody on
           this list is settled: reminder_queue() only returns families
           who owe. One day late came out green and nineteen days came
           out red, which read as two different KINDS of thing rather
           than two points on one scale. Amber to red, monotonic, so
           the colour only ever says "how late". */
        var col = tuneColour(off);
        var left = (50 - off * 43).toFixed(1);
        var ticks = "";
        for (var t = 0; t < 11; t++) {
          ticks += '<i class="tn-tk' + (t === 5 ? " mid" : "") + '" style="left:' + (t * 10) + '%"></i>';
        }
        /* ONE ROW, ONE TAP. The WhatsApp and Paid buttons used to sit
           on every row, which made each family 150px tall and the list
           a wall of green and violet. They live in the family's own
           card now: the list is for SEEING who is flat, the card is
           for doing something about it. */
        /* THE METER GETS ITS OWN LINE.
           Beside the name and the amount it was squeezed to 96px in a
           326px row — a dial that small is a decoration, not a
           reading. On its own line it is as wide as the row on any
           screen, which is the whole point of a tuner. */
        return '<button class="due tuned tn-row" data-fam="' + i + '" style="--hue:' + hue + '">' +
          '<span class="tn-top">' +
          '<span class="tn-note" style="color:' + col + '">' +
            (TUNER_NOTE[d.sport] || "\u266a") + "</span>" +
          '<span class="tn-who"><b>' + esc(d.member_name) + "</b>" +
            /* "asked today" did not fit beside the instrument and came
               out as "Piano · ask…". The full sentence is on the card;
               the row only needs to say that it happened. */
            "<span>" + esc(d.sport || "") +
            (d.already_sent ? " \u00b7 asked" : "") + "</span></span>" +
          '<span class="tn-amt"><b>' + inr(d.amount) + "</b></span></span>" +
          '<span class="tn-meter"><span class="tn-ticks">' + ticks +
            '<span class="tn-gate"></span></span>' +
            '<span class="ndl' + (off > 0.12 ? " off" : "") +
              '" style="left:' + left + '%;background:' + col + '"></span>' +
            '<span class="tn-cents">' + d.days_since + " day" + (d.days_since === 1 ? "" : "s") +
            " flat</span></span>" +
        "</button>";
      }).join("") +
      '<button class="btn plec" data-other="1" style="margin-top:14px">' +
        "Someone else paid</button></div>";
  }

  /* ============================================================
     THE FAMILY CARD

     Opened from a name on the tuner. It answers the question he
     actually has before he sends a message — is this a family that
     has been here for years and forgets, or one that joined in June
     and is already slipping? — and only then offers the two things he
     can do about it.

     Every number on it is real. Nothing is computed that the database
     did not already say, and no fee is priced here: the amount is the
     one reminder_queue() returned.
     ============================================================ */
  function monthsBetween(a, b) {
    if (!a) return null;
    var d0 = new Date(a), d1 = new Date(b || MZ.todayIso());
    if (isNaN(d0)) return null;
    var m = (d1.getFullYear() - d0.getFullYear()) * 12 + (d1.getMonth() - d0.getMonth());
    if (d1.getDate() < d0.getDate()) m--;
    return Math.max(0, m);
  }
  function viewFam() {
    var d = S.dues && S.dues[S.fam];
    if (!d) return "";
    var w = S.famInfo || {};
    var reg = (S.duesReg || []).filter(function (r) {
      return r.enrollment_id === d.enrollment_id;
    })[0];

    /* how long they have been coming */
    var since = w.joined || (w.enrollments && w.enrollments[0] && w.enrollments[0].joined_on);
    var months = monthsBetween(since);

    /* this month, over the days this child was actually expected */
    var seen = 0, came = 0, run = 0, best = 0;
    if (reg) {
      Object.keys(reg.marks || {}).sort().forEach(function (iso) {
        var m = reg.marks[iso];
        if (m === "present") { came++; seen++; run++; if (run > best) best = run; }
        else if (m === "absent") { seen++; run = 0; }
      });
    }
    var rate = seen ? Math.round(came / seen * 100) : null;
    var days = reg ? MZ.dayLabel(daysOf(reg.batch_id)) : "";

    function stat(v, k) { return '<div class="fst"><b>' + v + "</b><span>" + k + "</span></div>"; }

    return '<div class="sheet" id="famSheet"><div class="card fam">' +
      '<div class="fam-hd" style="--hue:' + inst(d.sport).hue + '">' +
        '<span class="ig">' + svgIcon(inst(d.sport)) + "</span>" +
        "<div><b>" + esc(d.member_name) + "</b><span>" + esc(d.sport || "") +
          (days ? " \u00b7 " + esc(days) : "") +
          (d.already_sent ? " \u00b7 asked today" : "") + "</span></div></div>" +

      '<div class="fstats">' +
        stat(months == null ? "\u2013" : months, months === 1 ? "month here" : "months here") +
        stat(rate == null ? "\u2013" : rate + "%", "here this month") +
        stat(came || "\u2013", came === 1 ? "lesson" : "lessons") +
        stat(best || "\u2013", "best run") +
      "</div>" +

      '<div class="fowe"><span>Owing</span><b>' + inr(d.amount) + "</b>" +
        "<i>" + d.days_since + " day" + (d.days_since === 1 ? "" : "s") + " late</i></div>" +

      (d.blocked_reason === "missing_phone"
        ? '<div class="note" style="margin:0 0 10px">No phone number for this family, ' +
          "so there is nobody to message.</div>"
        : '<a class="btn bow wa" target="_blank" rel="noopener" href="' + esc(waLink(d)) + '"' +
          ' data-sent="' + d.enrollment_id + '" data-amt="' + d.amount + '"' +
          ' data-ph="' + esc(d.phone || "") + '">Send the reminder</a>') +
      '<button class="btn bow paid" data-paid="' + d.enrollment_id + '" data-amt="' + d.amount +
        '" data-nm="' + esc(d.member_name) + '" data-sport="' + esc(d.sport || "") +
        '">They have paid</button>' +
      '<button class="btn plec" id="famClose">Close</button>' +
    "</div></div>";
  }

  function loadMoney() {
    S.money = null;
    var r = MZ.monthRange(S.month.y, S.month.m);
    /* Three reads, one round trip. A round trip to Tokyo is ~180ms and
       the query itself is single-digit milliseconds, so the register
       rides along free — asking for it afterwards would double the
       wait for the whole tab. */
    return Promise.all([MZ.payments(r.from, r.to), MZ.expenses(r.from, r.to),
                        MZ.register(r.from, r.to)])
      .then(function (x) {
        S.money = { paid: x[0] || [], spent: x[1] || [], from: r.from, to: r.to,
                    rows: Array.isArray(x[2]) ? x[2] : [] };
        render();
      }).catch(fail);
  }
  /* ============================================================
     WHAT A ONE-TEACHER MUSIC SCHOOL CAN ACTUALLY BE TOLD

     His inventory is not seats, it is HIS OWN HOURS. He teaches every
     instrument himself, so the three questions worth a chart are:

       1. WHERE THE WEEK GOES.  Which days are full and which are
          empty. An empty Tuesday is not a statistic, it is a slot he
          can move somebody into or advertise. Only computable at all
          now that each child carries their own days.

       2. WHAT EACH INSTRUMENT EARNS.  Piano is the premium; the rest
          are not. The mix decides the money, and this is the only
          chart that says how to earn more without teaching longer.
          It SUMS money already collected — it does not price anything.
          Pricing is resolve_fee()'s job and lives in Postgres.

       3. WHO IS FADING.  Children do not resign from a music school,
          they drift. So each is measured against THEIR OWN earlier
          attendance, not against the school average: a child who has
          always come twice a month has not changed, and a child who
          came every week and now comes fortnightly has. That is a
          diminuendo, and it is the one number here that is worth a
          phone call this evening.
     ============================================================ */
  function pct(a, b) { return b ? Math.round(a / b * 100) : 0; }

  /* Attendance in the last third of the month against the two before,
     per child, both measured over the days that child was expected. */
  function fading(rows, from, to) {
    var d0 = new Date(from), d1 = new Date(to);
    /* END AT TODAY, not at the end of the month. Splitting a whole
       August in two on the 21st put the entire "recent" window in the
       future, where nobody has been marked yet — so every child fell
       under the minimum and the list was always empty. */
    var now = new Date(MZ.todayIso());
    if (now < d1) d1 = now;
    var span = Math.round((d1 - d0) / 864e5) + 1;
    if (span < 12) return [];
    var cut = new Date(d0.getTime() + Math.floor(span * 2 / 3) * 864e5);
    return rows.map(function (r) {
      var was = { seen: 0, came: 0 }, now = { seen: 0, came: 0 };
      for (var t = d0.getTime(); t <= d1.getTime(); t += 864e5) {
        var day = new Date(t), iso = MZ.iso(day);
        if (!runsOn(r.batch_id, iso) || isSunday(iso)) continue;
        var m = r.marks && r.marks[iso];
        if (m !== "present" && m !== "absent") continue;
        var b = day < cut ? was : now;
        b.seen++; if (m === "present") b.came++;
      }
      /* Too little to judge is not the same as fading. Three expected
         days either side is the floor; below that one missed lesson
         swings the number thirty points and the list fills with noise. */
      if (was.seen < 3 || now.seen < 3) return null;
      var drop = pct(was.came, was.seen) - pct(now.came, now.seen);
      return drop >= 25 ? { r: r, was: pct(was.came, was.seen),
                            now: pct(now.came, now.seen), drop: drop } : null;
    }).filter(Boolean).sort(function (a, b) { return b.drop - a.drop; });
  }

  /* ============================================================
     THE MONTH AS A WAVEFORM

     Money in above the centre line, money out below it — which is
     what every waveform he has ever looked at already does. A month
     of a music school has a shape: a cluster of fees in the first
     week, the rent as one deep trough, strings and rosin as small
     nicks. He can read that shape in a second and no table of
     thirty-one rows will ever tell him the same thing as fast.

     Tap a day and it says what happened, and plays it: a struck note
     for a day that took money in, a wooden thunk for one that only
     spent. Pitch rises with the size of the day.

     It is one graphic. The temptation on a finance screen is six.
     ============================================================ */
  /* Which day sits under this x. The columns are equal width, so it
     is one division — no per-column hit testing and no 9px targets. */
  function dayFromWave(strip, clientX) {
    var b = strip.getBoundingClientRect();
    var n = strip.querySelectorAll("[data-wday]").length || 1;
    var k = Math.floor((clientX - b.left) / (b.width / n)) + 1;
    return Math.min(n, Math.max(1, k));
  }
  /* Dragging along the wave reads it out as you go. The money tab is
     the heaviest screen in the app, so a drag never re-renders it —
     it moves the highlight and rewrites the one line of text. */
  function scrubWave() {
    var strip = root.querySelector("[data-wavestrip]");
    if (!strip || strip.__wired) return;
    strip.__wired = true;
    var live = false;
    function show(x) {
      var d = dayFromWave(strip, x);
      if (d === S.wave) return;
      S.wave = d;
      var cols = strip.querySelectorAll("[data-wday]");
      for (var i = 0; i < cols.length; i++) cols[i].classList.toggle("on", i + 1 === d);
      var note = root.querySelector(".wnote");
      if (note) note.outerHTML = waveNote(d);
    }
    strip.addEventListener("pointerdown", function (ev) {
      live = true; try { strip.setPointerCapture(ev.pointerId); } catch (e) {}
      show(ev.clientX);
    });
    strip.addEventListener("pointermove", function (ev) { if (live) show(ev.clientX); });
    strip.addEventListener("pointerup", function () { live = false; });
    strip.addEventListener("pointercancel", function () { live = false; });
  }

  function viewWave() {
    if (!S.money) return "";
    var y = S.month.y, m = S.month.m, days = MZ.monthRange(y, m).days;
    var inn = [], out = [], i;
    for (i = 0; i <= days; i++) { inn[i] = 0; out[i] = 0; }
    S.money.paid.forEach(function (p) {
      if (p.status === "void") return;
      var d = +String(p.on_date).slice(8, 10);
      if (d >= 1 && d <= days) inn[d] += Number(p.amount || 0);
    });
    S.money.spent.forEach(function (e) {
      var d = +String(e.on_date).slice(8, 10);
      if (d >= 1 && d <= days) out[d] += Number(e.amount || 0);
    });
    var peak = 1;
    for (i = 1; i <= days; i++) { peak = Math.max(peak, inn[i], out[i]); }

    var today = MZ.todayIso(), tDay = (+today.slice(0, 4) === y && +today.slice(5, 7) === m)
      ? +today.slice(8, 10) : 0;

    var cols = "";
    for (i = 1; i <= days; i++) {
      var up = Math.round(inn[i] / peak * 100), dn = Math.round(out[i] / peak * 100);
      /* NOT a button each. Thirty-one columns in 330px is a 9px
         target, which the audit caught and which no thumb can hit.
         The STRIP is the control: tap or drag anywhere along it and
         the nearest day is picked, which is also how you would run a
         finger along a waveform anyway. */
      cols += '<span class="wcol' + (S.wave === i ? " on" : "") +
        (i === tDay ? " today" : "") + '" data-wday="' + i + '">' +
        '<span class="half t"><i style="height:' + up + '%"></i></span>' +
        '<span class="half b"><i style="height:' + dn + '%"></i></span></span>';
    }


    return '<div class="card"><div class="rowline" style="margin-bottom:2px">' +
      '<b style="font-size:15px">The month\u2019s shape</b>' +
      '<span style="flex:1"></span><span class="muted">tap a day</span></div>' +
      '<div class="muted" style="margin-bottom:10px">In above the line, out below</div>' +
      '<div class="wave" data-wavestrip="1" role="group" aria-label="Day by day">' +
        cols + '<span class="zero"></span></div>' +
      '<div class="wscale"><span>1</span><span>' + days + "</span></div>" +
      waveNote(S.wave) +
    "</div>";
  }

  /* One day's line, on its own, so a drag can replace it without
     redrawing the heaviest screen in the app thirty times a second. */
  function waveNote(d) {
    if (!S.money || !d) {
      return '<div class="wnote quiet-only"><span class="quiet">' +
             "Tap or drag along the month to see what moved.</span></div>";
    }
    var y = S.month.y, m = S.month.m, got = 0, gone = 0;
    var fees = S.money.paid.filter(function (p) {
      return p.status !== "void" && +String(p.on_date).slice(8, 10) === d; });
    var bills = S.money.spent.filter(function (e) {
      return +String(e.on_date).slice(8, 10) === d; });
    fees.forEach(function (p) { got += Number(p.amount || 0); });
    bills.forEach(function (e) { gone += Number(e.amount || 0); });
    var when = new Date(y, m - 1, d).toLocaleDateString("en-IN", { day: "numeric", month: "long" });
    return '<div class="wnote"><b>' + esc(when) + "</b>" +
      (fees.length ? '<span class="in">+' + inr(got) + " \u00b7 " + fees.length +
        (fees.length === 1 ? " fee" : " fees") + "</span>" : "") +
      (bills.length ? '<span class="out">\u2212' + inr(gone) + " \u00b7 " +
        esc(bills.map(function (e) { return e.detail || e.category; }).join(", ")) + "</span>" : "") +
      (!fees.length && !bills.length ? '<span class="quiet">Nothing moved.</span>' : "") +
    "</div>";
  }

  function viewInsights() {
    var rows = (S.money && S.money.rows) || [];
    var paid = ((S.money && S.money.paid) || []).filter(function (p) { return p.status !== "void"; });
    if (!rows.length && !paid.length) return "";

    /* ---- 1. where the week goes ---- */
    var load = [0, 0, 0, 0, 0, 0, 0];
    rows.forEach(function (r) { daysOf(r.batch_id).forEach(function (d) { load[d]++; }); });
    var busiest = Math.max.apply(null, load.slice(1, 7)) || 1;
    var week = "";
    for (var d = 1; d <= 6; d++) {
      week += '<div class="bar"><i style="height:' + Math.round(load[d] / busiest * 100) + '%"></i>' +
              "<b>" + load[d] + "</b><span>" + DAY_NAMES[d] + "</span></div>";
    }
    var quietest = 1;
    for (var q = 2; q <= 6; q++) if (load[q] < load[quietest]) quietest = q;

    /* ---- 2. what each instrument earns ---- */
    var byIns = {}, top = 0, earned = 0;
    paid.forEach(function (p) {
      var k = p.sport || "Other", v = Number(p.amount || 0);
      byIns[k] = (byIns[k] || 0) + v; earned += v;
      if (byIns[k] > top) top = byIns[k];
    });
    var ins = Object.keys(byIns).sort(function (a, b) { return byIns[b] - byIns[a]; });
    var heads = {};
    rows.forEach(function (r) { heads[r.sport] = (heads[r.sport] || 0) + 1; });

    /* ---- 3. who is fading ---- */
    var slipping = S.money ? fading(rows, S.money.from, S.money.to) : [];

    return '<div class="card"><h3 style="font-size:15px;margin-bottom:2px">Where the week goes</h3>' +
      '<div class="muted" style="margin-bottom:12px">How many children each day carries</div>' +
      '<div class="week">' + week + "</div>" +
      (load[quietest] < busiest * 0.6
        ? '<div class="muted" style="margin-top:10px">' + DAY_NAMES[quietest] +
          " is your quietest day \u2014 " + load[quietest] + " against " + busiest +
          " at your busiest. That is room, not a gap.</div>"
        : "") + "</div>" +

      (ins.length
        ? '<div class="card"><h3 style="font-size:15px;margin-bottom:2px">What each instrument earned</h3>' +
          '<div class="muted" style="margin-bottom:12px">' + inr(earned) + " collected this month</div>" +
          ins.map(function (k) {
            var n = heads[k] || 0;
            return '<div class="insbar" style="--hue:' + inst(k).hue + '">' +
              '<span class="k">' + esc(k) + "</span>" +
              '<span class="t"><i style="width:' + Math.round(byIns[k] / top * 100) + '%"></i></span>' +
              '<span class="v">' + inr(byIns[k]) + "</span></div>" +
              (n ? '<div class="insub">' + n + " playing \u00b7 " + inr(Math.round(byIns[k] / n)) +
                   " each</div>" : "");
          }).join("") + "</div>"
        : "") +

      (slipping.length
        ? '<div class="card"><h3 style="font-size:15px;margin-bottom:2px">Losing the thread</h3>' +
          '<div class="muted" style="margin-bottom:12px">Coming less than they used to. ' +
          "Measured against their own earlier weeks, not against anyone else.</div>" +
          slipping.slice(0, 8).map(function (f) {
            return '<div class="dim-row" style="--hue:' + inst(f.r.sport).hue + '">' +
              '<div class="nm"><b>' + esc(f.r.member_name) + "</b><span>" +
              esc(f.r.sport || "") + " \u00b7 " + MZ.dayLabel(daysOf(f.r.batch_id)) + "</span></div>" +
              '<svg class="hairpin" viewBox="0 0 60 16" aria-hidden="true">' +
                '<path d="M1 2 L57 8 M1 14 L57 8"/></svg>' +
              '<div class="fg"><b>' + f.was + "% \u2192 " + f.now + '%</b></div></div>';
          }).join("") + "</div>"
        : "");
  }

  function viewMoney() {
    var mn = new Date(S.month.y, S.month.m - 1, 1)
      .toLocaleDateString("en-IN", { month: "long", year: "numeric" });
    var head = '<div class="daybar">' +
      '<button data-mon="-1">‹</button>' +
      '<div class="d"><b>' + esc(mn) + "</b><span>this month</span></div>" +
      '<button data-mon="1">›</button></div>';
    if (!S.money) return head + '<div class="note">Loading…</div>';

    var inTot = S.money.paid.filter(function (p) { return p.status !== "void"; })
                            .reduce(function (a, p) { return a + Number(p.amount || 0); }, 0);
    var outTot = S.money.spent.reduce(function (a, p) { return a + Number(p.amount || 0); }, 0);

    return head +
      '<div class="card"><div class="figs">' +
        '<div class="fig in"><b>' + inr(inTot) + "</b><span>Fees collected</span></div>" +
        '<div class="fig out"><b>' + inr(outTot) + "</b><span>Spent</span></div>" +
        '<div class="fig"><b>' + inr(inTot - outTot) + "</b><span>Left</span></div>" +
      "</div></div>" +
      viewWave() +
      '<div class="card"><h3 style="font-size:15px;margin-bottom:12px">Add an expense</h3>' +
        '<label class="field"><span>How much</span>' +
          '<input id="exAmt" type="number" inputmode="numeric" min="1" placeholder="0" /></label>' +
        '<label class="field"><span>What for</span>' +
          '<input id="exWhat" placeholder="Guitar strings, rent, electricity…" /></label>' +
        '<button class="btn bow" id="exSave">Save expense</button>' +
      "</div>" +
      (S.money.spent.length
        ? '<div class="card"><h3 style="font-size:15px;margin-bottom:6px">Spent this month</h3>' +
          S.money.spent.map(function (e) {
            /* An expense typed wrong stayed wrong for ever: there was
               no way to change it and no way to take it off. Editing
               is inline; removing asks once, because money leaving the
               books by accident is worse than one extra tap. */
            if (S.exEdit === e.id) {
              return '<div class="srow exedit">' +
                '<input id="exeWhat" value="' + esc(e.detail || e.category || "") + '" />' +
                '<input id="exeAmt" type="number" inputmode="numeric" value="' + Number(e.amount) + '" />' +
                '<button class="mini go" data-exsave="' + e.id + '">Save</button>' +
                '<button class="mini" data-excancel="1">Cancel</button></div>';
            }
            if (S.exKill === e.id) {
              return '<div class="srow exedit"><div class="nm"><b>Remove ' +
                esc(e.detail || e.category) + "?</b><span>" + inr(e.amount) + "</span></div>" +
                '<button class="mini bad" data-exkillyes="' + e.id + '">Remove</button>' +
                '<button class="mini" data-excancel="1">Keep</button></div>';
            }
            return '<div class="srow"><div class="nm"><b>' + esc(e.detail || e.category) + "</b>" +
              "<span>" + new Date(e.on_date).toLocaleDateString("en-IN", { day: "numeric", month: "short" }) +
              "</span></div><b>" + inr(e.amount) + "</b>" +
              /* Two words plus an amount plus a name does not fit a
                 382px row — the controls wrapped on top of the money.
                 A pencil and a cross are the same two acts in 80px. */
              '<button class="mini ic" data-exedit="' + e.id + '" aria-label="Change">\u270e</button>' +
              '<button class="mini ic" data-exkill="' + e.id + '" aria-label="Remove">\u00d7</button>' +
            "</div>";
          }).join("") + "</div>"
        : "") +
      (S.money.paid.length
        ? '<div class="card"><h3 style="font-size:15px;margin-bottom:6px">Fees received</h3>' +
          '<div class="muted" style="margin-bottom:8px">' + S.money.paid.length + " payment" +
          (S.money.paid.length === 1 ? "" : "s") + "</div>" +
          S.money.paid.slice(0, 30).map(function (p) {
            var dead = p.status === "void";
            return '<div class="srow' + (dead ? " voided" : "") + '">' +
              '<div class="nm"><b>' + inr(p.amount) + "</b><span>" +
              new Date(p.on_date).toLocaleDateString("en-IN", { day: "numeric", month: "short" }) +
              " · " + esc(p.mode || "") + (dead ? " · cancelled" : "") + "</span></div>" +
              (dead ? "" : '<button class="undo" data-void="' + p.id + '">Undo</button>') +
            "</div>";
          }).join("") + "</div>"
        : "") +
      viewInsights();
  }

  /* ============================================================
     TAKING MONEY

     This used to be one window.confirm() that recorded the exact
     amount reminder_queue quoted, for one month, as UPI, and only
     ever for somebody already overdue. Three things were wrong with
     that and one of them reached the parent:

       · a family paying ON TIME had nowhere to be recorded, because
         the only Paid button lived in the overdue list;
       · every rupee was filed as UPI, in a school that takes cash;
       · a term paid up front was recorded as one month, so
         renewal_on rolled forward once and the platform chased them
         again the following month for money already paid.

     So there is a sheet now. It asks the three things that actually
     vary and nothing else, and it is only ever on screen while he is
     taking money — the register behind it is untouched.

     THE AMOUNT STILL COMES FROM POSTGRES. enrollment_fee() prices the
     months; this file only ever displays what it is told and sends
     back what he confirms. */
  function viewPay() {
    var p = S.pay;
    return '<div class="sheet"><div class="card">' +
      '<h3 style="font-size:19px;margin-bottom:2px">' + esc(p.name) + "</h3>" +
      '<div class="muted" style="margin-bottom:14px">' + esc(p.sport || "") + "</div>" +

      '<label class="field"><span>How much</span>' +
        '<input id="payAmt" type="number" inputmode="numeric" min="1" value="' +
        (p.amount == null ? "" : p.amount) + '" /></label>' +

      '<span class="field"><span>How many months</span></span>' +
      '<div class="frow" style="margin-bottom:14px">' +
        [1, 2, 3, 6, 12].map(function (m) {
          return '<button class="chip' + (p.months === m ? " on" : "") +
                 '" data-paymonths="' + m + '">' + m + "</button>";
        }).join("") +
      "</div>" +

      '<span class="field"><span>How it was paid</span></span>' +
      '<div class="frow" style="margin-bottom:18px">' +
        ["Cash", "UPI"].map(function (m) {
          return '<button class="chip' + (p.mode === m ? " on" : "") +
                 '" data-paymode="' + esc(m) + '">' + m + "</button>";
        }).join("") +
      "</div>" +

      '<button class="btn" id="payGo">Record ' + (p.amount ? inr(p.amount) : "payment") + "</button>" +
      '<button class="btn ghost" id="payCancel" style="margin-top:8px">Cancel</button>' +
    "</div></div>";
  }

  /* Ask the database what this costs for that many months, and never
     work it out here. A null answer leaves the field as he typed it. */
  function repriceAndRender() {
    render();
    if (!S.pay || !S.pay.enrollment) return;
    var want = S.pay;
    MZ.feeFor(want.enrollment, want.months).then(function (v) {
      if (S.pay !== want) return;                 /* he moved on */
      var amt = v && (v.amount != null ? v.amount : (v[0] && v[0].amount));
      if (amt != null) { S.pay.amount = amt; render(); }
    });
  }

  function openPay(enrollment, name, sport, amount) {
    S.pay = { enrollment: enrollment, name: name, sport: sport,
              amount: amount == null ? null : amount, months: 1, mode: "Cash" };
    if (amount == null) repriceAndRender(); else render();
  }

  function confirmPay() {
    var el = document.getElementById("payAmt");
    var amt = el ? Math.round(+el.value) : 0;
    if (!amt || amt <= 0) { S.err = "Enter how much was paid."; return render(); }
    var b = document.getElementById("payGo");
    if (b) { b.disabled = true; b.textContent = "Recording…"; }
    MZ.takePayment({ enrollment: S.pay.enrollment, amount: amt,
                     months: S.pay.months, mode: S.pay.mode })
      .then(function () {
        toast("Payment recorded"); S.pay = null; S.err = ""; loadDues();
      })
      .catch(function (e) {
        if (b) { b.disabled = false; b.textContent = "Record " + inr(amt); }
        fail(e);
      });
  }

  /* ---------- who else has paid ----------
     The picker is the answer to "somebody paid and they are not on
     the overdue list". It reads members, which is the one call this
     app had never made. */
  function loadPicker() {
    S.picker = { rows: null, q: "" };
    render();
    MZ.students().then(function (rows) {
      S.picker = { rows: rows || [], q: (S.picker && S.picker.q) || "" };
      render();
    }).catch(fail);
  }
  function viewPicker() {
    var pk = S.picker;
    var body = '<div class="sheet"><div class="card">' +
      '<h3 style="font-size:18px;margin-bottom:10px">Who paid?</h3>' +
      '<input class="search" id="pq" placeholder="Find a student…" value="' + esc(pk.q) + '" />';
    if (!pk.rows) return body + '<div class="note">Loading…</div>' +
      '<button class="btn ghost" id="pkCancel" style="margin-top:10px">Cancel</button></div></div>';

    var q = pk.q.toLowerCase();
    var rows = pk.rows.filter(function (m) {
      return !q || (m.name || "").toLowerCase().indexOf(q) >= 0;
    }).slice(0, 40);

    body += rows.map(function (m) {
      var e = (m.enrollments || [])[0] || {};
      var ins = inst(e.sport);
      return '<div class="srow key tuned" style="--hue:' + ins.hue + '"' +
        ' data-pick="' + (e.id || "") + '" data-nm="' + esc(m.name) +
        '" data-sport="' + esc(e.sport || "") + '">' +
        '<span class="ig">' + svgIcon(ins) + "</span>" +
        '<div class="nm"><b>' + esc(m.name) + "</b><span>" + esc(e.sport || "no instrument") + "</span></div>" +
      "</div>";
    }).join("") || '<div class="note">Nobody matches that.</div>';

    return body + '<button class="btn ghost" id="pkCancel" style="margin-top:10px">Cancel</button></div></div>';
  }

  /* ============================================================
     ONE STUDENT

     Everything about a child that is not "were they here today" lives
     on one sheet, reached by tapping their name. Nothing was added to
     the row to make this possible — the name was already there, and a
     name is the obvious thing to press when you want the person.

     It is also the only place anything can be UNDONE, which is why it
     exists at all: before this there was no way to fix a wrong phone
     number, no way to move a child from guitar to piano, and no way
     to stop a child who had left. They stayed on the register and in
     the dues list for ever.
     ============================================================ */
  function viewWho() {
    var w = S.who;
    var ins = (S.ref && S.ref.instruments) || [];
    var bs  = (S.ref && S.ref.batches) || [];
    return '<div class="sheet"><div class="card">' +
      '<div class="rowline" style="margin-bottom:14px">' +
        '<span class="ig" style="--hue:' + inst(w.sport).hue + '">' + svgIcon(inst(w.sport)) + "</span>" +
        '<h3 style="font-size:19px;flex:1">' + esc(w.name) + "</h3></div>" +

      '<label class="field"><span>Name</span>' +
        '<input id="whName" value="' + esc(w.name) + '" /></label>' +
      '<label class="field"><span>Parent\u2019s phone</span>' +
        '<input id="whPhone" type="tel" inputmode="numeric"' +
        (w.asked ? ' placeholder="10 digits"' : ' disabled placeholder="Loading\u2026"') +
        ' value="' + esc(w.phone || "") + '" /></label>' +
      '<label class="field"><span>Instrument</span><select id="whIns">' +
        ins.map(function (i) {
          return '<option value="' + esc(i.name) + '"' +
                 (i.name === w.sport ? " selected" : "") + ">" + esc(i.name) + "</option>";
        }).join("") + "</select></label>" +
      '<div class="field"><span>Comes on</span>' + dayPicker("whDays", w.days || []) +
        '<em class="daysum' + (w.days && w.days.length ? "" : " dim") + '">' +
        esc(w.days && w.days.length ? MZ.dayLabel(w.days) : "Pick the days he comes") +
        "</em></div>" +

      '<button class="btn" id="whSave">Save changes</button>' +
      '<button class="btn ghost" id="whPay" style="margin-top:8px">Record a payment</button>' +
      '<button class="btn ghost" id="whCancel" style="margin-top:8px">Close</button>' +

      /* Last, separated, and it says what it does rather than "delete".
         Nothing is deleted: the child and every mark they ever earned
         stay exactly where they are. */
      '<div class="danger">' +
        (w.confirmStop
          ? '<p class="muted" style="margin-bottom:10px">' + esc(w.name) +
            " will come off the register and out of the fees list. " +
            "Nothing already recorded is deleted.</p>" +
            '<button class="btn stop" id="whStopYes">Yes, ' + esc(w.name) + " has stopped</button>" +
            '<button class="btn ghost" id="whStopNo" style="margin-top:8px">No, keep them</button>'
          : '<button class="btn ghost stop-link" id="whStop">' + esc(w.name) +
            " has stopped coming</button>") +
      "</div>" +
    "</div></div>";
  }

  function openWho(el) {
    S.who = {
      enrollment: +el.getAttribute("data-who") || null,
      member: +el.getAttribute("data-mem") || null,
      name: el.getAttribute("data-nm") || "",
      sport: el.getAttribute("data-sport") || "",
      batch: +el.getAttribute("data-batch") || null,
      days: daysOf(+el.getAttribute("data-batch")),
      phone: "", loaded: false,
      confirmStop: false
    };
    var want = S.who;
    /* The instrument and batch pickers need the reference data, which
       may not have arrived yet on a cold open. */
    if (!S.ref) MZ.reference().then(function (r) {
      S.ref = r;
      /* The days are read OUT of the reference, so on a cold open the
         picker would have come up blank and saving would have wiped
         the child's days. Fill them in when it lands. */
      if (S.who === want && !want.days.length) want.days = daysOf(want.batch);
      render();
    }).catch(function () {});
    /* And the phone number is not in the register's data at all. */
    if (want.member) {
      MZ.student(want.member).then(function (m) {
        if (S.who !== want) return;
        S.who.phone  = (m && (m.phone || m.parent_phone)) || "";
        S.who.loaded = !!m;
        /* Even when the read came back with nothing, unlock the box —
           a field stuck on "Loading…" for ever is worse than one he
           can type into, and saveWho() still refuses to send an empty
           one it never read. */
        S.who.asked  = true;
        render();
      }).catch(function () {
        if (S.who !== want) return;
        S.who.asked = true; render();
      });
    }
    render();
  }

  function saveWho() {
    var w = S.who;
    var b = document.getElementById("whSave");
    if (b) { b.disabled = true; b.textContent = "Saving…"; }
    var name  = (document.getElementById("whName") || {}).value;
    var insEl = document.getElementById("whIns");
    /* undefined, not "", when the number has not loaded: editStudent
       skips a field it is not given, and writing an empty box over a
       real number would silently cut that family off from reminders. */
    /* Send it if we read it (so a deliberate clear works), or if he
       typed one (so a missing number can be added). Never send an
       empty box we never read — that is the case that wipes a real
       number and takes the family's reminders with it. */
    var typed = ((document.getElementById("whPhone") || {}).value || "").replace(/\D/g, "");
    var phone = (w.loaded || typed) ? typed : undefined;
    MZ.editStudent(w.member, { name: name, phone: phone })
      .then(function () {
        return MZ.moveEnrollment(w.enrollment, {
          instrument: insEl && insEl.value, days: w.days
        });
      })
      .then(function () {
        toast("Saved"); S.who = null; loadRegister(); render();
      })
      .catch(function (e) {
        if (b) { b.disabled = false; b.textContent = "Save changes"; }
        fail(e);
      });
  }

  function stopWho() {
    var w = S.who;
    var b = document.getElementById("whStopYes");
    if (b) { b.disabled = true; b.textContent = "Stopping…"; }
    MZ.stopStudent(w.member, "stopped coming")
      .then(function () {
        toast(w.name + " is off the register"); S.who = null; loadRegister(); render();
      })
      .catch(function (e) {
        if (b) { b.disabled = false; b.textContent = "Yes, " + w.name + " has stopped"; }
        fail(e);
      });
  }

  /* ---------- add a student ---------- */
  function viewAdd() {
    var E = S.nsErr || {};
    var ins = (S.ref && S.ref.instruments) || [], bs = (S.ref && S.ref.batches) || [];
    return '<div class="card"><h3 style="font-size:17px;margin-bottom:14px">New student</h3>' +
      /* Errors sit under the field they are about. A single message at
         the top of a form is a message he has to map back onto a box
         himself, and the box he has to fix is usually off-screen. */
      '<label class="field' + (E.name ? " bad" : "") + '"><span>Name</span>' +
        '<input id="nsName" value="' + esc(S.nsVals.name || "") + '" />' +
        (E.name ? '<em class="ferr">' + E.name + "</em>" : "") + "</label>" +
      '<label class="field' + (E.phone ? " bad" : "") + '"><span>Parent\u2019s phone</span>' +
        '<input id="nsPhone" type="tel" inputmode="numeric" placeholder="10 digits" value="' +
          esc(S.nsVals.phone || "") + '" />' +
        (E.phone ? '<em class="ferr">' + E.phone + "</em>" : "") + "</label>" +
