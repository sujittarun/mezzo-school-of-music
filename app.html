    var de = document.documentElement;
    var max = Math.max(0, de.scrollHeight - (window.innerHeight || de.clientHeight || 0));
    var y = sec.getBoundingClientRect().top + (window.pageYOffset || 0) - 10;
    window.scrollTo(0, Math.max(0, Math.min(max, y)));
    sec.classList.remove("jumped");
    void sec.offsetWidth;
    sec.classList.add("jumped");
  }

  /* A NEEDLE THAT IS ALREADY THERE IS A PICTURE OF A NEEDLE.

     It sweeps up from hard flat and settles, overshooting a little the
     way a real one does — and when the count changes because somebody
     paid, it swings from where it was to where it now is rather than
     cutting. That is the whole reason to draw a needle instead of a
     number.

     The transform ATTRIBUTE, not a CSS transform: rotating a group
     about an arbitrary point needs transform-box/transform-origin,
     which is a support question on iPad, while rotate(a cx cy) is SVG
     1.1 and is not. Measured in the preview: both worked in Chromium,
     only one of them is guaranteed. */
  function paintNeedle() {
    var g = root.querySelector(".card.tuner .nd");
    if (!g) { S.lastDeg = null; return; }
    var to = Number(g.getAttribute("data-deg"));
    var from = S.lastDeg == null ? -78 : S.lastDeg;
    S.lastDeg = to;
    var still = false;
    try { still = matchMedia("(prefers-reduced-motion: reduce)").matches; } catch (e) {}
    if (still || from === to) return;          /* the attribute is already right */

    /* THE SWING MUST NOT BE ABLE TO LIE.
       requestAnimationFrame does not run while the page is not being
       painted, so a swing interrupted by switching apps stops wherever
       it had got to — and where it got to is a reading of the school
       that is simply wrong. Caught in the preview with the needle
       parked at -25.68 while the truth was -11.38.

       So the landing is a promise kept by a timer, not by the loop. */
    var done = false, t0 = 0;
    function land() {
      if (done) return;
      done = true;
      if (g.isConnected) g.setAttribute("transform", "rotate(" + to + " 130 118)");
    }
    function frame(ts) {
      /* render() rebuilds the DOM, so the node this loop started on can
         be detached mid-swing. Writing to it would be silent and the
         real needle would sit at the old angle for ever. */
      if (done || !g.isConnected) return;
      if (!t0) t0 = ts;
      var k = Math.min(1, (ts - t0) / 780);
      var u = k - 1, e = 1 + 2.0 * u * u * u + 1.3 * u * u;   /* settle, with a little overshoot */
      g.setAttribute("transform",
        "rotate(" + (from + (to - from) * e).toFixed(2) + " 130 118)");
      if (k < 1) requestAnimationFrame(frame); else done = true;
    }
    g.setAttribute("transform", "rotate(" + from + " 130 118)");
    requestAnimationFrame(frame);
    setTimeout(land, 900);
  }

  function viewDues() {
    if (!S.people) return '<div class="note">Loading…</div>';
    var flat = S.people.filter(function (p) { return p.due && !p.paused; });
    var owedTotal = flat.reduce(function (a, p) { return a + Number(p.due.amount || 0); }, 0);
    if (!S.people.length) {
      return '<div class="card tuner"><div class="tn-allin">' +
        '<div class="tn-ring"><b>\u266a</b></div><b>Nobody on the roll yet.</b>' +
        "<span>Add a student from the register.</span></div></div>";
    }

    var paused = S.people.filter(function (p) { return p.paused; });
    /* ONE count per band, read by the lamp AND by the heading it jumps
       to. Two places counting the same thing is how a lamp saying 14
       ends up over a heading saying 13. */
    var band = { flat: flat.length, paused: paused.length,
                 ok: S.people.length - flat.length - paused.length };
    var TITLE = { flat: "Out of tune", ok: "In tune", paused: "Paused" };

    var shown = {}, rows = "";
    S.people.forEach(function (p, i) {
      var b = p.paused ? "paused" : p.due ? "flat" : "ok";
      if (!shown[b]) {
        shown[b] = true;
        rows += '<div class="msec" data-sec="' + b + '">' +
          TITLE[b] + " \u2014 " + band[b] + "</div>";
      }
      rows += memberRow(p, i);
    });

    /* "Someone else paid" is a RARE act — somebody handed over cash
       for a child who is not on the overdue list. It sat directly
       under the dial, where the eye lands first, competing with the
       ninety-six names it is not about. It goes to the foot of the
       roll, as a line rather than a button. */
    return '<div class="card tuner">' + tunerFace(band, owedTotal) +
      rows +
      '<button class="rest-link" data-other="1" style="margin-top:16px">' +
        "Someone else paid \u2014 record it</button></div>";
  }

  /* ============================================================
     THE SLIDER IS THE FEE CYCLE, NOT JUST LATENESS

     Thirty days before the fee falls due the mark sits at the far
     LEFT. It creeps right one day at a time, reaches dead CENTRE on
     the renewal day itself, and carries on right as the days go past.

     So the position answers "where is this family in the month" —
     which is a thing he can act on early — rather than only "how late
     are they", which he can only act on once it is already a problem.

     THE COLOUR IS A SWEEP, NOT THREE BUCKETS. It is one hue moving
     continuously from green through yellow and amber to red as the
     mark travels, so a family one day further on is a shade further
     over. Stepped colours would say "you have crossed into the amber
     band", which is a thing that did not happen to them.
     ============================================================ */
  var DUE_SPAN = 30;                     /* days either side of centre */

  /* days until the fee is due: positive is still to come, negative is
     already past. reminder_queue is the authority once they are late;
     the enrolment's renewal date is all we have before that. */
  function daysToDue(p) {
    if (p.due && p.due.days_since != null) return -Number(p.due.days_since);
    if (!p.renewal_on) return null;
    var d0 = new Date(MZ.todayIso()), d1 = new Date(p.renewal_on);
    if (isNaN(d1)) return null;
    return Math.round((d1 - d0) / 864e5);
  }
  /* 0 at the far left (a month to go) to 1 at the far right (a month
     over), 0.5 on the day itself */
  function duePos(days) {
    if (days == null) return 0.5;
    return Math.min(1, Math.max(0, 0.5 - (days / DUE_SPAN) * 0.5));
  }
  /* One hue, swept. 145 is green, 45 is amber at the centre, 2 is red
     — and every value between them is a real colour rather than a
     bucket boundary. */
  function dueColour(t) {
    var h = t <= 0.5 ? 145 - (t / 0.5) * 100 : 45 - ((t - 0.5) / 0.5) * 43;
    var l = t <= 0.5 ? 34 + (t / 0.5) * 4 : 38 - ((t - 0.5) / 0.5) * 4;
    return "hsl(" + h.toFixed(0) + " 62% " + l.toFixed(0) + "%)";
  }

  function memberRow(p, i) {
    var hue = inst(p.sport).hue;
    if (p.paused) {
      return '<button class="mrow rest" data-fam="' + i + '" style="--hue:' + hue + '">' +
        '<span class="mnote">' + (TUNER_NOTE[p.sport] || "\u266a") + "</span>" +
        '<span class="mwho"><b>' + esc(p.name) + "</b><span>" + esc(p.sport || "") + "</span></span>" +
        '<span class="mtrack rest"></span>' +
        '<span class="mamt"><b>\u2016</b><span>paused</span></span></button>';
    }

    var days = daysToDue(p), t = duePos(days), col = dueColour(t);
    /* inside the gate: due within a day either way, which is the one
       moment a tuner is telling you to stop turning */
    var inGate = days != null && Math.abs(days) <= 1;
    var ticks = "";
    for (var k = 0; k <= 8; k++) {
      ticks += '<i class="mtk' + (k === 4 ? " mid" : "") + '" style="left:' + (k * 12.5) + '%"></i>';
    }
    var amt = p.due
      ? "<b>" + inr(p.due.amount) + "</b><span>" +
        p.due.days_since + (p.due.days_since === 1 ? " day over" : " days over") + "</span>"
      : days == null
        ? "<b>\u2713</b><span>in tune</span>"
        : days === 0
          ? "<b>\u2713</b><span>due today</span>"
          : "<b>\u2713</b><span>in " + days + (days === 1 ? " day" : " days") + "</span>";

    return '<button class="mrow' + (p.due ? "" : " ok") + '" data-fam="' + i +
        '" style="--hue:' + hue + ';--mark:' + col + '">' +
      '<span class="mnote" style="color:' + col + '">' +
        (TUNER_NOTE[p.sport] || "\u266a") + "</span>" +
      '<span class="mwho"><b>' + esc(p.name) + "</b><span>" + esc(p.sport || "") +
        (p.due && p.due.already_sent ? " \u00b7 asked" : "") + "</span></span>" +
      /* mgate, NOT gate. `.gate` is the SIGN-IN SCREEN — position
         fixed, inset 0 — and a plain `.gate` inside a row paints a
         black slab down the whole page. This is the second time; the
         check below now fails the build if it comes back. */
      /* A NEEDLE, NOT A DOT.
         On a tuner one thing moves and one thing stays: the needle
         sweeps, the gate holds the centre, and the read is watching
         a line travel toward a fixed target. A dot sliding along a
         rail is a slider — which is why this never looked like a
         tuner however the gate was drawn. The gate lights when the
         needle is inside it. */
      '<span class="mtrack' + (inGate ? " lit" : "") + '">' + ticks +
        '<span class="mgate"></span>' +
        '<i class="mk" style="left:' + (t * 100).toFixed(1) + '%"></i></span>' +
      '<span class="mamt">' + amt + "</span></button>";
  }

  /* ============================================================
     THE FAMILY CARD

     Opened from a name on the tuner. It answers the question he
     actually has before he sends a message — is this a family that
     has been here for years and forgets, or one that joined in June
     and is already slipping? — and only then offers the two things he
     can do about it.

     Every number on it is real. Nothing is computed that the database
     did not already say, and no fee is priced here: the amount is the
     one reminder_queue() returned.
     ============================================================ */
  function monthsBetween(a, b) {
    if (!a) return null;
    var d0 = new Date(a), d1 = new Date(b || MZ.todayIso());
    if (isNaN(d0)) return null;
    var m = (d1.getFullYear() - d0.getFullYear()) * 12 + (d1.getMonth() - d0.getMonth());
    if (d1.getDate() < d0.getDate()) m--;
    return Math.max(0, m);
  }
  function viewFam() {
    var pr = S.people && S.people[S.fam];
    if (!pr) return "";
    /* the reminder_queue row if they owe, and a stand-in if they do
       not — the card is the same card either way */
    var d = pr.due || { amount: 0, days_since: 0, sport: pr.sport,
                        member_name: pr.name, enrollment_id: pr.enrollment_id,
                        phone: pr.phone, already_sent: false };
    var w = S.famInfo || {};
    var reg = (S.duesReg || []).filter(function (r) {
      return r.enrollment_id === pr.enrollment_id;
    })[0];

    /* how long they have been coming */
    var since = w.joined || (w.enrollments && w.enrollments[0] && w.enrollments[0].joined_on);
    var months = monthsBetween(since);

    /* this month, over the days this child was actually expected */
    var seen = 0, came = 0, run = 0, best = 0;
    if (reg) {
      Object.keys(reg.marks || {}).sort().forEach(function (iso) {
        var m = reg.marks[iso];
        if (m === "present") { came++; seen++; run++; if (run > best) best = run; }
        else if (m === "absent") { seen++; run = 0; }
      });
    }
    var rate = seen ? Math.round(came / seen * 100) : null;
    var days = reg ? MZ.dayLabel(daysOf(reg.batch_id)) : "";

    function stat(v, k) { return '<div class="fst"><b>' + v + "</b><span>" + k + "</span></div>"; }

    return '<div class="sheet" id="famSheet"><div class="card fam">' +
      '<div class="fam-hd" style="--hue:' + inst(d.sport).hue + '">' +
        '<span class="ig">' + svgIcon(inst(d.sport)) + "</span>" +
        "<div><b>" + esc(d.member_name) + "</b><span>" + esc(d.sport || "") +
          (days ? " \u00b7 " + esc(days) : "") +
          (d.already_sent ? " \u00b7 asked today" : "") + "</span></div></div>" +

      '<div class="fstats">' +
        stat(months == null ? "\u2013" : months, months === 1 ? "month here" : "months here") +
        stat(rate == null ? "\u2013" : rate + "%", "here this month") +
        stat(came || "\u2013", came === 1 ? "lesson" : "lessons") +
        stat(best || "\u2013", "best run") +
      "</div>" +

      /* Two states, written out flat rather than nested. The first
         version of this was three ternaries inside each other and it
         did not even parse. */
      (pr.paused ? ""
        : pr.due
        ? '<div class="fowe"><span>Owing</span><b>' + inr(d.amount) + "</b>" +
          "<i>" + d.days_since + " day" + (d.days_since === 1 ? "" : "s") + " late</i></div>"
        : '<div class="fowe ok"><span>In tune</span><b>\u2713</b><i>' +
          (pr.renewal_on
            ? "next " + new Date(pr.renewal_on).toLocaleDateString("en-IN",
                { day: "numeric", month: "short" })
            : "nothing owing") + "</i></div>") +

      /* Chasing a family and pausing them are different intents. With
         both on screen the pause panel sat under two full-width
         actions on a card already at its height limit, so choosing
         "away for a while" meant scrolling to find the thing you had
         just asked for. Opening the panel takes the card over. */
      (S.pausing === pr.enrollment_id ? "" : famActions(pr, d)) +
      (pr.paused ? "" : pausePanel(pr)) +
      '<button class="btn plec" id="famClose">Close</button>' +
    "</div></div>";
  }

  /* HOW LONG, THEN PAUSE. One question, three answers, and the date
     the next fee lands is shown before he commits — because that is
     the thing the pause actually changes. */
  function pausePanel(pr) {
    if (S.pausing !== pr.enrollment_id) {
      return '<button class="rest-link" data-pausing="' + pr.enrollment_id +
        '">Pause \u2014 away for a while</button>';
    }
    var m = S.pauseMonths || 1;
    var next = pr.renewal_on ? MZ.monthOn(pr.renewal_on, m) : null;
    return '<div class="pausebox"><b>Away for how long?</b>' +
      '<div class="stops">' +
        [1, 2, 3].map(function (n) {
          return '<button type="button" data-pausem="' + n + '"' +
            (m === n ? ' class="on"' : "") + '><i><em>' + n + "</em></i><span>" +
            (n === 1 ? "month" : "months") + "</span></button>";
        }).join("") +
      "</div>" +
      '<span class="pnote">' +
        (next
          ? "Next fee moves to " +
            new Date(next).toLocaleDateString("en-IN", { day: "numeric", month: "short", year: "numeric" })
          : "No renewal date set, so nothing to move.") + "</span>" +
      /* data-pmonths, not data-months: the month-jump button in the
         daybar is [data-months] and this one only escaped it because
         [data-pause] happens to be tested first. */
      '<button class="btn bow" data-pause="' + pr.enrollment_id +
        '" data-nm="' + esc(pr.name) + '" data-pmonths="' + m +
        '" data-ren="' + esc(pr.renewal_on || "") + '">Pause ' + esc(pr.name) + "</button>" +
      '<button class="rest-link" data-pausecancel="1">Not now</button></div>';
  }

  /* What he can do about this family. A settled one can still pay
     early, which is the only reason that button is there at all. */
  function famActions(pr, d) {
    if (pr.paused) {
      /* A paused member has nothing owing and nothing to chase — the
         only thing to do about them is bring them back. */
      return '<div class="fowe rest"><span>Paused</span><b>\u2016</b>' +
        "<i>off the register</i></div>" +
        '<button class="btn bow" data-resume="' + pr.enrollment_id +
        '" data-nm="' + esc(pr.name) + '">Bring back</button>';
    }
    if (!pr.due) {
      return '<button class="btn bow paid" data-paid="' + pr.enrollment_id +
        '" data-nm="' + esc(pr.name) + '" data-sport="' + esc(pr.sport || "") +
        '">Record a payment</button>';
    }
    var ask = d.blocked_reason === "missing_phone"
      ? '<div class="note" style="margin:0 0 10px">No phone number for this family, ' +
        "so there is nobody to message.</div>"
      : '<a class="btn bow wa" target="_blank" rel="noopener" href="' + esc(waLink(d)) + '"' +
        ' data-sent="' + d.enrollment_id + '" data-amt="' + d.amount + '"' +
        ' data-ph="' + esc(d.phone || "") + '">Send the reminder</a>';
    return ask +
      '<button class="btn bow paid" data-paid="' + d.enrollment_id + '" data-amt="' + d.amount +
      '" data-nm="' + esc(d.member_name) + '" data-sport="' + esc(d.sport || "") +
      '">They have paid</button>';
  }

  function loadMoney() {
    S.money = null;
    var r = MZ.monthRange(S.month.y, S.month.m);
    /* Three reads, one round trip. A round trip to Tokyo is ~180ms and
       the query itself is single-digit milliseconds, so the register
       rides along free — asking for it afterwards would double the
       wait for the whole tab. */
    return Promise.all([MZ.payments(r.from, r.to), MZ.expenses(r.from, r.to),
                        MZ.register(r.from, r.to)])
      .then(function (x) {
        S.money = { paid: x[0] || [], spent: x[1] || [], from: r.from, to: r.to,
                    rows: Array.isArray(x[2]) ? x[2] : [] };
        render();
      }).catch(fail);
  }
  /* ============================================================
     WHAT A ONE-TEACHER MUSIC SCHOOL CAN ACTUALLY BE TOLD

     His inventory is not seats, it is HIS OWN HOURS. He teaches every
     instrument himself, so the three questions worth a chart are:

       1. WHERE THE WEEK GOES.  Which days are full and which are
          empty. An empty Tuesday is not a statistic, it is a slot he
          can move somebody into or advertise. Only computable at all
          now that each child carries their own days.

       2. WHAT EACH INSTRUMENT EARNS.  Piano is the premium; the rest
          are not. The mix decides the money, and this is the only
          chart that says how to earn more without teaching longer.
          It SUMS money already collected — it does not price anything.
          Pricing is resolve_fee()'s job and lives in Postgres.

       3. WHO IS FADING.  Children do not resign from a music school,
          they drift. So each is measured against THEIR OWN earlier
          attendance, not against the school average: a child who has
          always come twice a month has not changed, and a child who
          came every week and now comes fortnightly has. That is a
          diminuendo, and it is the one number here that is worth a
          phone call this evening.
     ============================================================ */
  function pct(a, b) { return b ? Math.round(a / b * 100) : 0; }

  /* Attendance in the last third of the month against the two before,
     per child, both measured over the days that child was expected. */
  function fading(rows, from, to) {
    var d0 = new Date(from), d1 = new Date(to);
    /* END AT TODAY, not at the end of the month. Splitting a whole
       August in two on the 21st put the entire "recent" window in the
       future, where nobody has been marked yet — so every child fell
       under the minimum and the list was always empty. */
    var now = new Date(MZ.todayIso());
    if (now < d1) d1 = now;
    var span = Math.round((d1 - d0) / 864e5) + 1;
    if (span < 12) return [];
    var cut = new Date(d0.getTime() + Math.floor(span * 2 / 3) * 864e5);
    return rows.map(function (r) {
      var was = { seen: 0, came: 0 }, now = { seen: 0, came: 0 };
      for (var t = d0.getTime(); t <= d1.getTime(); t += 864e5) {
        var day = new Date(t), iso = MZ.iso(day);
        if (!runsOn(r.batch_id, iso) || isSunday(iso)) continue;
        var m = r.marks && r.marks[iso];
        if (m !== "present" && m !== "absent") continue;
        var b = day < cut ? was : now;
        b.seen++; if (m === "present") b.came++;
      }
      /* Too little to judge is not the same as fading. Three expected
         days either side is the floor; below that one missed lesson
         swings the number thirty points and the list fills with noise. */
      if (was.seen < 3 || now.seen < 3) return null;
      var drop = pct(was.came, was.seen) - pct(now.came, now.seen);
      return drop >= 25 ? { r: r, was: pct(was.came, was.seen),
                            now: pct(now.came, now.seen), drop: drop } : null;
    }).filter(Boolean).sort(function (a, b) { return b.drop - a.drop; });
  }

  /* ============================================================
     THE MONTH AS A WAVEFORM

     Money in above the centre line, money out below it — which is
     what every waveform he has ever looked at already does. A month
     of a music school has a shape: a cluster of fees in the first
     week, the rent as one deep trough, strings and rosin as small
     nicks. He can read that shape in a second and no table of
     thirty-one rows will ever tell him the same thing as fast.

     Tap a day and it says what happened, and plays it: a struck note
     for a day that took money in, a wooden thunk for one that only
     spent. Pitch rises with the size of the day.

     It is one graphic. The temptation on a finance screen is six.
     ============================================================ */
  /* Which day sits under this x. The columns are equal width, so it
     is one division — no per-column hit testing and no 9px targets. */
  function dayFromWave(strip, clientX) {
    var b = strip.getBoundingClientRect();
    var n = strip.querySelectorAll("[data-wday]").length || 1;
    var k = Math.floor((clientX - b.left) / (b.width / n)) + 1;
    return Math.min(n, Math.max(1, k));
  }
  /* Dragging along the wave reads it out as you go. The money tab is
     the heaviest screen in the app, so a drag never re-renders it —
     it moves the highlight and rewrites the one line of text. */
  function scrubWave() {
    var strip = root.querySelector("[data-wavestrip]");
    if (!strip || strip.__wired) return;
    strip.__wired = true;
    var live = false;
    function show(x) {
      var d = dayFromWave(strip, x);
      if (d === S.wave) return;
      S.wave = d;
      var cols = strip.querySelectorAll("[data-wday]");
      for (var i = 0; i < cols.length; i++) cols[i].classList.toggle("on", i + 1 === d);
      var note = root.querySelector(".wnote");
      if (note) note.outerHTML = waveNote(d);
    }
    strip.addEventListener("pointerdown", function (ev) {
      live = true; try { strip.setPointerCapture(ev.pointerId); } catch (e) {}
      show(ev.clientX);
    });
    strip.addEventListener("pointermove", function (ev) { if (live) show(ev.clientX); });
    strip.addEventListener("pointerup", function () { live = false; });
    strip.addEventListener("pointercancel", function () { live = false; });
  }

  function viewWave() {
    if (!S.money) return "";
    var y = S.month.y, m = S.month.m, days = MZ.monthRange(y, m).days;
    var inn = [], out = [], i;
    for (i = 0; i <= days; i++) { inn[i] = 0; out[i] = 0; }
    S.money.paid.forEach(function (p) {
      if (p.status === "void") return;
      var d = +String(p.on_date).slice(8, 10);
      if (d >= 1 && d <= days) inn[d] += Number(p.amount || 0);
    });
    S.money.spent.forEach(function (e) {
      var d = +String(e.on_date).slice(8, 10);
      if (d >= 1 && d <= days) out[d] += Number(e.amount || 0);
    });
    var peak = 1;
    for (i = 1; i <= days; i++) { peak = Math.max(peak, inn[i], out[i]); }

    var today = MZ.todayIso(), tDay = (+today.slice(0, 4) === y && +today.slice(5, 7) === m)
      ? +today.slice(8, 10) : 0;

    var cols = "";
    for (i = 1; i <= days; i++) {
      var up = Math.round(inn[i] / peak * 100), dn = Math.round(out[i] / peak * 100);
      /* NOT a button each. Thirty-one columns in 330px is a 9px
         target, which the audit caught and which no thumb can hit.
         The STRIP is the control: tap or drag anywhere along it and
         the nearest day is picked, which is also how you would run a
         finger along a waveform anyway. */
      cols += '<span class="wcol' + (S.wave === i ? " on" : "") +
        (i === tDay ? " today" : "") + '" data-wday="' + i + '">' +
        '<span class="half t"><i style="height:' + up + '%"></i></span>' +
        '<span class="half b"><i style="height:' + dn + '%"></i></span></span>';
    }


    return '<div class="card"><div class="rowline" style="margin-bottom:2px">' +
      '<b style="font-size:15px">The month\u2019s shape</b>' +
      '<span style="flex:1"></span><span class="muted">tap a day</span></div>' +
      '<div class="muted" style="margin-bottom:10px">In above the line, out below</div>' +
      '<div class="wave" data-wavestrip="1" role="group" aria-label="Day by day">' +
        cols + '<span class="zero"></span></div>' +
      '<div class="wscale"><span>1</span><span>' + days + "</span></div>" +
      waveNote(S.wave) +
    "</div>";
  }

  /* One day's line, on its own, so a drag can replace it without
     redrawing the heaviest screen in the app thirty times a second. */
  function waveNote(d) {
    if (!S.money || !d) {
      return '<div class="wnote quiet-only"><span class="quiet">' +
             "Tap or drag along the month to see what moved.</span></div>";
    }
    var y = S.month.y, m = S.month.m, got = 0, gone = 0;
    var fees = S.money.paid.filter(function (p) {
      return p.status !== "void" && +String(p.on_date).slice(8, 10) === d; });
    var bills = S.money.spent.filter(function (e) {
      return +String(e.on_date).slice(8, 10) === d; });
    fees.forEach(function (p) { got += Number(p.amount || 0); });
    bills.forEach(function (e) { gone += Number(e.amount || 0); });
    var when = new Date(y, m - 1, d).toLocaleDateString("en-IN", { day: "numeric", month: "long" });
    return '<div class="wnote"><b>' + esc(when) + "</b>" +
      (fees.length ? '<span class="in">+' + inr(got) + " \u00b7 " + fees.length +
        (fees.length === 1 ? " fee" : " fees") + "</span>" : "") +
      (bills.length ? '<span class="out">\u2212' + inr(gone) + " \u00b7 " +
        esc(bills.map(function (e) { return e.detail || e.category; }).join(", ")) + "</span>" : "") +
      (!fees.length && !bills.length ? '<span class="quiet">Nothing moved.</span>' : "") +
    "</div>";
  }

  function viewInsights(inPanel) {
    var open = inPanel ? '<div class="lgsec">' : '<div class="card">';
    var shut = "</div>";
    var rows = (S.money && S.money.rows) || [];
    var paid = ((S.money && S.money.paid) || []).filter(function (p) { return p.status !== "void"; });
    if (!rows.length && !paid.length) return "";

    /* ---- 1. where the week goes ---- */
    var load = [0, 0, 0, 0, 0, 0, 0];
    rows.forEach(function (r) { daysOf(r.batch_id).forEach(function (d) { load[d]++; }); });
    var busiest = Math.max.apply(null, load.slice(1, 7)) || 1;
    var week = "";
    for (var d = 1; d <= 6; d++) {
      week += '<div class="bar"><i style="height:' + Math.round(load[d] / busiest * 100) + '%"></i>' +
              "<b>" + load[d] + "</b><span>" + DAY_NAMES[d] + "</span></div>";
    }
    var quietest = 1;
    for (var q = 2; q <= 6; q++) if (load[q] < load[quietest]) quietest = q;

    /* ---- 2. what each instrument earns ---- */
    var byIns = {}, top = 0, earned = 0;
    paid.forEach(function (p) {
      var k = p.sport || "Other", v = Number(p.amount || 0);
      byIns[k] = (byIns[k] || 0) + v; earned += v;
      if (byIns[k] > top) top = byIns[k];
    });
    var ins = Object.keys(byIns).sort(function (a, b) { return byIns[b] - byIns[a]; });
    var heads = {};
    rows.forEach(function (r) { heads[r.sport] = (heads[r.sport] || 0) + 1; });

    /* ---- 3. who is fading ---- */
    var slipping = S.money ? fading(rows, S.money.from, S.money.to) : [];

    return open + '<h3 style="font-size:15px;margin-bottom:2px">Where the week goes</h3>' +
      '<div class="muted" style="margin-bottom:12px">How many children each day carries</div>' +
      '<div class="week">' + week + "</div>" +
      (load[quietest] < busiest * 0.6
        ? '<div class="muted" style="margin-top:10px">' + DAY_NAMES[quietest] +
          " is your quietest day \u2014 " + load[quietest] + " against " + busiest +
          " at your busiest. That is room, not a gap.</div>"
        : "") + shut +

      (ins.length
        ? open + '<h3 style="font-size:15px;margin-bottom:2px">What each instrument earned</h3>' +
          '<div class="muted" style="margin-bottom:12px">' + inr(earned) + " collected this month</div>" +
          ins.map(function (k) {
            var n = heads[k] || 0;
            return '<div class="insbar" style="--hue:' + inst(k).hue + '">' +
              '<span class="k">' + esc(k) + "</span>" +
              '<span class="t"><i style="width:' + Math.round(byIns[k] / top * 100) + '%"></i></span>' +
              '<span class="v">' + inr(byIns[k]) + "</span></div>" +
              (n ? '<div class="insub">' + n + " playing \u00b7 " + inr(Math.round(byIns[k] / n)) +
                   " each</div>" : "");
          }).join("") + shut
        : "") +

      (slipping.length
        ? open + '<h3 style="font-size:15px;margin-bottom:2px">Losing the thread</h3>' +
          '<div class="muted" style="margin-bottom:12px">Coming less than they used to. ' +
          "Measured against their own earlier weeks, not against anyone else.</div>" +
          slipping.slice(0, 8).map(function (f) {
            return '<div class="dim-row" style="--hue:' + inst(f.r.sport).hue + '">' +
              '<div class="nm"><b>' + esc(f.r.member_name) + "</b><span>" +
              esc(f.r.sport || "") + " \u00b7 " + MZ.dayLabel(daysOf(f.r.batch_id)) + "</span></div>" +
              '<svg class="hairpin" viewBox="0 0 60 16" aria-hidden="true">' +
                '<path d="M1 2 L57 8 M1 14 L57 8"/></svg>' +
              '<div class="fg"><b>' + f.was + "% \u2192 " + f.now + '%</b></div></div>';
          }).join("") + shut
        : "");
  }

  /* ============================================================
     THE LEDGER IS ONE PANEL, NOT FIVE CARDS

     The money tab was: three figures, a waveform, an add-expense
     form, a list of what was spent, a list of what came in, and three
     charts — six stacked cards and a very long thumb. They are all
     answers to the same question, so they live in one panel with a
     row of tabs, and the tab he is on is the only one that costs any
     height.

     The figures and the waveform stay above it: those are the month's
     shape at a glance and he should never have to choose to see them.
     ============================================================ */
  var LEDGER = [["spent", "Spent"], ["in", "Received"], ["look", "Insights"]];

  function viewMoney() {
    var mn = new Date(S.month.y, S.month.m - 1, 1)
      .toLocaleDateString("en-IN", { month: "long", year: "numeric" });
    var head = '<div class="daybar">' +
      '<button data-mon="-1">\u2039</button>' +
      '<button class="d" data-months="1"><b>' + esc(mn) + "</b><span>tap to jump</span></button>" +
      '<button data-mon="1">\u203a</button></div>';
    if (!S.money) return head + '<div class="note">Loading\u2026</div>';

    var live = S.money.paid.filter(function (p) { return p.status !== "void"; });
    var inTot  = live.reduce(function (a, p) { return a + Number(p.amount || 0); }, 0);
    var outTot = S.money.spent.reduce(function (a, p) { return a + Number(p.amount || 0); }, 0);
    var view = S.ledger || "spent";

    var tabs = '<div class="sub-toggle ledger">' + LEDGER.map(function (t) {
      var n = t[0] === "spent" ? S.money.spent.length
            : t[0] === "in"    ? live.length : 0;
      return '<button data-ledger="' + t[0] + '"' + (view === t[0] ? ' class="on"' : "") + ">" +
        t[1] + (n ? ' <em class="n">' + n + "</em>" : "") + "</button>";
    }).join("") + "</div>";

    return head + monthStrip() +
      '<div class="card"><div class="figs">' +
        '<div class="fig in"><b>' + inr(inTot) + "</b><span>Fees collected</span></div>" +
        '<div class="fig out"><b>' + inr(outTot) + "</b><span>Spent</span></div>" +
        '<div class="fig"><b>' + inr(inTot - outTot) + "</b><span>Left</span></div>" +
      "</div></div>" +
      viewWave() +
      '<div class="card ledgerpanel">' + tabs +
        (view === "spent" ? ledgerSpent()
       : view === "in"    ? ledgerIn(live)
       :                    viewInsights(true)) +
      "</div>";
  }

  function ledgerSpent() {
    return '<div class="lgrid">' +
        '<label class="field"><span>How much</span>' +
          '<input id="exAmt" type="number" inputmode="numeric" min="1" placeholder="0" /></label>' +
        '<label class="field"><span>What for</span>' +
          '<input id="exWhat" placeholder="Guitar strings, rent, electricity\u2026" /></label>' +
      "</div>" +
      '<button class="btn bow" id="exSave">Save expense</button>' +
      (S.money.spent.length
        ? '<div class="lglist">' + S.money.spent.map(expenseRow).join("") + "</div>"
        : '<div class="note" style="margin-top:10px">Nothing spent this month yet.</div>');
  }

  /* The headline is the child, not the amount. A column of rupees
     tells him what came in, which he already has three figures for at
     the top of the page; what he opens this list to find is whether
     Aarthi has paid. The amount moves right, where the expense list
     already puts it, so the two faces of the panel read the same way. */
  function ledgerIn(live) {
    if (!live.length) return '<div class="note" style="margin-top:12px">No fees in yet this month.</div>';
    return '<div class="lglist">' + S.money.paid.slice(0, 40).map(function (p) {
      var dead = p.status === "void";
      var who  = (p.member && p.member.name) || p.name || "";
      var mo   = Number(p.months || 1);
      var sub  = new Date(p.on_date).toLocaleDateString("en-IN", { day: "numeric", month: "short" }) +
        (p.mode ? " \u00b7 " + esc(p.mode) : "") +
        (mo > 1 ? " \u00b7 " + mo + " months" : "") +
        (dead ? " \u00b7 cancelled" : "");
      return '<div class="srow' + (dead ? " voided" : "") + '">' +
        '<div class="nm"><b>' + (who ? esc(who) : "Fee received") + "</b><span>" + sub + "</span></div>" +
        "<b>" + inr(p.amount) + "</b>" +
        (dead ? "" : '<button class="mini" data-void="' + p.id + '">Undo</button>') +
      "</div>";
    }).join("") + "</div>";
  }

  function expenseRow(e) {
    if (S.exEdit === e.id) {
      return '<div class="srow exedit">' +
        '<input id="exeWhat" value="' + esc(e.detail || e.category || "") + '" />' +
        '<input id="exeAmt" type="number" inputmode="numeric" value="' + Number(e.amount) + '" />' +
        '<button class="mini go" data-exsave="' + e.id + '">Save</button>' +
        '<button class="mini" data-excancel="1">Cancel</button></div>';
    }
    if (S.exKill === e.id) {
      return '<div class="srow exedit"><div class="nm"><b>Remove ' +
        esc(e.detail || e.category) + "?</b><span>" + inr(e.amount) + "</span></div>" +
        '<button class="mini bad" data-exkillyes="' + e.id + '">Remove</button>' +
        '<button class="mini" data-excancel="1">Keep</button></div>';
    }
    return '<div class="srow"><div class="nm"><b>' + esc(e.detail || e.category) + "</b>" +
      "<span>" + new Date(e.on_date).toLocaleDateString("en-IN", { day: "numeric", month: "short" }) +
      "</span></div><b>" + inr(e.amount) + "</b>" +
      '<button class="mini ic" data-exedit="' + e.id + '" aria-label="Change">\u270e</button>' +
      '<button class="mini ic" data-exkill="' + e.id + '" aria-label="Remove">\u00d7</button>' +
    "</div>";
  }

  function viewPay() {
    var p = S.pay;
    return '<div class="sheet"><div class="card">' +
      '<h3 style="font-size:19px;margin-bottom:2px">' + esc(p.name) + "</h3>" +
      '<div class="muted" style="margin-bottom:14px">' + esc(p.sport || "") + "</div>" +

      '<label class="field"><span>How much</span>' +
        '<input id="payAmt" type="number" inputmode="numeric" min="1" value="' +
        (p.amount == null ? "" : p.amount) + '" /></label>' +

      '<span class="field"><span>How many months</span></span>' +
      '<div class="frow" style="margin-bottom:14px">' +
        [1, 2, 3, 6, 12].map(function (m) {
          return '<button class="chip' + (p.months === m ? " on" : "") +
                 '" data-paymonths="' + m + '">' + m + "</button>";
        }).join("") +
      "</div>" +

      '<span class="field"><span>How it was paid</span></span>' +
      '<div class="frow" style="margin-bottom:18px">' +
        ["Cash", "UPI"].map(function (m) {
          return '<button class="chip' + (p.mode === m ? " on" : "") +
                 '" data-paymode="' + esc(m) + '">' + m + "</button>";
        }).join("") +
      "</div>" +

      '<button class="btn" id="payGo">' + payLabel(p.amount) + "</button>" +
      '<button class="btn ghost" id="payCancel" style="margin-top:8px">Cancel</button>' +
    "</div></div>";
  }

  /* THE BUTTON MAY NOT NAME A NUMBER IT WILL NOT USE.

     It said "Record \u20b92,500" \u2014 the price the database had quoted \u2014
     while the box above it said 1500, because the label came off
     S.pay.amount and the write came off the input. It RECORDED 1500,
     which is the right number and the wrong reassurance: the last thing
     read before money is written disagreed with what was written.

     Both now come through here. payAmount() is the single read and the
     label is a function of it, so the two cannot drift apart without one
     of them being deleted. */
  function payAmount() {
    var el = document.getElementById("payAmt");
    if (el && String(el.value).trim() !== "") return Math.round(+el.value) || 0;
    return S.pay && S.pay.amount != null ? Math.round(S.pay.amount) : 0;
  }
  function payLabel(n) { return n > 0 ? "Record " + inr(n) : "Record payment"; }

  /* Ask the database what this costs for that many months, and never
     work it out here. A null answer leaves the field as he typed it. */
  function repriceAndRender() {
    render();
    if (!S.pay || !S.pay.enrollment) return;
    var want = S.pay;
    MZ.feeFor(want.enrollment, want.months).then(function (v) {
      if (S.pay !== want) return;                 /* he moved on */
      var amt = v && (v.amount != null ? v.amount : (v[0] && v[0].amount));
      if (amt != null) { S.pay.amount = amt; render(); }
    });
  }

  function openPay(enrollment, name, sport, amount) {
    S.pay = { enrollment: enrollment, name: name, sport: sport,
              amount: amount == null ? null : amount, months: 1, mode: "Cash" };
    if (amount == null) repriceAndRender(); else render();
  }

  function confirmPay() {
    var amt = payAmount();
    if (!amt || amt <= 0) { S.err = "Enter how much was paid."; return render(); }
    var b = document.getElementById("payGo");
    if (b) { b.disabled = true; b.textContent = "Recording…"; }
    MZ.takePayment({ enrollment: S.pay.enrollment, amount: amt,
                     months: S.pay.months, mode: S.pay.mode })
      .then(function () {
        toast("Payment recorded"); S.pay = null; S.err = ""; loadDues();
      })
      .catch(function (e) {
        if (b) { b.disabled = false; b.textContent = payLabel(amt); }
        fail(e);
      });
  }

  /* ---------- who else has paid ----------
     The picker is the answer to "somebody paid and they are not on
     the overdue list". It reads members, which is the one call this
     app had never made. */
  function loadPicker() {
    S.picker = { rows: null, q: "" };
    render();
    MZ.students().then(function (rows) {
      S.picker = { rows: rows || [], q: (S.picker && S.picker.q) || "" };
      render();
    }).catch(fail);
  }
  function viewPicker() {
    var pk = S.picker;
    var body = '<div class="sheet"><div class="card">' +
      '<h3 style="font-size:18px;margin-bottom:10px">Who paid?</h3>' +
      '<input class="search" id="pq" placeholder="Find a student…" value="' + esc(pk.q) + '" />';
    if (!pk.rows) return body + '<div class="note">Loading…</div>' +
      '<button class="btn ghost" id="pkCancel" style="margin-top:10px">Cancel</button></div></div>';

    var q = pk.q.toLowerCase();
    var rows = pk.rows.filter(function (m) {
      return !q || (m.name || "").toLowerCase().indexOf(q) >= 0;
    }).slice(0, 40);

    body += rows.map(function (m) {
      var e = (m.enrollments || [])[0] || {};
      var ins = inst(e.sport);
      return '<div class="srow key tuned" style="--hue:' + ins.hue + '"' +
        ' data-pick="' + (e.id || "") + '" data-nm="' + esc(m.name) +
        '" data-sport="' + esc(e.sport || "") + '">' +
        '<span class="ig">' + svgIcon(ins) + "</span>" +
        '<div class="nm"><b>' + esc(m.name) + "</b><span>" + esc(e.sport || "no instrument") + "</span></div>" +
      "</div>";
    }).join("") || '<div class="note">Nobody matches that.</div>';

    return body + '<button class="btn ghost" id="pkCancel" style="margin-top:10px">Cancel</button></div></div>';
  }

  /* ============================================================
     ONE STUDENT

     Everything about a child that is not "were they here today" lives
     on one sheet, reached by tapping their name. Nothing was added to
     the row to make this possible — the name was already there, and a
     name is the obvious thing to press when you want the person.

     It is also the only place anything can be UNDONE, which is why it
     exists at all: before this there was no way to fix a wrong phone
     number, no way to move a child from guitar to piano, and no way
     to stop a child who had left. They stayed on the register and in
     the dues list for ever.
     ============================================================ */
  function viewWho() {
    var w = S.who;
    var ins = (S.ref && S.ref.instruments) || [];
    var bs  = (S.ref && S.ref.batches) || [];
    return '<div class="sheet"><div class="card">' +
      '<div class="rowline" style="margin-bottom:14px">' +
        '<span class="ig" style="--hue:' + inst(w.sport).hue + '">' + svgIcon(inst(w.sport)) + "</span>" +
        '<h3 style="font-size:19px;flex:1">' + esc(w.name) + "</h3></div>" +

      '<label class="field"><span>Name</span>' +
        '<input id="whName" value="' + esc(w.name) + '" /></label>' +
      '<label class="field"><span>Parent\u2019s phone</span>' +
        '<input id="whPhone" type="tel" inputmode="numeric"' +
        (w.asked ? ' placeholder="10 digits"' : ' disabled placeholder="Loading\u2026"') +
        ' value="' + esc(w.phone || "") + '" /></label>' +
      '<label class="field"><span>Instrument</span><select id="whIns">' +
        ins.map(function (i) {
          return '<option value="' + esc(i.name) + '"' +
                 (i.name === w.sport ? " selected" : "") + ">" + esc(i.name) + "</option>";
        }).join("") + "</select></label>" +
      '<div class="field"><span>Comes on</span>' + dayPicker("whDays", w.days || []) +
        '<em class="daysum' + (w.days && w.days.length ? "" : " dim") + '">' +
        esc(w.days && w.days.length ? MZ.dayLabel(w.days) : "Pick the days he comes") +
        "</em>" + dayHintHtml(w.days) + "</div>" +

      (w.oneOk === "ask"
        ? '<div class="askline"><b>Only one day a week?</b>' +
          '<span>' + esc(MZ.dayLabel(w.days)) + " \u2014 most come twice.</span></div>"
        : "") +
      '<button class="btn" id="whSave">' +
        (w.oneOk === "ask" ? "Yes, save" : "Save changes") + "</button>" +
      '<button class="btn ghost" id="whPay" style="margin-top:8px">Record a payment</button>' +
      /* Away for two months is something a parent says at the door,
         mid-register — so it has to be reachable from the register's
         own card and not only from Members. Without it the nearest
         thing on this card is "has stopped coming", which is far too
         final an answer to "he is travelling until October". */
      pausePanel({ enrollment_id: w.enrollment, name: w.name, renewal_on: w.renewalOn }) +
      '<button class="btn ghost" id="whCancel" style="margin-top:8px">Close</button>' +

      /* Last, separated, and it says what it does rather than "delete".
         Nothing is deleted: the child and every mark they ever earned
         stay exactly where they are. */
      '<div class="danger">' +
        (w.confirmStop
          ? '<p class="muted" style="margin-bottom:10px">' + esc(w.name) +
            " will come off the register and out of the fees list. " +
            "Nothing already recorded is deleted.</p>" +
            '<button class="btn stop" id="whStopYes">Yes, ' + esc(w.name) + " has stopped</button>" +
            '<button class="btn ghost" id="whStopNo" style="margin-top:8px">No, keep them</button>'
          : '<button class="btn ghost stop-link" id="whStop">' + esc(w.name) +
            " has stopped coming</button>") +
      "</div>" +
    "</div></div>";
  }

  function openWho(el) {
    S.who = {
      enrollment: +el.getAttribute("data-who") || null,
      member: +el.getAttribute("data-mem") || null,
      name: el.getAttribute("data-nm") || "",
      sport: el.getAttribute("data-sport") || "",
      batch: +el.getAttribute("data-batch") || null,
      days: daysOf(+el.getAttribute("data-batch")),
      phone: "", loaded: false,
      confirmStop: false
    };
    var want = S.who;
    /* The instrument and batch pickers need the reference data, which
       may not have arrived yet on a cold open. */
    if (!S.ref) MZ.reference().then(function (r) {
      S.ref = r;
      /* The days are read OUT of the reference, so on a cold open the
         picker would have come up blank and saving would have wiped
         the child's days. Fill them in when it lands. */
      if (S.who === want && !want.days.length) want.days = daysOf(want.batch);
      render();
    }).catch(function () {});
    /* And the phone number is not in the register's data at all. */
    if (want.member) {
      MZ.student(want.member).then(function (m) {
        if (S.who !== want) return;
        S.who.phone  = (m && (m.phone || m.parent_phone)) || "";
        S.who.loaded = !!m;
        /* The pause panel projects the date the next fee moves to, and
           the register row does not carry renewal_on. The enrolment
           this card was opened on does. */
        var en = (m && m.enrollments || []).filter(function (e) {
          return e.id === S.who.enrollment; })[0];
        S.who.renewalOn = (en && en.renewal_on) || null;
        /* Even when the read came back with nothing, unlock the box —
           a field stuck on "Loading…" for ever is worse than one he
           can type into, and saveWho() still refuses to send an empty
           one it never read. */
        S.who.asked  = true;
        render();
      }).catch(function () {
        if (S.who !== want) return;
        S.who.asked = true; render();
      });
    }
    render();
  }

  function saveWho() {
    var w = S.who;
    /* NOT a guard on zero. An empty list here means the reference data
       has not landed yet, not that he cleared the days — and
       moveEnrollment leaves the days alone when it is given none. A
       block would stop him fixing a phone number on a slow connection,
       which is the opposite of safe. */
    if ((w.days || []).length === 1 && w.oneOk !== "ok") {
      w.oneOk = "ask"; render(); return;
    }
    var b = document.getElementById("whSave");
    if (b) { b.disabled = true; b.textContent = "Saving…"; }
    var name  = (document.getElementById("whName") || {}).value;
    var insEl = document.getElementById("whIns");
    /* undefined, not "", when the number has not loaded: editStudent
       skips a field it is not given, and writing an empty box over a
       real number would silently cut that family off from reminders. */
    /* Send it if we read it (so a deliberate clear works), or if he
       typed one (so a missing number can be added). Never send an
       empty box we never read — that is the case that wipes a real
       number and takes the family's reminders with it. */
    var typed = ((document.getElementById("whPhone") || {}).value || "").replace(/\D/g, "");
    var phone = (w.loaded || typed) ? typed : undefined;
    MZ.editStudent(w.member, { name: name, phone: phone })
      .then(function () {
        return MZ.moveEnrollment(w.enrollment, {
          instrument: insEl && insEl.value, days: w.days
        });
      })
      .then(function () {
        toast("Saved"); S.who = null; loadRegister(); render();
      })
      .catch(function (e) {
        if (b) { b.disabled = false; b.textContent = "Save changes"; }
        fail(e);
      });
  }

  function stopWho() {
    var w = S.who;
    var b = document.getElementById("whStopYes");
    if (b) { b.disabled = true; b.textContent = "Stopping…"; }
    MZ.stopStudent(w.member, "stopped coming")
      .then(function () {
        toast(w.name + " is off the register"); S.who = null; loadRegister(); render();
      })
      .catch(function (e) {
        if (b) { b.disabled = false; b.textContent = "Yes, " + w.name + " has stopped"; }
        fail(e);
      });
  }

  /* ---------- add a student ---------- */
  function viewAdd() {
    var E = S.nsErr || {};
    var ins = (S.ref && S.ref.instruments) || [], bs = (S.ref && S.ref.batches) || [];
    return '<div class="card"><h3 style="font-size:17px;margin-bottom:14px">New student</h3>' +
      /* Errors sit under the field they are about. A single message at
         the top of a form is a message he has to map back onto a box
         himself, and the box he has to fix is usually off-screen. */
      '<label class="field' + (E.name ? " bad" : "") + '"><span>Name</span>' +
        '<input id="nsName" value="' + esc(S.nsVals.name || "") + '" />' +
        (E.name ? '<em class="ferr">' + E.name + "</em>" : "") + "</label>" +
      '<label class="field' + (E.phone ? " bad" : "") + '"><span>Parent\u2019s phone</span>' +
        '<input id="nsPhone" type="tel" inputmode="numeric" placeholder="10 digits" value="' +
          esc(S.nsVals.phone || "") + '" />' +
        (E.phone ? '<em class="ferr">' + E.phone + "</em>" : "") + "</label>" +
      '<label class="field"><span>Instrument</span><select id="nsIns">' +
        ins.map(function (i) { return '<option value="' + esc(i.name) + '">' + esc(i.name) + "</option>"; }).join("") +
      "</select></label>" +
      '<div class="field' + (E.days ? " bad" : "") + '"><span>Comes on</span>' +
        dayPicker("nsDays", S.nsDays || []) +
        (E.days ? '<em class="ferr">' + E.days + "</em>" : "") +
        (S.nsDays && S.nsDays.length
          ? '<em class="daysum">' + esc(MZ.dayLabel(S.nsDays)) + "</em>"
          : '<em class="daysum dim">Pick the days he comes</em>') +
        dayHintHtml(S.nsDays) + "</div>" +
      '<div class="field"><span>Paying for</span>' +
        '<div class="stops" id="nsPlan">' +
          [1, 3, 6, 12].map(function (n) {
            return '<button type="button" data-plan="' + n + '"' +
              ((S.nsPlan || 1) === n ? ' class="on"' : "") + '><i><em>' + n +
              "</em></i><span>" + (n === 1 ? "month" : "months") + "</span></button>";
          }).join("") +
        "</div></div>" +
      /* Short, and it stops repeating itself: when the day picker has
         already said "set the fee when you take the payment", saying
         "you do not need to enter it" two lines below is a
         contradiction he has to resolve. */
      '<div class="muted" style="margin:-2px 0 14px">' +
        ((S.nsDays || []).length >= 3
          ? "Reminder in "
          : "The fee comes from the instrument. Reminder in ") +
        (S.nsPlan || 1) + ((S.nsPlan || 1) === 1 ? " month." : " months.") + "</div>" +
      (S.nsOneOk === "ask"
        ? '<div class="askline"><b>Only one day a week?</b>' +
          '<span>' + esc(MZ.dayLabel(S.nsDays)) + " \u2014 most come twice.</span></div>"
        : "") +
      /* Already on the roll. Says WHO, so he can tell a second child of
         the same name from the one he just typed twice — the number is
         the thing that tells them apart. */
      (S.nsDupe && S.nsDupe.length
        ? '<div class="askline"><b>' + esc(S.nsDupe[0].name) +
          " is already on the roll</b><span>" +
          S.nsDupe.map(function (d) {
            var sp = (d.enrollments || []).filter(function (e) {
              return e.status !== "discontinued"; })[0];
            return (sp && sp.sport ? esc(sp.sport) + " \u00b7 " : "") +
                   (d.phone ? esc(d.phone) : "no number");
          }).join("  \u2022  ") + "</span></div>"
        : "") +
      '<button class="btn bow" id="nsSave">' +
        (S.nsDupe && S.nsDupe.length ? "Yes, add anyway"
         : S.nsOneOk === "ask" ? "Yes, save" : "Save student") + "</button>" +
      '<button class="btn plec" id="nsCancel" style="margin-top:10px">Cancel</button></div>';
  }

  /* ---------- render ---------- */
  function render() {
    /* Which instrument is painted behind the page. NOT data-tab: the
       tab buttons are found with closest("[data-tab]"), so putting
       that attribute on <body> made every click anywhere in the app
       match it and be handled as a tab switch. Nothing else in the
       delegated handler ever ran — no marking, no filtering — and it
       still LOOKED right, because re-entering the current tab
       re-renders the same screen. */
    document.body.setAttribute("data-room", S.tab);
    document.body.classList.toggle("signed-out", !MZ.signedIn());
    if (!MZ.signedIn()) return gate();
    drawTabs();
    var sub = S.tab === "register" ? "Attendance register"
            : S.tab === "dues" ? "Everyone on the roll"
            : S.tab === "add"  ? "A new student"
            : "Money this month";
    var inner = S.tab === "add" ? viewAdd()
              : S.tab === "register" ? viewRegister()
              : S.tab === "dues" ? viewDues() : viewMoney();
    /* The sheets sit ON the tab, so cancelling always returns him to
       exactly where he was rather than to some remembered screen. */
    if (S.fam != null) inner += viewFam();
    if (S.who)    inner += viewWho();
    if (S.picker) inner += viewPicker();
    if (S.pay)    inner += viewPay();
    /* Read and clear: the entrance animation belongs to the render
       that follows a tab change, not to the twenty re-renders that
       follow marking twenty children. */
    var fresh = S.fresh; S.fresh = false;
    root.innerHTML = header(sub) + '<div class="wrap' + (fresh ? " fresh" : "") + '">' +
      (S.err ? '<div class="err">' + esc(S.err) + "</div>" : "") + inner + "</div>";
    playSection();
    paintNeedle();
    fitNames();
    wireGrid();
    scrubWave();
    showAsk();
  }

  /* ============================================================
     THE MONTH GRID OPENS WHERE HE IS, AND REMEMBERS WHERE HE WAS

     It opened on the 1st. On a phone that is a 173px window onto a
     868px month, so on the 21st today's column sat 520px off-screen
     and every single visit began with three screens of sideways
     scrolling to reach the week he is actually in.

     And a re-render rebuilt the table, which reset scrollLeft to 0 —
     so opening a child's card threw away wherever he had scrolled to.
     Both are the same fix: the horizontal position is state, not an
     accident of the DOM.
     ============================================================ */
  function wireGrid() {
    var sc = root.querySelector(".gridscroll");
    if (!sc) return;
    /* A new month, or arriving in the month view, forgets the old
       position and lands on today. A re-render of the same month keeps
       whatever he had scrolled to. */
    /* The width is in the key, bucketed. A remembered scrollLeft is a
       remembered DAY only while the window is the same size — rotate
       the iPad and the same pixel offset lands on a different part of
       the month, with today anywhere. Bucketed by 40px (about a day
       and a half) so a rotation re-lands on today and a pixel of
       scrollbar noise does not. */
    var key = S.month.y + "-" + S.month.m + "|" + S.mode +
              "|" + Math.round(sc.clientWidth / 40);
    if (S.gridKey !== key) { S.gridKey = key; S.gridX = null; }
    if (S.gridX == null) {
      var td = sc.querySelector("td.c.today");
      /* two days of run-up, so today is in context and not jammed
         against the left edge */
      S.gridX = td ? Math.max(0, td.offsetLeft - (td.offsetWidth || 26) * 2) : 0;
    }
    sc.scrollLeft = S.gridX;
    sc.addEventListener("scroll", function () { S.gridX = sc.scrollLeft; }, { passive: true });

    /* THE ROW LIGHT. Thirty-one columns wide and a narrow name column
       beside it: the thing that goes wrong is losing which row you are
       reading. Touch a row and a bar rules across both tables until you
       touch another; touch the same one again and it goes out.

       pointerdown, not click: this grid is made of plain <td>s, and iOS
       does not reliably bubble click from an element that is not
       interactive. The same trap as the SVG shapes earlier. */
    var wrap = root.querySelector(".gridwrap");
    var bar  = root.querySelector(".rowlight");
    if (!wrap || !bar) return;
    if (S.litRow != null) placeLight(wrap, bar, S.litRow);
    wrap.addEventListener("pointerdown", function (ev) {
      var tr = ev.target && ev.target.closest && ev.target.closest("tr[data-r]");
      var i = tr ? tr.getAttribute("data-r") : null;
      S.litRow = i == null || i === S.litRow ? null : i;
      placeLight(wrap, bar, S.litRow);
    });
  }

  /* THE NAME COLUMN IS AS WIDE AS THE LONGEST NAME, AND NO WIDER.
     Measured, not guessed from character count: "Wm" and "iiii" are
     four characters each and nothing like the same width. Ninety-six
     scrollWidth reads is one forced layout on a tree that has already
     settled, and it only happens when the list itself changes. */
  function fitNames() {
    var card = root.querySelector(".card.tuner");
    if (!card) return;
    var bs = card.querySelectorAll(".mwho b");
    if (!bs.length) return;
    var sig = bs.length + ":" + (S.people && S.people.length);
    if (S.nameFit && S.nameFit.sig === sig) {
      card.style.setProperty("--namew", S.nameFit.w + "px");
      return;
    }
    /* A Range around the text, NOT the element's scrollWidth. These are
       display:block, so scrollWidth is the BOX — the column measured
       its own current width and locked to it, reporting "Tanvi" as
       128px. A range measures the glyphs. */
    var w = 0, i, rng = null;
    try { rng = document.createRange(); } catch (e) {}
    if (!rng) return;
    for (i = 0; i < bs.length; i++) {
      rng.selectNodeContents(bs[i]);
      var tw = rng.getBoundingClientRect().width;
      if (tw > w) w = tw;
    }
    var row = card.querySelector(".mrow");
    /* Never more than 40% of the row: one absurdly long name must not
       squeeze the scale everybody else is read against. */
    var cap = row ? Math.round(row.getBoundingClientRect().width * 0.4) : 220;
    w = Math.max(104, Math.min(cap, Math.ceil(w) + 2));
    S.nameFit = { sig: sig, w: w };
    card.style.setProperty("--namew", w + "px");
  }

  function placeLight(wrap, bar, i) {
    if (i == null) { bar.hidden = true; return; }
    var tr = wrap.querySelector('.reg.names tr[data-r="' + i + '"]');
    if (!tr) { bar.hidden = true; return; }
    var g = wrap.getBoundingClientRect(), r = tr.getBoundingClientRect();
    bar.style.top = (r.top - g.top) + "px";
    bar.style.height = r.height + "px";
    bar.hidden = false;
  }

  /* A question he cannot see is a button that did nothing. The one-day
     question renders below the fold on a phone, so it brings itself
     into view — and only when it has just appeared, never on the
     twenty re-renders that follow. */
  function showAsk() {
    var a = root.querySelector(".askline");
    if (!a || a.__seen) return;
    a.__seen = true;
    try { a.scrollIntoView({ block: "center", behavior: "smooth" }); }
    catch (e) { a.scrollIntoView(); }
  }

  /* THE SECTION PLAYS ITSELF.
     Marking a drummer in makes the drum on that section's heading get
     hit; a guitarist makes the strings wobble; a pianist presses a
     key. Each is the gesture that instrument actually makes, ~450ms,
     a few pixels of travel, and only ever ONE of them at a time —
     the section he just touched. Anything more on a screen he uses
     between students is decoration he will learn to ignore. */
  var PLAY = {
    Drums: "drum", Piano: "key", Keyboard: "key",
    Guitar: "string", Ukulele: "string", Violin: "string",
    Vocals: "voice", Flute: "wind"
  };
  function playSection() {
    var p = S.pulse; S.pulse = null;
    if (!p || !p.sport) return;
    var el = root.querySelector('[data-ig="' + cssq(p.sport) + '"]');
    if (!el) return;
    el.classList.add("play-" + (PLAY[p.sport] || "key"),
                     p.kind === "absent" ? "play-off" : "play-on");
  }
  /* A section name goes into a CSS selector, and "Vocals" is safe but
     nothing guarantees the next instrument is. */
  function cssq(v) { return String(v).replace(/["\\]/g, "\\$&"); }

  /* ---------- one delegated click handler ---------- */
  /* EVERYTHING YOU TOUCH SOUNDS.
     Softer than the register — marking a child is the loud thing on
     this screen and nothing else should compete with it. A filter
     chip plays its own instrument, which is the nicest of these: tap
     Violin and you hear one. */
  /* ============================================================
     PENCIL IS FOR THE REGISTER, AND ONLY THE REGISTER.

     Graphite is the sound of MARKING A CHILD — a tick, a strike, a
     rub-out. It used to leak out across the filters, the tabs, the
     day arrows and the view toggle, and once paper is the sound of
     everything it stops being the sound of anything. It now appears
     in exactly one place in this file: cycle().

     Everything else is an instrument, and no two controls share one.
     The rule that picks which: play the thing the control is ABOUT.
     ============================================================ */
  var VOICE = {
    Piano: struck, Keyboard: reed, Guitar: pluck, Violin: bow,
    Ukulele: pluck, Drums: hit, Vocals: voiceNote, Flute: breath
  };
  /* Circling "Drums" plays a drum. Circling "Violin" plays a bow.
     The filter names an instrument, so the obvious sound for it is
     that instrument, and eight filters get eight voices for free. */
  function playInstrument(name, level) {
    var i = inst(name);
    return (VOICE[name] || pluck)(i.note, level === undefined ? 0.75 : level);
  }

  var TAB_SOUND = {
    register: function () { struck(60, 0.6); },   /* piano — the register's home */
    dues:     function () { bow(64, 0.55); },     /* violin — the tuner */
    money:    function () { woodThunk(0.7); },    /* woodblock — the ledger stamp */
    add:      function () { voiceNote(69, 0.5); } /* a voice — someone new */
  };

  function clickTone(t) {
    if (!t.closest) return;
    var el;
    if ((el = t.closest("[data-tab]"))) {
      var f = TAB_SOUND[el.getAttribute("data-tab")];
      return f ? f() : struck(60, 0.6);
    }
    /* an instrument filter plays its own instrument */
    if ((el = t.closest("[data-fi]"))) {
      var v = el.getAttribute("data-fi");
      return v ? playInstrument(v, 0.7) : reed(72, 0.5);   /* "Everyone" — the organ, all of them */
    }
    /* A tuner lamp gives you a reference pitch, so it sounds like one.
       MIDI 69 is A440 itself — the note the whole room tunes to — and
       the flat lamp answers a semitone and a half under it. */
    if ((el = t.closest("[data-band]"))) {
      var bnd = el.getAttribute("data-band");
      return bnd === "ok" ? bow(69, 0.5)
           : bnd === "flat" ? bow(66, 0.5)
           : breath(60, 0.4);
    }
    /* the day filter is not an instrument, so it gets the lowest
       voice in the room and cannot be confused with one */
    if (t.closest("[data-clear]"))          return breath(74, 0.5);        /* flute — clearing the air */
    if (t.closest("[data-mode]"))           return reed(67, 0.55);         /* keyboard — changing register */
    if (t.closest("[data-day],[data-mon]")) return struck(76, 0.45);       /* a high piano step */
    if (t.closest("[data-off]"))            return breath(69, 0.45);
    /* opening a child's card plays THAT child's instrument */
    /* NOT [data-paid]. That rule sat above the one below and stole the
       "they have paid" button, which then played the child's drum
       instead of the flat note gliding up into true — the one sound in
       this app that means something specific. */
    if ((el = t.closest("[data-who],[data-pick]"))) {
      var sp = el.getAttribute("data-sport");
      return sp ? playInstrument(sp, 0.6) : pluck(64, 0.55);
    }
    /* Opening a family on the tuner plays their child's instrument. */
    if ((el = t.closest("[data-fam]"))) {
      var fd = S.people && S.people[+el.getAttribute("data-fam")];
      return fd ? playInstrument(fd.sport, 0.65) : pluck(64, 0.55);
    }
    /* A day on the waveform sounds like what it did: a struck note
       for money in, pitched by how big the day was, and a wooden
       thunk for a day that only spent. */
    if ((el = t.closest("[data-wavestrip]"))) {
      var wday = dayFromWave(el, (window.event && window.event.clientX) || 0), got = 0, gone = 0;
      (S.money ? S.money.paid : []).forEach(function (p) {
        if (p.status !== "void" && +String(p.on_date).slice(8, 10) === wday) got += Number(p.amount || 0); });
      (S.money ? S.money.spent : []).forEach(function (e) {
        if (+String(e.on_date).slice(8, 10) === wday) gone += Number(e.amount || 0); });
      if (!got && !gone) return breath(69, 0.3);
      if (got >= gone) return struck(58 + Math.min(14, Math.round(got / 1200)), 0.55);
      return woodThunk(0.6);
    }
    if (t.closest(".paid"))                 return intoTune(72, 42, 1);    /* flat, then true */
    if (t.closest("#exSave"))               return woodThunk(0.9);
    if (t.closest(".wa"))                   return bow(67, 0.5);           /* the ask goes out */
    if (t.closest("#famClose"))             return breath(65, 0.4);        /* the card closes */
    if (t.closest(".btn"))                  return pluck(65, 0.6);         /* guitar */
  }

  document.addEventListener("click", function (e) {
    var t = e.target;
    if (t && t.closest && !t.closest("[data-mark]")) clickTone(t);
    var tab = t.closest("[data-tab]");
    if (tab) { S.tab = tab.getAttribute("data-tab"); S.err = ""; enter(); return; }
    /* Signing out goes back to the school's page, not to a sign-in
       screen. The root is the front door now; reloading app.html would
       leave him staring at a login he just chose to leave. */
    if (t.closest("#out")) { MZ.signOut(); location.replace("./"); return; }

    var mk = t.closest("[data-mark]"); if (mk) { cycle(mk); return; }

    var dd = t.closest("[data-day]");
    if (dd) { S.day = shiftDay(S.day, +dd.getAttribute("data-day")); S.showOff = false; loadRegister(); render(); return; }
    var dm = t.closest("[data-mon]");
    if (dm) {
      var n = S.month.m + (+dm.getAttribute("data-mon"));
      S.month = n < 1 ? { y: S.month.y - 1, m: 12 } : n > 12 ? { y: S.month.y + 1, m: 1 } : { y: S.month.y, m: n };
      (S.tab === "money" ? loadMoney : loadRegister)(); render(); return;
    }
    var fam = t.closest("[data-fam]");
    if (fam) {
      S.fam = +fam.getAttribute("data-fam");
      S.famInfo = null;
      var row = S.people && S.people[S.fam];
      /* How long they have been coming is not in reminder_queue() —
         it is on the member, and reminder_queue does not promise a
         member_id either. The register row for the same enrolment
         does, and it is already in hand from the same round trip. */
      var rreg = row && (S.duesReg || []).filter(function (x) {
        return x.enrollment_id === row.enrollment_id; })[0];
      var mid = (row && row.member_id) || (rreg && rreg.member_id);
      if (mid) {
        var want = S.fam;
        MZ.student(mid).then(function (m) {
          if (S.fam === want) { S.famInfo = m || {}; render(); }
        }).catch(function () { if (S.fam === want) { S.famInfo = {}; render(); } });
      }
      render(); return;
    }
    if (t.closest("#famClose")) { S.fam = null; S.famInfo = null; render(); return; }
    var bd = t.closest("[data-band]");
    if (bd) { jumpBand(bd.getAttribute("data-band")); return; }
    var po = t.closest("[data-pausing]");
    if (po) { S.pausing = +po.getAttribute("data-pausing"); S.pauseMonths = 1; render(); return; }
    if (t.closest("[data-pausecancel]")) { S.pausing = null; render(); return; }
    var pm = t.closest("[data-pausem]");
    if (pm) { S.pauseMonths = +pm.getAttribute("data-pausem"); render(); return; }

    var pz = t.closest("[data-pause]");
    if (pz) {
      var pn = pz.getAttribute("data-nm");
      MZ.pauseStudent({ enrollment: +pz.getAttribute("data-pause"),
                        months: +pz.getAttribute("data-pmonths") || 1,
                        renewalOn: pz.getAttribute("data-ren") || null })
        .then(function () {
          toast(pn + " is paused");
          S.fam = null; S.famInfo = null; S.pausing = null; S.who = null;
          S.tab === "register" ? loadRegister() : loadDues();
        }).catch(fail);
      return;
    }
    var rz = t.closest("[data-resume]");
    if (rz) {
      var rn = rz.getAttribute("data-nm");
      MZ.pauseStudent({ enrollment: +rz.getAttribute("data-resume"), resume: true })
        .then(function () {
          toast(rn + " is back"); S.fam = null; S.famInfo = null;
          S.tab === "register" ? loadRegister() : loadDues();
        }).catch(fail);
      return;
    }

    var pl = t.closest("[data-plan]");
    if (pl) { keepAdd(); S.nsPlan = +pl.getAttribute("data-plan"); render(); return; }

    var dp = t.closest("[data-daypick]");
    if (dp) {
      var parts = dp.getAttribute("data-daypick").split(":"), d = +parts[1];
      if (parts[0] === "whDays" && S.who) {
        toggleDay(S.who.days = S.who.days || [], d);
        S.who.oneOk = null;                    /* changing the days withdraws the question */
      }
      else { keepAdd(); toggleDay(S.nsDays = S.nsDays || [], d); S.nsOneOk = null; }
      /* the days he picked must survive the redraw, so they live in
         state, not in the DOM the redraw is about to replace */
      render(); return;
    }
    if (t.closest("[data-clear]")) { S.fIns = null; S.q = ""; render(); return; }
    var fi = t.closest("[data-fi]");
    if (fi) { var v = fi.getAttribute("data-fi"); S.fIns = v || null; S.q = ""; render(); return; }
    if (t.closest("[data-off]")) { S.showOff = true; render(); return; }
    var md = t.closest("[data-mode]");
    if (md) { S.mode = md.getAttribute("data-mode"); loadRegister(); render(); return; }

    if (t.closest("[data-add]")) {
      S.tab = "add"; S.nsDays = []; S.nsPlan = 1; S.nsErr = {}; S.nsVals = {}; S.nsOneOk = null;
      S.nsDupe = null; S.nsDupeOk = false;
      MZ.reference().then(function (r) { S.ref = r; render(); }).catch(fail);
      render(); return;
    }
    if (t.closest("#nsCancel")) { S.tab = "register"; render(); return; }
    if (t.closest("#nsSave")) {
      /* The second press is the answer. Clearing it here rather than in
         saveStudent keeps the question a UI state and the save a save. */
      if (S.nsDupe && S.nsDupe.length) { S.nsDupe = null; S.nsDupeOk = true; }
      saveStudent(); return;
    }
    if (t.closest("#exSave")) { saveExpense(); return; }
    var lg = t.closest("[data-ledger]");
    if (lg) { S.ledger = lg.getAttribute("data-ledger"); render(); return; }
    if (t.closest("[data-months]")) { S.monthPick = !S.monthPick; render(); return; }
    var jm = t.closest("[data-jump]");
    if (jm) {
      var parts = jm.getAttribute("data-jump").split("-");
      S.month = { y: +parts[0], m: +parts[1] };
      S.monthPick = false;
      /* Jumping to another month in day view has no day to land on, so
         it lands on the first — and on the CURRENT month it lands on
         today, which is the one he actually wants. */
      var now = MZ.todayIso();
      if (+now.slice(0, 4) === S.month.y && +now.slice(5, 7) === S.month.m) {
        S.day = now;
      } else {
        /* the 1st, unless the 1st is a Sunday — landing a jump on the
           one day the school is shut answers "show me March" with
           "no class today", which is true and useless */
        var dd = 1;
        while (dd <= 7 && isSunday(S.month.y + "-" + String(S.month.m).padStart(2, "0") +
               "-" + String(dd).padStart(2, "0"))) dd++;
        S.day = S.month.y + "-" + String(S.month.m).padStart(2, "0") +
                "-" + String(dd).padStart(2, "0");
      }
      (S.tab === "money" ? loadMoney : loadRegister)(); render(); return;
    }
    var wv = t.closest("[data-wavestrip]");
    if (wv) {
      var wd = dayFromWave(wv, e.clientX);
      S.wave = S.wave === wd ? null : wd;
      render(); return;
    }
    var ee = t.closest("[data-exedit]");
    if (ee) { S.exEdit = +ee.getAttribute("data-exedit"); S.exKill = null; render(); return; }
    var ek = t.closest("[data-exkill]");
    if (ek) { S.exKill = +ek.getAttribute("data-exkill"); S.exEdit = null; render(); return; }
    if (t.closest("[data-excancel]")) { S.exEdit = null; S.exKill = null; render(); return; }
    var es = t.closest("[data-exsave]");
    if (es) {
      var id = +es.getAttribute("data-exsave");
      MZ.editExpense(id, {
        amount: +((document.getElementById("exeAmt") || {}).value || 0),
        detail: (document.getElementById("exeWhat") || {}).value || ""
      }).then(function () { S.exEdit = null; toast("Changed"); loadMoney(); }).catch(fail);
      return;
    }
    var ky = t.closest("[data-exkillyes]");
    if (ky) {
      MZ.removeExpense(+ky.getAttribute("data-exkillyes"))
        .then(function () { S.exKill = null; toast("Removed"); loadMoney(); }).catch(fail);
      return;
    }

    /* WhatsApp is a real <a> so the OS opens it. window.open returns
       null whenever noopener is set — that is success, not failure —
       so nothing here inspects a handle. We only record that he asked. */
    var wa = t.closest("[data-sent]");
    if (wa) {
      MZ.logReminder({ enrollment: +wa.getAttribute("data-sent"),
                       amount: +wa.getAttribute("data-amt"),
                       phone: wa.getAttribute("data-ph") })
        .then(function () { loadDues(); }).catch(function () {});
      return;
    }
    var pd = t.closest("[data-paid]");
    if (pd) {
      S.fam = null; S.famInfo = null;
      openPay(+pd.getAttribute("data-paid"), pd.getAttribute("data-nm"),
              pd.getAttribute("data-sport"), +pd.getAttribute("data-amt"));
      return;
    }
    if (t.closest("[data-other]")) { loadPicker(); return; }
    var pk = t.closest("[data-pick]");
    if (pk) {
      S.picker = null;
      openPay(+pk.getAttribute("data-pick"), pk.getAttribute("data-nm"),
              pk.getAttribute("data-sport"), null);
      return;
    }
    if (t.closest("#pkCancel")) { S.picker = null; render(); return; }

    var who = t.closest("[data-who]");
    if (who) { openWho(who); return; }
    if (t.closest("#whCancel")) { S.who = null; S.err = ""; render(); return; }
    if (t.closest("#whSave"))   {
      if (S.who && S.who.oneOk === "ask") S.who.oneOk = "ok";
      saveWho(); return;
    }
    if (t.closest("#whStop"))   { S.who.confirmStop = true; render(); return; }
    if (t.closest("#whStopNo")) { S.who.confirmStop = false; render(); return; }
    if (t.closest("#whStopYes")){ stopWho(); return; }
    if (t.closest("#whPay")) {
      var w = S.who; S.who = null;
      openPay(w.enrollment, w.name, w.sport, null);
      return;
    }

    /* Undoing a payment. void_payment() also recomputes the months it
       had covered, so the family's next due date goes back to what it
       was — which a status flip on the row would not do. */
    var vd = t.closest("[data-void]");
    if (vd) {
      var id = +vd.getAttribute("data-void");
      if (!window.confirm("Cancel this payment? The family's next due date goes back to what it was.")) return;
      MZ.voidPayment(id).then(function () { toast("Payment cancelled"); loadMoney(); }).catch(fail);
      return;
    }
    var pm = t.closest("[data-paymonths]");
    if (pm) { S.pay.months = +pm.getAttribute("data-paymonths"); repriceAndRender(); return; }
    var pmo = t.closest("[data-paymode]");
    if (pmo) { S.pay.mode = pmo.getAttribute("data-paymode"); render(); return; }
    if (t.closest("#payGo")) { confirmPay(); return; }
    if (t.closest("#payCancel")) { S.pay = null; S.err = ""; render(); return; }
  });
  document.addEventListener("input", function (e) {
    if (e.target.id === "pq" && S.picker) {
      S.picker.q = e.target.value; var pv = S.picker.q;
      render();
      var pn = document.getElementById("pq"); if (pn) { pn.value = pv; pn.focus(); }
      return;
    }
    if (e.target.id === "q") { S.q = e.target.value; var v = S.q;
      var cur = document.getElementById("q"); render();
      var n = document.getElementById("q"); if (n) { n.value = v; n.focus(); } }
    /* Typing an amount retitles the button, in place. NOT a render: a
       re-render would take the caret out of the box he is typing in. */
    if (e.target.id === "payAmt") {
      var go = document.getElementById("payGo");
      if (go) go.textContent = payLabel(payAmount());
    }
  });

  /* Ticking a day redraws the form, and a redraw replaces the DOM the
     half-typed name was living in. It goes into state first. */
  /* Changing the name withdraws the duplicate question — it was asked
     about a different name. Same rule the day picker follows. */
  function keepAdd() {
    var n = document.getElementById("nsName"), p = document.getElementById("nsPhone"),
        i = document.getElementById("nsIns");
    if (!n) return;
    var was = String((S.nsVals || {}).name || "").trim().toLowerCase();
    S.nsVals = { name: n.value, phone: (p || {}).value || "", ins: (i || {}).value || "" };
    /* A different name is a different question. Leaving the answer
       standing would let "Sri" be approved and "Sriram" saved on it. */
    if (String(n.value).trim().toLowerCase() !== was) {
      S.nsDupe = null; S.nsDupeOk = false;
    }
  }

  function saveStudent() {
    keepAdd();
    var v = S.nsVals, E = {};
    if (!String(v.name || "").trim()) E.name = "A name is needed.";
    var ph = String(v.phone || "").replace(/\D/g, "");
    /* A family with no number cannot be sent a reminder, and the whole
       dues tab is reminders. It is not optional here. */
    if (!ph) E.phone = "A parent\u2019s number is needed for reminders.";
    else if (ph.length !== 10) E.phone = "That is " + ph.length + " digits, not 10.";
    if (!(S.nsDays || []).length) E.days = "Pick the days he comes.";
    S.nsErr = E;
    if (Object.keys(E).length) { render(); return; }

    /* ONE DAY IS ASKED ABOUT, NOT REFUSED.
       Two a week is the shape of this school, so one day is usually a
       slip — but a child who genuinely comes once a week exists, and
       an app that refuses to save them is an app he works around. It
       asks once and then does as it is told. */
    if ((S.nsDays || []).length === 1 && !S.nsOneOk) {
      S.nsOneOk = "ask"; render(); return;
    }

    /* IS HE ALREADY HERE? Asked once, the same way the one-day question
       is asked, and for the same reason: two children called Sri is a
       real thing and an app that refuses to save the second is an app
       he works around. But "Sri" twice within a minute — which is what
       happened, with two different phone numbers — is a typo being
       retyped rather than a second child arriving.

       NOT keyed on the phone. The two that got through had DIFFERENT
       numbers; the name is what repeated, so the name is what is
       checked. A failed check must never block a save: if the lookup
       cannot be made, the student is saved. */
    if (!S.nsDupeOk) {
      var bq = document.getElementById("nsSave");
      if (bq) { bq.disabled = true; bq.textContent = "Checking…"; }
      MZ.findByName(v.name)
        .then(function (rows) {
          if (Array.isArray(rows) && rows.length) {
            S.nsDupe = rows.slice(0, 3); render(); return;
          }
          S.nsDupeOk = true; saveStudent();
        })
        .catch(function () { S.nsDupeOk = true; saveStudent(); });
      return;
    }

    var b = document.getElementById("nsSave");
    b.disabled = true; b.textContent = "Saving…";
    MZ.addStudent({
      name: v.name,
      phone: ph,
      instrument: v.ins || (document.getElementById("nsIns") || {}).value,
      days: (S.nsDays || []).slice(),
      planMonths: S.nsPlan || 1,
      centre: (S.ref.centres[0] || {}).id
    }).then(function (m) {
      toast(m.name + " added");
      S.tab = "register"; S.nsErr = {}; S.nsVals = {}; S.nsOneOk = null;
      loadRegister();
      /* THE FEE COMES FROM THE DATABASE, NOT FROM HERE.
         He wanted the amount in front of him with a chance to change
         it. It cannot be shown BEFORE saving, because resolve_fee()
         prices an enrolment and there is no enrolment until this
         write lands — and a fee this client worked out itself is the
         one thing the platform does not allow. So the moment it does
         land, the payment sheet opens with the amount already asked
         for and already editable. */
      if (m.enrollment) openPay(m.enrollment, m.name, v.ins, null);
      else render();
    }).catch(function (e) { b.disabled = false; b.textContent = "Save student"; fail(e); });
  }

  function saveExpense() {
    var b = document.getElementById("exSave");
    var amt = +document.getElementById("exAmt").value;
    var what = document.getElementById("exWhat").value.trim();
    b.disabled = true; b.textContent = "Saving…";
    MZ.addExpense({ amount: amt, detail: what || "General", category: "General" })
      .then(function () { toast("Expense saved"); loadMoney(); })
      .catch(function (e) { b.disabled = false; b.textContent = "Save expense"; fail(e); });
  }

  /* ---------- entering a tab loads only what that tab needs ---------- */
  function enter() {
    S.fresh = true;
    render();
    if (S.tab === "register") loadRegister();
    else if (S.tab === "dues") loadDues();
    else if (S.tab === "money") loadMoney();
  }
  function boot() {
    MZ.report("page_view", {});
    /* The register needs the batches' day patterns to know who is even
       expected today, and this arrives after the first paint. Without
       the re-render it stayed on the safe fallback — show everybody —
       so the filter looked broken while being perfectly correct about
       what it knew at the time. */
    MZ.reference().then(function (r) { S.ref = r; render(); }).catch(function () {});
    enter();
  }

  window.addEventListener("error", function (e) {
    MZ.report("client_error", { msg: String((e && e.message) || "error").slice(0, 140) });
  });

  if (MZ.signedIn()) boot(); else gate();
})();
</script>
</body>
</html>
