<!-- ============================================================
     REAL REFRACTION.
     A displacement map, fed to the backdrop. The map is neutral grey
     (128,128) through the middle and ramps to black/full in the outer
     14%, so the picture behind the pane is BENT at the bezel and left
     alone in the centre — which is what a pane of glass actually does,
     and what a blur can only imply.

     Scale 8, measured against 14 and 22 side by side over this
     background: 14 smears, 22 melts, 8 bends.

     Only Chromium honours url() in backdrop-filter today. The script
     below feature-tests it and adds .has-refraction; without that
     class the CSS bevel does the job instead, so Safari — which is
     what he actually uses — gets the fallback and never gets a
     broken-looking pane.
     ============================================================ -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <filter id="mz-glass" x="0%" y="0%" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feImage href="data:image/svg+xml;utf8,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20width%3D%27100%27%20height%3D%27100%27%3E%3Cdefs%3E%3ClinearGradient%20id%3D%27gx%27%20x1%3D%270%27%20y1%3D%270%27%20x2%3D%271%27%20y2%3D%270%27%3E%3Cstop%20offset%3D%270%27%20stop-color%3D%27%23000000%27%2F%3E%3Cstop%20offset%3D%270.14%27%20stop-color%3D%27%23800000%27%2F%3E%3Cstop%20offset%3D%270.86%27%20stop-color%3D%27%23800000%27%2F%3E%3Cstop%20offset%3D%271%27%20stop-color%3D%27%23ff0000%27%2F%3E%3C%2FlinearGradient%3E%3ClinearGradient%20id%3D%27gy%27%20x1%3D%270%27%20y1%3D%270%27%20x2%3D%270%27%20y2%3D%271%27%3E%3Cstop%20offset%3D%270%27%20stop-color%3D%27%23000000%27%2F%3E%3Cstop%20offset%3D%270.14%27%20stop-color%3D%27%23008000%27%2F%3E%3Cstop%20offset%3D%270.86%27%20stop-color%3D%27%23008000%27%2F%3E%3Cstop%20offset%3D%271%27%20stop-color%3D%27%2300ff00%27%2F%3E%3C%2FlinearGradient%3E%3C%2Fdefs%3E%3Crect%20width%3D%27100%27%20height%3D%27100%27%20fill%3D%27url%28%23gx%29%27%2F%3E%3Crect%20width%3D%27100%27%20height%3D%27100%27%20fill%3D%27url%28%23gy%29%27%20style%3D%27mix-blend-mode%3Ascreen%27%2F%3E%3C%2Fsvg%3E" result="m" preserveAspectRatio="none" x="0%" y="0%" width="100%" height="100%"/>
    <feDisplacementMap in="SourceGraphic" in2="m" scale="8" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</defs></svg>
<script>
  /* CSS.supports() LIES HERE, AND I CHECKED ON THE DEVICE.
     iPadOS 18.3 Safari answers YES to backdrop-filter: url() and then
     renders no backdrop effect at all — and because the url() sits in
     the same filter list as the blur, it drops the blur with it. The
     result on his actual iPad was flat translucent boxes with no
     glass whatsoever: worse than never having tried.

     So the support query is not enough. -webkit-touch-callout is a
     WebKit-only property, which makes it a reliable tell for the
     engine that has this bug — and it correctly also covers Chrome
     and Edge on iOS, which are WebKit underneath and share it.

     Verified both ways: Chromium true, iPad Safari 18.3 false. */
  try {
    var C = window.CSS;
    if (C && C.supports &&
        C.supports("backdrop-filter", "url(#mz-glass)") &&
        !C.supports("-webkit-touch-callout", "none")) {
      document.documentElement.className += " has-refraction";
    }
  } catch (e) {}
</script>

<script>
/* ============================================================
   MEZZO — the whole app.

   Three tabs and nothing else. Everything on screen is either
   something he taps or a number he reads; there is no navigation to
   learn and no screen he can end up on without a way back, because
   the tabs never leave.

   Money is never computed here. resolve_fee prices a student,
   record_fee_payment writes the rupees, reminder_queue decides who is
   late — and this tenant's config already says "one nudge, one day
   late", so the list that comes back IS his list. Filtering it here
   would be how his screen and his WhatsApp start disagreeing.
   ============================================================ */
(function () {
  "use strict";
  var root = document.getElementById("root"), tabs = document.getElementById("tabs");

  var S = {
    tab: "register",
    mode: "today",            // today | month
    day: MZ.todayIso(),
    month: null,              // {y, m}
    q: "",
    fresh: false,             // true for exactly one render, after a tab change
    pay: null,                // the payment being taken: {enrollment,name,amount,months,mode}
    picker: null,             // the student list, when choosing who paid
    who: null,                // the student card: {enrollment,member,name,sport,batch,phone}
    nsDays: [],               // the days ticked on the add-student form
    nsPlan: 1,                // how many months they are paying for
    nsErr: {},                // per-field messages on the add form
    nsVals: {},               // what he typed, so a redraw never eats it
    nsOneOk: null,            // "ask" while one-day-a-week is being confirmed
    pulse: null,              // {sport, kind} — the section to play after the next paint
    fIns: null,               // instrument filter, null = all
    showOff: false,
    register: null,           // rows from attendance_month
    dues: null,
    duesReg: null,            // this month's register, for the family card
    people: null,             // every live enrolment, with its due row if any
    pausing: null,            // the enrolment whose pause panel is open
    pauseMonths: 1,           // how long they are going away for
    fam: null,                // the family card that is open: an index into S.dues
    famInfo: null,            // that member's row, once it lands
    money: null,
    monthPick: false,         // the twelve-month strip is open
    ledger: "spent",          // which face of the money panel is showing
    wave: null,               // the day tapped on the month's waveform
    exEdit: null,             // the expense being changed
    exKill: null,             // the expense being removed, awaiting a yes
    ref: null,
    busy: {},                 // enrollment_id -> true while a mark is in flight
    err: ""
  };
  (function () { var d = new Date(); S.month = { y: d.getFullYear(), m: d.getMonth() + 1 }; })();

  /* ---------- the instruments ----------
     Eight instruments, eight colours and eight notes. This is the only
     place either is decided.

     The colour is not decoration. He teaches eight instruments to
     eighty children and the one thing a register cannot tell him at a
     glance is WHICH — so the colour carries that, down the side of
     every row, through the month grid, into the dues list and the
     money. Scanning becomes seeing.

     The note is the same idea for the ear. Marking a piano student
     sounds like a piano and a guitar student like a plucked string, so
     a mis-tap is something he HEARS before he sees it — on a register
     where a wrong tap marks a child absent, that is worth more than it
     costs.

     PLATFORM.md is explicit that this belongs here: "A batch's colour
     satisfies none of them, and belongs in the app." */
  /* Pitched for a DARK surface. The first set of these was mixed for
     white cards and went muddy the moment the app turned dark — a hue
     that reads as "violin" at 40% lightness on white is a smudge on
     #14101F. Every one is lifted until it holds its own against the
     background it actually sits on. */
  /* Each instrument carries three things: the colour it is drawn in,
     the note it sounds when it is touched, and a mark of itself. The
     marks are deliberately crude — at 22px a violin and a ukulele are
     the same figure of eight, so what tells them apart is the neck,
     the scroll and above all the colour. The icon is reinforcement,
     not the label; the word is right beside it. */
  /* The marks, kept out of the table so the table stays readable as a
     table. Crude on purpose: at 26px a violin and a ukulele are the
     same figure of eight, and what really tells them apart is the
     colour and the word beside them. */
  var I_PIANO  = '<rect x="2.5" y="7" width="19" height="10" rx="1.6"/><path d="M8.8 7v6M15.2 7v6"/><path d="M6.4 7v4.2h2V7M12 7v4.2h2V7M17.6 7v4.2h2V7" fill="currentColor" stroke="none" opacity=".85"/>';
  var I_KEYB   = '<rect x="2.5" y="6" width="19" height="8" rx="1.4"/><path d="M7 6v4.5M12 6v4.5M17 6v4.5"/><path d="M8.5 18h7M12 14v4"/>';
  var I_GUITAR = '<path d="M17.4 1.8 12.2 8.8"/><path d="M16.2 1.6 18.8 3.4"/>' +
                 '<circle cx="9.6" cy="16.6" r="5"/><circle cx="12.9" cy="12.2" r="3.3"/>' +
                 '<circle cx="10.8" cy="14.6" r="1.4"/>';
  var I_VIOLIN = '<path d="M16.6 2.2c1.4-.5 2.6.6 2 1.9L13 12"/><circle cx="9.4" cy="16.6" r="5"/><circle cx="12.9" cy="12" r="3.4"/><path d="M8 15.2v3M11.4 15.2v3"/>';
  /* A ukulele was the same drawing as a guitar, one pixel smaller —
     at 25px they were one icon in two colours, which is exactly the
     Guitar/Drums colour collision again in a different medium. So the
     difference is made GROSS: the guitar gets a long neck and a
     headstock, the ukulele a stubby one and four tuning pegs. */
  var I_UKE    = '<path d="M13.4 8.6 15.6 4.6"/><path d="M14.4 4.9 17 6.4"/>' +
                 '<circle cx="10.4" cy="15.6" r="5.6"/><circle cx="10.4" cy="15.6" r="1.7"/>';
  var I_DRUM   = '<circle cx="12" cy="14" r="6.6"/><circle cx="12" cy="14" r="3"/><path d="M5.4 14v3.4M18.6 14v3.4"/><path d="M4 6.6 9 11M20 6.6 15 11"/>';
  var I_VOCAL  = '<rect x="9.2" y="2.4" width="5.6" height="10" rx="2.8"/><path d="M5.8 11.2a6.2 6.2 0 0 0 12.4 0"/><path d="M12 17.4V21M9 21h6"/>';
  var I_FLUTE  = '<path d="M3.4 15.6 20.6 8.4"/><circle cx="8.2" cy="13.6" r=".9"/><circle cx="11.6" cy="12.2" r=".9"/><circle cx="15" cy="10.8" r=".9"/>';

  /* THE EIGHT HUES, re-cut for paper.
     These were pastels — lifted right up because they sat on dark
     violet. On cream every one of them washed out, and two of them
     were the same colour: Guitar #F5B25E and Drums #EDA05C are 19.8
     apart in RGB, which is not a difference, it is a rounding error.
     Two section headings on one sheet cannot be that close.

     Re-cut dark enough for cream (every one measured 4.0:1 or better
     against #F9F4E7) and spread properly round the wheel — the
     closest pair is now Violin/Vocals at 37.1, nearly double the old
     worst case. Drums went slate on purpose: it is hardware, and a
     neutral is the one thing guaranteed not to collide with the six
     warm-to-cool instruments either side of it. */
  var INSTRUMENT = {
    Piano:    { hue: "#4A46B8", note: 60, icon: I_PIANO },
    Keyboard: { hue: "#0E7C86", note: 62, icon: I_KEYB },
    Guitar:   { hue: "#9A6B12", note: 64, icon: I_GUITAR },
    Violin:   { hue: "#B0344A", note: 67, icon: I_VIOLIN },
    Ukulele:  { hue: "#C25A17", note: 69, icon: I_UKE },
    Drums:    { hue: "#4F5B66", note: 48, icon: I_DRUM },
    Vocals:   { hue: "#A8306E", note: 72, icon: I_VOCAL },
    Flute:    { hue: "#2E7D46", note: 71, icon: I_FLUTE }
  };
  function inst(name) {
    return INSTRUMENT[name] || { hue: "#6B5CA5", note: 65, icon: '<circle cx="12" cy="12" r="7"/>' };
  }
  function svgIcon(ins) {
    return '<svg viewBox="0 0 24 24" aria-hidden="true">' + (ins.icon || "") + "</svg>";
  }

  /* ---------- small helpers ---------- */
  function esc(s) { var d = document.createElement("i"); d.textContent = String(s == null ? "" : s); return d.innerHTML; }
  function inr(n) { return "₹" + Number(n || 0).toLocaleString("en-IN"); }
  function el(html) { var d = document.createElement("div"); d.innerHTML = html; return d.firstElementChild; }
  function dayName(iso) {
    var p = iso.split("-"), d = new Date(+p[0], +p[1] - 1, +p[2]);
    return d.toLocaleDateString("en-IN", { weekday: "long", day: "numeric", month: "short" });
  }
  function isSunday(iso) { var p = iso.split("-"); return new Date(+p[0], +p[1] - 1, +p[2]).getDay() === 0; }
  function isoDow(iso) {                       // 1 = Monday … 7 = Sunday
    var p = iso.split("-"), d = new Date(+p[0], +p[1] - 1, +p[2]).getDay();
    return d === 0 ? 7 : d;
  }
  /* Does this student's class actually run on that day?
     Weekday students do not come on Saturday and Saturday students do
     not come midweek. Showing all 80 names every day is noise; worse,
     an unmarked circle against a child who was never expected reads as
     "you forgot to mark them", which is the opposite of the truth. */
  /* Which days this child actually comes. The pattern lives on the
     enrolment's batch, which is now nothing more than a day pattern. */
  function daysOf(batchId) {
    var bs = (S.ref && S.ref.batches) || [];
    for (var i = 0; i < bs.length; i++) if (bs[i].id === batchId) return (bs[i].days || []).slice();
    return [];
  }
  var DAY_NAMES = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
  /* Monday to Saturday, because the school is shut on Sunday and a
     control that offers a day nobody can attend is a control that
     invites a mistake. */
  function dayPicker(id, sel) {
    var out = '<div class="daypick" id="' + id + '">';
    for (var d = 1; d <= 6; d++) {
      out += '<button type="button" data-daypick="' + id + ':' + d + '"' +
             (sel.indexOf(d) >= 0 ? ' class="on"' : "") + ">" + DAY_NAMES[d] + "</button>";
    }
    return out + "</div>";
  }
  /* ============================================================
     TWO DAYS A WEEK IS THE SHAPE OF THIS SCHOOL

     He teaches almost everybody twice a week, and the fee in
     fee_rules is priced for that. So the picker is not a free-for-all
     and it is not a rule either — one child genuinely comes once a
     week and another comes four times, and both are allowed.

     What the app owes him is a NUDGE at the moment he is choosing,
     not a wall of explanation afterwards. One short line, in his own
     words, and never a number: the amounts live in the database and
     this file is not allowed to know them.
     ============================================================ */
  function dayHint(days) {
    var n = (days || []).length;
    if (n === 1) return { tone: "soft", text: "Most come twice a week." };
    if (n >= 3)  return { tone: "warn", text: n + " days \u2014 more than the usual two. " +
                                              "Set the fee when you take the payment." };
    return null;
  }
  function dayHintHtml(days) {
    var h = dayHint(days);
    return h ? '<em class="dhint ' + h.tone + '">' + h.text + "</em>" : "";
  }

  function toggleDay(list, d) {
    var i = list.indexOf(d);
    if (i >= 0) list.splice(i, 1); else list.push(d);
    list.sort(function (a, b) { return a - b; });
    return list;
  }

  function runsOn(batchId, iso) {
    var bs = (S.ref && S.ref.batches) || [];
    for (var i = 0; i < bs.length; i++) {
      if (bs[i].id === batchId) {
        var d = bs[i].days;
        /* No day pattern is not "no days" — it is "we do not know", and
           the safe answer to not knowing is to show the child. Reading
           an empty array as "never" would empty his whole register on a
           day the reference data came back thin. */
        if (!d || !d.length) return true;
        return d.indexOf(isoDow(iso)) >= 0;
      }
    }
    return true;                               // unknown batch: never hide a child
  }
  function shiftDay(iso, by) {
    var p = iso.split("-"), d = new Date(+p[0], +p[1] - 1, +p[2]);
    d.setDate(d.getDate() + by); return MZ.iso(d);
  }
  var toastT = null;
  function toast(msg) {
    var old = document.querySelector(".toast"); if (old) old.remove();
    var t = el('<div class="toast">' + esc(msg) + "</div>");
    document.body.appendChild(t);
    clearTimeout(toastT); toastT = setTimeout(function () { t.remove(); }, 2200);
  }
  function fail(e) {
    S.err = (e && e.message) || "Something went wrong. Check the internet and try again.";
    render();
  }

  /* ---------- sign in ----------
     The one screen that is allowed to be theatrical. He sees it once a
     day for four seconds; the three tabs behind it are where he works
     and they stay calm. A mis-tap here costs a retry, not a child's
     attendance record, which is why the budget for delight is spent
     at this end of the app and not the other.

     The password field IS a keyboard. There is still a real
     <input type="password"> sitting over the keys — transparent text,
     gold caret — so password managers, autofill and screen readers all
     behave exactly as they did. The keys are what you see instead of
     dots, and each character presses the next one and sounds its note. */

  /* Twelve white keys and the eight black ones that belong between
     them, as MIDI numbers, so a password plays up the scale. */
  var WHITE = [60, 62, 64, 65, 67, 69, 71, 72, 74, 76, 77, 79];
  var BLACK_AFTER = [0, 1, 3, 4, 5, 7, 8, 10];
  var BLACK = [61, 63, 66, 68, 70, 73, 75, 78];
  /* White keys only. Running up every key including the blacks made a
     password of eight characters land on a scatter of black and white
     that read as noise; eight white keys in a row reads as progress,
     and it walks up a plain major scale, which is also the nicest
     thing to hear. The black keys are still drawn — a keyboard without
     them is not a keyboard — they just never light. */
  var ORDER = WHITE.slice();

  function keyboardHtml() {
    var w = 100 / WHITE.length, bw = w * 0.62, html = "";
    for (var i = 0; i < WHITE.length; i++) {
      html += '<i class="kw" data-note="' + WHITE[i] + '" style="left:' + (i * w) +
              "%;width:" + w + '%"></i>';
    }
    for (var j = 0; j < BLACK_AFTER.length; j++) {
      var left = (BLACK_AFTER[j] + 1) * w - bw / 2;
      html += '<i class="kb" data-note="' + BLACK[j] + '" style="left:' + left +
              "%;width:" + bw + '%"></i>';
    }
    return html;
  }

  /* A note, synthesised. No audio file, and wrapped so that a browser
     without Web Audio — or a test harness with no browser at all —
     simply gets silence instead of a sign-in screen that will not load. */
  var AC = null;
  function tone(midi, level) {
    level = level === undefined ? 1 : level;
    try {
      var C = window.AudioContext || window.webkitAudioContext;
      if (!C) return;
      if (!AC) AC = new C();
      if (AC.state === "suspended") AC.resume();
      var t = AC.currentTime, f = 440 * Math.pow(2, (midi - 69) / 12);
      [[1, 0.11 * level], [2.01, 0.04 * level], [3, 0.012 * level]].forEach(function (h) {
        var o = AC.createOscillator(), g = AC.createGain();
        o.type = "sine"; o.frequency.value = f * h[0];
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(h[1], t + 0.006);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 1.1);
        o.connect(g); g.connect(AC.destination);
        o.start(t); o.stop(t + 1.15);
      });
    } catch (e) { /* a sign-in must never fail because of a sound */ }
  }

  /* ============================================================
     THE SOUND OF THE APP

     Every sound is synthesised — there is no audio file in this repo,
     so nothing to download, nothing to fail on a bad connection, and
     nothing that needs a licence.

     The rule that decides what each sound IS: a sound should be the
     sound of the ACT, not a notification about it.

       Attendance is paper.  He is ticking names on a sheet, so the
                             mark sounds like graphite: a short bright
                             scratch, two strokes for a tick, one long
                             drag for a strike-off, a soft brush to
                             rub one out. The instrument's own note
                             sits UNDER it, quiet, so the section is
                             still audible without the register
                             turning into a xylophone.
       Dues is the tuner.    Collecting glides a flat note up into
                             true — the same idea as the tuner screen,
                             in the ear instead of the eye.
       Money is wood.        A ledger stamp: low, short, done.

     Nothing here is louder than 0.3 peak except a deliberate accent,
     and everything is under 700ms. This is used between students, in
     a room with a child in it.
     ============================================================ */
  var NOISE = null;
  function ac() {
    try {
      var C = window.AudioContext || window.webkitAudioContext;
      if (!C) return null;
      if (!AC) AC = new C();
      if (AC.state === "suspended") AC.resume();
      return AC;
    } catch (e) { return null; }
  }
  /* One second of white noise, made once and replayed at different
     speeds and through different filters. Every paper sound in the app
     comes out of this one buffer. */
  function noiseBuf(a) {
    if (NOISE) return NOISE;
    var n = a.sampleRate, b = a.createBuffer(1, n, a.sampleRate), d = b.getChannelData(0);
    for (var i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    return (NOISE = b);
  }
  /* One stroke of something rough across something dry.
     dur   how long the stroke takes
     hz    where the grain sits — graphite is bright, paper is dull
     peak  loudness
     rate  playback speed, varied per call so two ticks in a row are
           never the same stroke twice. A pencil is never identical. */
  function stroke(dur, hz, peak, rate, delay) {
    var a = ac(); if (!a) return;
    var t = a.currentTime + (delay || 0);
    var src = a.createBufferSource(); src.buffer = noiseBuf(a);
    src.playbackRate.value = rate || (0.85 + Math.random() * 0.4);
    var bp = a.createBiquadFilter(); bp.type = "bandpass";
    bp.frequency.value = hz; bp.Q.value = 0.8;
    var hp = a.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = hz * 0.4;
    var g = a.createGain();
    /* ramp UP then down: that is what makes it a drag rather than a
       click. A click is an envelope with no rise. */
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(peak, t + dur * 0.34);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(bp); bp.connect(hp); hp.connect(g); g.connect(a.destination);
    src.start(t); src.stop(t + dur + 0.02);
  }
  /* A tick is TWO strokes — a short one down, a long one up — and it
     is the double stroke that makes it read as a tick rather than as
     a scratch. */
  function pencilTick() { stroke(0.055, 3200, 0.22); stroke(0.115, 4200, 0.26, null, 0.052); }
  /* Struck off: one drag, longer and lower, pressed harder. */
  function pencilStrike() { stroke(0.20, 1900, 0.30, 0.7); }
  /* Rubbed out: dull, quiet, no grain. */
  function paperBrush() { stroke(0.13, 900, 0.13, 0.55); }
  /* A plucked string: a bright transient that dies fast, through a
     filter that closes as it decays — which is what a real string
     does and what a plain sine never does. */
  function pluck(midi, level) {
    var a = ac(); if (!a) return;
    level = level === undefined ? 1 : level;
    var t = a.currentTime, f = 440 * Math.pow(2, (midi - 69) / 12);
    var o = a.createOscillator(); o.type = "sawtooth"; o.frequency.value = f;
    var lp = a.createBiquadFilter(); lp.type = "lowpass";
    lp.frequency.setValueAtTime(f * 7, t);
    lp.frequency.exponentialRampToValueAtTime(Math.max(f * 1.2, 200), t + 0.42);
    var g = a.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.26 * level, t + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.62);
    o.connect(lp); lp.connect(g); g.connect(a.destination);
    o.start(t); o.stop(t + 0.7);
    stroke(0.03, 5200, 0.05 * level);      /* the nail on the string */
  }
  /* A bowed swell: slow in, slow out, no transient. */
  function bow(midi, level) {
    var a = ac(); if (!a) return;
    level = level === undefined ? 1 : level;
    var t = a.currentTime, f = 440 * Math.pow(2, (midi - 69) / 12);
    [[1, 0.16], [2, 0.05], [3.01, 0.02]].forEach(function (h) {
      var o = a.createOscillator(); o.type = "sine"; o.frequency.value = f * h[0];
      var g = a.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(h[1] * level, t + 0.13);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.62);
      o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + 0.68);
    });
  }
  /* Flat, and then true. The tuner's whole idea, in the ear. */
  function intoTune(midi, cents, level) {
    var a = ac(); if (!a) return;
    var t = a.currentTime, f = 440 * Math.pow(2, (midi - 69) / 12);
    var o = a.createOscillator(); o.type = "triangle";
    o.frequency.setValueAtTime(f * Math.pow(2, -cents / 1200), t);
    o.frequency.exponentialRampToValueAtTime(f, t + 0.46);
    var g = a.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.20 * (level || 1), t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.9);
    o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + 0.95);
  }
  /* A struck piano string: three partials, the upper ones slightly
     SHARP of the harmonic. Real strings are stiff and their overtones
     run sharp, which is the whole reason a piano sounds like a piano
     and a stack of pure sines sounds like a test tone. */
  function struck(midi, level) {
    var a = ac(); if (!a) return;
    level = level === undefined ? 1 : level;
    var t = a.currentTime, f = 440 * Math.pow(2, (midi - 69) / 12);
    [[1, 0.17, 1.0], [2.004, 0.06, 0.7], [3.012, 0.022, 0.45]].forEach(function (h) {
      var o = a.createOscillator(); o.type = "sine"; o.frequency.value = f * h[0];
      var g = a.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(h[1] * level, t + 0.004);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.85 * h[2]);
      o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + 0.9);
    });
  }
  /* A struck head: the pitch DROPS as the skin relaxes, and the noise
     is low and short. Nothing here is bandpassed up where the pencil
     lives, so a drum can never be mistaken for paper. */
  function hit(midi, level) {
    var a = ac(); if (!a) return;
    level = level === undefined ? 1 : level;
    var t = a.currentTime, f = 440 * Math.pow(2, (midi - 69) / 12);
    var o = a.createOscillator(); o.type = "sine";
    o.frequency.setValueAtTime(f * 1.9, t);
    o.frequency.exponentialRampToValueAtTime(f * 0.75, t + 0.14);
    var g = a.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.30 * level, t + 0.004);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.30);
    o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + 0.34);
    stroke(0.05, 420, 0.14 * level, 0.4);          /* the skin, not the pencil */
  }
  /* A flute is mostly air: a soft sine with breath either side of it. */
  function breath(midi, level) {
    var a = ac(); if (!a) return;
    level = level === undefined ? 1 : level;
    var t = a.currentTime, f = 440 * Math.pow(2, (midi - 69) / 12);
    var o = a.createOscillator(); o.type = "sine"; o.frequency.value = f;
    var g = a.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.17 * level, t + 0.06);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.46);
    o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + 0.5);
    stroke(0.14, 2000, 0.045 * level, 0.35);       /* the breath across the lip */
  }
  /* An electric keyboard: square, steady, no decay to speak of. It is
     the one voice here that does not die away, which is exactly what
     tells it apart from the piano beside it. */
  function reed(midi, level) {
    var a = ac(); if (!a) return;
    level = level === undefined ? 1 : level;
    var t = a.currentTime, f = 440 * Math.pow(2, (midi - 69) / 12);
    var o = a.createOscillator(); o.type = "square"; o.frequency.value = f;
    var lp = a.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = f * 4;
    var g = a.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.11 * level, t + 0.012);
    g.gain.setValueAtTime(0.11 * level, t + 0.24);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.40);
    o.connect(lp); lp.connect(g); g.connect(a.destination); o.start(t); o.stop(t + 0.44);
  }
  /* A sung note: two formants over the fundamental, which is roughly
     what makes a vowel a vowel. */
  function voiceNote(midi, level) {
    var a = ac(); if (!a) return;
    level = level === undefined ? 1 : level;
    var t = a.currentTime, f = 440 * Math.pow(2, (midi - 69) / 12);
    var o = a.createOscillator(); o.type = "sawtooth"; o.frequency.value = f;
    var g = a.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.16 * level, t + 0.05);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.55);
    var out = g;
    [[720, 5], [1180, 7]].forEach(function (fm) {          /* an "ah" */
      var bp = a.createBiquadFilter(); bp.type = "peaking";
      bp.frequency.value = fm[0]; bp.Q.value = fm[1]; bp.gain.value = 11;
      out.connect(bp); out = bp;
    });
    o.connect(g); out.connect(a.destination); o.start(t); o.stop(t + 0.6);
  }

  /* The ledger stamp. Low, wooden, over before you notice it. */
  function woodThunk(level) {
    var a = ac(); if (!a) return;
    level = level === undefined ? 1 : level;
    var t = a.currentTime;
    var o = a.createOscillator(); o.type = "sine";
    o.frequency.setValueAtTime(190, t);
    o.frequency.exponentialRampToValueAtTime(96, t + 0.11);
    var g = a.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.26 * level, t + 0.005);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
    o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + 0.26);
    stroke(0.035, 1400, 0.10 * level, 0.5);
  }

  function gate() {
    tabs.hidden = true;
    root.innerHTML =
      '<div class="gate"><div class="ginner">' +
        '<img src="assets/img/logo-white.png" alt="" />' +
        "<h1>Mezzo School of Music</h1>" +
        "<p>Sign in to open the register</p>" +
        (S.err ? '<div class="err">' + esc(S.err) + "</div>" : "") +
        '<label class="field"><span>Email</span>' +
          '<div class="sf"><input id="em" type="email" autocomplete="username" inputmode="email" />' +
          '<svg class="wire" viewBox="0 0 300 20" preserveAspectRatio="none" aria-hidden="true">' +
          '<path vector-effect="non-scaling-stroke" d="M0 10 C 75 8.6 75 8.6 150 10 C 225 11.4 225 11.4 300 10"/></svg></div></label>' +
        '<label class="field"><span>Password</span>' +
          '<div class="pf" id="pf"><div class="pkeys" id="pkeys">' + keyboardHtml() + "</div>" +
          '<input id="pw" type="password" autocomplete="current-password" /></div></label>' +
        '<button class="btn" id="go">Sign in</button>' +
      "</div></div>";
    /* Never a value= on these two. This repo is public, and a prefilled
       password here is a live credential on the open web that stays in
       git history after it is removed. */
    var go = document.getElementById("go");
    var pw = document.getElementById("pw");
    var keys = document.getElementById("pkeys");

    /* Press one more key per character, release on delete. Long
       passwords wrap round the keyboard rather than running out of it. */
    var was = 0;
    if (pw && keys) {
      pw.oninput = function () {
        var n = pw.value.length, all = keys.children;
        for (var i = 0; i < all.length; i++) all[i].className = all[i].className.replace(" on", "");
        for (var k = 0; k < n; k++) {
          var note = ORDER[k % ORDER.length];
          for (var j = 0; j < all.length; j++) {
            if (+all[j].getAttribute("data-note") === note) { all[j].className += " on"; break; }
          }
        }
        if (n > was) tone(ORDER[(n - 1) % ORDER.length]);
        was = n;
      };
    }

    /* The email field is a string, and every letter plucks it. You
       WRITE your name on a string and you PLAY your password on the
       keys — that is the whole idea, and both halves have to respond
       per character or the idea is only half there.

       Two things keep it from becoming a nuisance. It is much quieter
       than the keys, and it is throttled: an email address typed at
       speed would otherwise fire thirty notes in two seconds, which is
       a machine gun, not an instrument. The notes are a low pentatonic
       so any order of them is consonant — you cannot play a wrong one. */
    var PLUCK = [45, 47, 50, 52, 55];          /* A minor pentatonic, low */
    var em = document.getElementById("em");
    var wire = document.querySelector(".wire");
    var wirePath = wire && wire.querySelector("path");
    var lastPluck = 0, twang = null;

    /* RESTARTING AN ANIMATION BY TOGGLING A CLASS IS NOT RELIABLE.
       The old way was remove the class, read offsetWidth to force a
       reflow, add it back. That works in Chrome and does nothing in
       WebKit — and he is on an iPad, so for him the string moved once,
       on the first letter, and then never again however hard he typed.
       Two reasons it was never going to hold: the animation is on the
       <path> but the reflow was forced on its parent <svg>, and SVG
       elements do not reliably have offsetWidth at all.

       So the animation is driven directly instead. Cancel the running
       one, start a new one — no classes, no reflow, no guessing about
       what a browser decided to batch. */
    /* NO TWO PLUCKS ARE THE SAME.
       The first version rang down an identical curve every time —
       same amplitude, same direction, same shape — so however often
       you plucked it, it moved in exactly one way and read as a
       mechanism rather than a string.

       A real string does not do that. Where you catch it decides the
       shape of the wave, how hard decides the amplitude, and it never
       lands twice in the same place. So each keystroke picks a fresh
       one: the belly of the wave moves along the string, the pull goes
       up or down, and both the size and the ring-down time vary. */
    function wave() {
      var at   = 0.22 + Math.random() * 0.56;      /* where it was caught */
      var x    = 300 * at;
      var lift = 10 - Math.random() * 4;
      var up   = Math.random() < 0.5 ? -1 : 1;
      var y    = 10 + lift * up;
      /* one belly, at a different place along the string each time */
      return "M0 10 C " + (x * 0.45).toFixed(1) + " 10 " + (x * 0.7).toFixed(1) + " " + y.toFixed(1) +
             " " + x.toFixed(1) + " " + y.toFixed(1) +
             " C " + (x + (300 - x) * 0.3).toFixed(1) + " " + y.toFixed(1) +
             " " + (x + (300 - x) * 0.55).toFixed(1) + " 10 300 10";
    }

    function pluckString() {
      if (!wirePath) return;
      wirePath.setAttribute("d", wave());          /* a new shape to ring down */
      if (!wirePath.animate) return;               /* very old browser: shape only */

      var amp  = 0.75 + Math.random() * 0.5;
      var dir  = Math.random() < 0.5 ? -1 : 1;
      var dur  = 430 + Math.random() * 220;
      var frames = [], n = 7;
      for (var i = 0; i <= n; i++) {
        /* an exponential decay, alternating sides, ending at rest */
        var k = i === n ? 1 : (1 - i / n) * amp * (i % 2 ? -dir : dir) + (i === 0 ? 0 : 0);
        frames.push({ transform: "scaleY(" + (i === n ? 1 : (k * 4).toFixed(2)) + ")",
                      offset: i / n });
      }
      if (twang) twang.cancel();
      twang = wirePath.animate(frames, { duration: dur, easing: "cubic-bezier(.25,.7,.4,1)" });
    }

    if (em && wire) {
      em.oninput = function () {
        pluckString();
        var now = +new Date();
        if (now - lastPluck > 55) {
          lastPluck = now;
          /* Was tone(..., 0.42) — a bare sine at under half level,
             which under a guitar-string animation was barely there.
             A pluck has a transient and a filter that closes as it
             dies, so it carries at a fraction of the loudness a sine
             needs, and it is the sound the band is drawing. */
          pluck(PLUCK[em.value.length % PLUCK.length], 0.95);
        }
      };
    }

    /* Right password: the keys run up the scale under your hand and
       settle on a chord. Wrong one: a dull low pair and a shake, which
       is what a wrong note actually sounds like. */
    function glissando() {
      var all = keys ? keys.children : [];
      ORDER.forEach(function (note, i) {
        setTimeout(function () {
          tone(note);
          for (var j = 0; j < all.length; j++) {
            if (+all[j].getAttribute("data-note") === note) {
              all[j].className += " on";
              break;
            }
          }
        }, i * 34);
      });
      setTimeout(function () { [60, 64, 67, 72].forEach(function (n) { tone(n); }); }, ORDER.length * 34 + 90);
    }
    function wrongNote() {
      tone(47); tone(48);                      /* a semitone apart, on purpose */
      var pf = document.getElementById("pf");
      if (pf) { pf.classList.remove("shake"); void pf.offsetWidth; pf.classList.add("shake"); }
    }

    function submit() {
      var email = document.getElementById("em").value.trim();
      var pass = pw.value;
      if (!email || !pass) { S.err = "Enter the email and password."; return render(); }
      go.disabled = true; go.textContent = "Signing in…";
      MZ.signIn(email, pass).then(function () {
        S.err = "";
        glissando();
        /* Let it finish playing before the screen changes under it. */
        setTimeout(boot, 700);
      }).catch(function (e) {
        go.disabled = false; go.textContent = "Sign in"; wrongNote(); fail(e);
      });
    }
    go.onclick = submit;
    pw.onkeydown = function (e) { if (e.key === "Enter") submit(); };
  }

  /* ---------- chrome ---------- */
  function header(sub) {
    return '<div class="top">' +
      '<img src="assets/img/logo-white.png" alt="" />' +
      '<div class="t"><b>Mezzo</b><span>' + esc(sub) + "</span></div>" +
      '<button id="out">Sign out</button></div>';
  }
  function drawTabs() {
    tabs.hidden = false;
    /* Three marks, drawn in the same hairline as the violin on his
       card, and each one earns its tab rather than illustrating it:
       a metronome counts days the way it counts beats, a bell rings
       until somebody answers, and a drum head seen face-on is also
       the shape of a coin. */
    var ICON = {
      /* Was a metronome, and at 26px a metronome is a triangle with a
         line through it — it said "music", not "attendance", and the
         tab already says Attendance in words underneath. This is the
         thing he actually does: a sheet with staff lines and a tick
         struck across the corner of it. */
      register: '<svg viewBox="0 0 24 24"><path d="M14.6 3.2H6.2a1.8 1.8 0 0 0-1.8 1.8v14a1.8 1.8 0 0 0 1.8 1.8h7.6"/>' +
                '<path d="M7.6 8.4h6.6M7.6 12h6.6M7.6 15.6h3.4"/>' +
                '<path d="M12.9 16.6 15.8 19.6 21.2 12.4" stroke-width="2.1"/></svg>',
      /* Was a bell, which said "reminders". The tab is the whole roll
         now, so it is a tuning fork: the thing you hold up to find
         out whether everything is where it should be. */
      dues:     '<svg viewBox="0 0 24 24"><path d="M8.4 3v7.2a3.6 3.6 0 0 0 7.2 0V3"/>' +
                '<path d="M12 13.8V21"/><path d="M9.6 21h4.8"/></svg>',
      /* Two concentric circles read as a target, or an aperture, or a
         drum head — anything except money. This is a banknote with a
         rupee on it, which at 26px is the one shape nobody has to
         work out. */
      money:    '<svg viewBox="0 0 24 24"><rect x="2.4" y="6" width="19.2" height="12" rx="2.2"/>' +
                '<path d="M9.4 9.6h4.6M9.4 12h4.6M13 9.6c1.6 0 1.6 2.4 0 2.4h-3.6l4 3.4"/>' +
                '<path d="M5.2 9.1v5.8M18.8 9.1v5.8"/></svg>'
    };
    var T = [["register", "Attendance"], ["dues", "Members"], ["money", "Money"]];
    tabs.innerHTML = T.map(function (t) {
      return '<button data-tab="' + t[0] + '"' + (S.tab === t[0] ? ' class="on"' : "") +
        '><span class="ic">' + ICON[t[0]] + "</span>" + t[1] + "</button>";
    }).join("");
  }

  /* ============================================================
     TAB 1 — REGISTER
     Opens on today, because 99 times out of 100 that is why the app
     is open. The month grid is one tap away and reads the SAME
     function, so the two can never disagree.
     ============================================================ */
  function loadRegister() {
    S.register = null;
    var r = S.mode === "today"
      ? { from: S.day, to: S.day }
      : MZ.monthRange(S.month.y, S.month.m);
    return MZ.register(r.from, r.to).then(function (rows) {
      /* Array.isArray, not `rows || []`. PostgREST answers an error
         with a four-key OBJECT, which is truthy, and the register then
         called .forEach on it and took the whole tab down with a
         TypeError instead of showing an empty day. Anything that is
         not a list is no rows. */
      S.register = { rows: Array.isArray(rows) ? rows : [], from: r.from, to: r.to };
      render();
    }).catch(fail);
  }

  /* One filter word. The ring is drawn, not printed: the same
     stroke-dashoffset trick as the tick, so choosing a filter looks
     like circling something rather than a button lighting up.

     The <svg> carries an explicit width. It is a REPLACED element, so
     left+right do not stretch it — without a width it falls back to
     its intrinsic viewBox size and the ring runs off the page. */
  function word(val, label, on, attr, hue) {
    return '<button class="' + (on ? "on" : "") + '" data-' + attr + '="' + val + '"' +
      (hue ? ' style="--marker:' + hue + '"' : "") + ">" + label +
      '<svg class="ring" viewBox="0 0 120 34" preserveAspectRatio="none" aria-hidden="true">' +
      '<path d="M60 3 C 22 3, 3 9, 3 17 C 3 26, 26 31, 62 31 C 96 31, 117 26, 117 17 ' +
      'C 117 9, 98 4, 57 3"/></svg></button>';
  }

  /* ============================================================
     GOING BACK MORE THAN ONE MONTH

     The arrows step one month at a time, which is fine for last month
     and useless for six months ago — twelve taps and a lot of waiting
     on a 180ms round trip each. Tapping the date opens a strip of the
     last twelve months; one tap lands anywhere in a year.
     ============================================================ */
  function monthStrip() {
    if (!S.monthPick) return "";
    var now = new Date(), out = "";
    for (var k = 0; k < 12; k++) {
      var d = new Date(now.getFullYear(), now.getMonth() - k, 1);
      var y = d.getFullYear(), m = d.getMonth() + 1;
      var on = S.month && S.month.y === y && S.month.m === m;
      out += '<button class="mchip' + (on ? " on" : "") + '" data-jump="' + y + "-" + m + '">' +
        "<b>" + d.toLocaleDateString("en-IN", { month: "short" }) + "</b>" +
        "<span>" + (y === now.getFullYear() ? "" : String(y).slice(2)) + "</span></button>";
    }
    return '<div class="mstrip">' + out + "</div>";
  }

  function viewRegister() {
    var body = "";
    if (S.mode === "today") {
      body += '<div class="daybar">' +
        '<button data-day="-1">‹</button>' +
        '<button class="d" data-months="1"><b>' + esc(dayName(S.day)) + "</b><span>" +
          (S.day === MZ.todayIso() ? "Today" : (isSunday(S.day) ? "Sunday · closed" : "")) +
        "</span></button>" +
        '<button data-day="1"' + (S.day >= MZ.todayIso() ? " disabled" : "") + ">›</button>" +
        /* INSIDE the daybar. As a sibling it had no positioned
           ancestor, so position:absolute walked all the way up and the
           peg landed on top of Sign out. */
        '<button class="peg" data-add="1" aria-label="Add a student">' +
        '<svg viewBox="0 0 24 24" aria-hidden="true">' +
          '<path d="M4 20.2l1-4.2L16.1 4.9a2 2 0 0 1 2.9 0l.1.1a2 2 0 0 1 0 2.9L8.2 19.2z"/>' +
          '<path d="M14.6 6.4l3 3"/><path d="M5 16l3 3.2"/></svg>' +
        '<span class="lbl">Add</span></button>' +
      "</div>";
    } else {
      var mn = new Date(S.month.y, S.month.m - 1, 1)
        .toLocaleDateString("en-IN", { month: "long", year: "numeric" });
      body += '<div class="daybar">' +
        '<button data-mon="-1">‹</button>' +
        '<button class="d" data-months="1"><b>' + esc(mn) + "</b><span>tap to jump</span></button>" +
        '<button data-mon="1">›</button>' +
        '<button class="peg" data-add="1" aria-label="Add a student">' +
        '<svg viewBox="0 0 24 24" aria-hidden="true">' +
          '<path d="M4 20.2l1-4.2L16.1 4.9a2 2 0 0 1 2.9 0l.1.1a2 2 0 0 1 0 2.9L8.2 19.2z"/>' +
          '<path d="M14.6 6.4l3 3"/><path d="M5 16l3 3.2"/></svg>' +
        '<span class="lbl">Add</span></button>' +
      "</div>";
    }

    /* THE TOGGLE AND THE SEARCH SHARE A ROW.
       Three full-width bands — date, mode, search — pushed the sheet
       180px down the screen before a single name appeared, on the one
       tab he opens every afternoon. They are one band now. */
    body += monthStrip();
    body += '<div class="band">' +
      '<div class="sub-toggle">' +
        '<button data-mode="today"' + (S.mode === "today" ? ' class="on"' : "") + ">One day</button>" +
        '<button data-mode="month"' + (S.mode === "month" ? ' class="on"' : "") + ">Month</button>" +
      "</div>" +
      (S.register && S.register.rows.length > 12
        ? '<input class="search" id="q" placeholder="Find a name…" value="' + esc(S.q) + '" />'
        : "") +
    "</div>";

    if (!S.register) return body + '<div class="note">Loading…</div>';

    var rows = S.register.rows;

    /* THE FILTER, WRITTEN IN THE MARGIN AND CIRCLED.

       A setlist does not have a row of buttons on it. It has words in
       the margin with one of them circled, which is exactly what a
       filter is. So the control is a line of small marker words and
       the selection is a hand-drawn ring — the third ink mark on the
       page, alongside the tick and the strike. Nothing new to learn:
       whoever understands "struck out means away" already understands
       "circled means that is what I am looking at".

       Two groups on one line, split by a pencil slash:
         · the INSTRUMENTS, built from who is actually in front of him
           today — three words on a quiet Tuesday, seven on a Saturday,
           never a fixed wall of eight
         · the BATCH, weekday against Saturday, which is the one thing
           the day cannot tell him in month view and the thing he asked
           for by name

       Each word is 40px tall rather than the 48 this app holds itself
       to everywhere else. A mis-tap here shows the wrong list for a
       second; a mis-tap on the register marks a child absent. Those
       are not the same risk and should not cost the same screen. */
    var present = [];
    S.register.rows.forEach(function (r) {
      if (r.sport && present.indexOf(r.sport) < 0) present.push(r.sport);
    });
    present.sort();

    /* THE BATCH FILTER IS GONE, because batches are gone. Filtering
       by "weekday or Saturday" meant something when those were the two
       groups; now every child has their own days and the day view
       already picks a day. */
    var showIns = present.length > 1;
    var filterHtml = "";
    if (showIns) {
      filterHtml = '<div class="annot"><div class="row">' +
        word("", "Everyone", !S.fIns, "fi") +
        present.map(function (n) {
          return word(esc(n), esc(n), S.fIns === n, "fi", inst(n).hue);
        }).join("") +
      "</div></div>";
    }

    if (S.fIns) rows = rows.filter(function (r) { return r.sport === S.fIns; });
    if (S.q) {
      var q = S.q.toLowerCase();
      rows = rows.filter(function (r) {
        return (r.member_name || "").toLowerCase().indexOf(q) >= 0 ||
               (r.sport || "").toLowerCase().indexOf(q) >= 0;
      });
    }
    if (!S.register.rows.length) {
      return body + '<div class="card"><div class="note">No students yet.<br><br>' +
        '<button class="btn" data-add="1">Add the first student</button></div></div>';
    }
    /* NO early return for an empty result. Returning here dropped the
       filter row along with the list, so circling a batch nobody is in
       stranded him on a card whose only button cleared the instrument
       and left the batch on. The empty state belongs INSIDE the sheet,
       under the filter that caused it. */

    if (S.mode === "today") {
      var due = rows.filter(function (r) { return runsOn(r.batch_id, S.day); });
      var off = rows.filter(function (r) { return !runsOn(r.batch_id, S.day); });
      /* Never hide the off-day children behind a decision he has to
         remember: a makeup lesson is a real thing, and it is one tap
         away, on the same sheet. */
      /* Circling "Saturday" on a Thursday would otherwise produce an
         empty sheet and a dead end. It is really a request to see the
         Saturday children — which is exactly the makeup-lesson case —
         so open that set instead of showing him nothing. */
      var openOff = S.showOff;
      body += setList(due, off, filterHtml, true, openOff);
    } else {
      /* The month is still the old grid. The annotation goes on a torn
         strip of the same paper so the filter is the one control in
         both modes rather than two that look unrelated. */
      if (filterHtml) body += '<div class="sheetwrap"><div class="setlist" ' +
        'style="padding:8px 16px 4px">' + filterHtml + "</div></div>";
      body += monthGrid(rows);
    }
    return body;
  }

  /* ============================================================
     THE SETLIST

     He is a performer. The thing he already knows how to read at a
     glance, standing up, mid-lesson, is a setlist taped to a wall:
     numbered names, grouped into sets, ticked as they happen and
     struck out when they do not.

     So the sets are the INSTRUMENTS — the noun this school is
     organised around — and the marks are made by hand:

       tick    they came
       strike  they did not
       nothing not yet, which is different from away and must look it

     TAPPING THE LINE MARKS. The whole line is the target, ~52px of it,
     because that is the gesture the sheet is for. Opening a child's
     card is a separate, smaller reach at the right edge, so the common
     act is the easy one and the rare act is the deliberate one.
     ============================================================ */
  function setList(due, off, filterHtml, showBatchTail, openOff) {
    var n = 0, tailOn = false;

    function line(r) {
      n++;
      var st = r.marks && r.marks[S.day];
      var cls = st === "present" ? " present" : st === "absent" ? " absent" : "";
      var bat = MZ.dayLabel(daysOf(r.batch_id));
      return '<div class="sl-ln' + cls + (S.busy[r.enrollment_id] ? " busy" : "") +
          '" data-key="' + r.enrollment_id + '">' +
        '<button class="mark" data-mark="' + r.enrollment_id + '"' +
          ' data-batch="' + (r.batch_id || "") + '" data-note="' + inst(r.sport).note + '"' +
          ' data-now="' + (st || "") + '" aria-label="' + esc(r.member_name) + '">' +
          '<span class="no">' + n + '.</span>' +
          /* drawn by hand, not a font glyph — a tick you make */
          '<svg class="tk" viewBox="0 0 28 28" aria-hidden="true">' +
            '<path d="M4.6 15 L10.7 21.4 L23.8 6"/></svg>' +
          '<span class="who">' + esc(r.member_name) +
            '<svg class="st" viewBox="0 0 300 22" preserveAspectRatio="none" aria-hidden="true">' +
            '<path d="M2 12 C 70 6, 150 16, 298 9"/></svg></span>' +
        "</button>" +
        /* Only in the off-day set — and there it is the whole
           explanation: "Wed, Sat" is WHY this child is not expected on
           a Thursday. In today's set it would be noise colliding with
           the name beside it. */
        (tailOn && showBatchTail && bat ? '<span class="tail">' + esc(bat) + "</span>" : "") +
        '<button class="open" data-who="' + r.enrollment_id + '" data-mem="' + (r.member_id || "") +
          '" data-nm="' + esc(r.member_name) + '" data-sport="' + esc(r.sport || "") +
          '" data-batch="' + (r.batch_id || "") + '" aria-label="Open ' + esc(r.member_name) +
          '">\u203A</button>' +
      "</div>";
    }

    /* One set per instrument, in the school's own order of the day. */
    function sets(rows) {
      var by = {}, order = [];
      rows.forEach(function (r) {
        var k = r.sport || "Other";
        if (!by[k]) { by[k] = []; order.push(k); }
        by[k].push(r);
      });
      order.sort();
      return order.map(function (k) {
        var g = by[k];
        var inn = g.filter(function (r) {
          return r.marks && r.marks[S.day] === "present";
        }).length;
        /* SYMBOL AND WORD, not symbol instead of word. At 22px a
           guitar and a ukulele are the same two circles and a neck,
           and piano and keyboard are the same row of keys — he would
           be identifying his own sections by guessing. The symbol
           earns its place by being the thing that MOVES when a child
           in that section is marked in; the word is what he reads. */
        return '<div class="sl-set" style="--hue:' + inst(k).hue + '">' +
          '<div class="sl-hd"><span class="ig" data-ig="' + esc(k) + '">' +
            svgIcon(inst(k)) + "</span><b>" + esc(k) + "</b>" +
          "<i>" + g.length + (g.length > 1 ? " names" : " name") + "</i>" +
          "<em>" + inn + " in</em></div>" +
          g.map(line).join("") +
        "</div>";
      }).join("");
    }

    var marked = due.filter(function (r) { return r.marks && r.marks[S.day] === "present"; }).length;
    var away   = due.filter(function (r) { return r.marks && r.marks[S.day] === "absent"; }).length;

    var body = '<div class="sheetwrap"><div class="tape l"></div><div class="tape r"></div>' +
      '<div class="setlist">' +
      /* A filtered list must SAY it is filtered. Ten names on a sheet
         that should hold eighty is either a quiet Tuesday or a filter
         he forgot he left on, and those look identical. */
      '<div class="sl-top"><b>' + (S.day === MZ.todayIso() ? "Today" : "That day") + "\u2019s set</b>" +
        "<em>" + marked + " of " + due.length + " in</em></div>" +
      filterHtml +
      /* On its own line, not squeezed into the title — at 375px the
         title, the note and the count fought and the note lost by
         being clipped mid-word. */
      (narrowedBy()
        ? '<button class="sl-narrow" data-clear="1">showing ' + esc(narrowedBy()) +
          " \u00d7</button>"
        : "");

    body += due.length ? sets(due)
          : (narrowedBy() && !off.length
              ? '<div class="sl-note">Nobody matches that.</div>'
              : '<div class="sl-note">No class today.</div>');

    tailOn = true;
    if (off.length && openOff) {
      body += '<div class="sl-set" style="--hue:var(--pencil)">' +
        '<div class="sl-hd"><b>Not usually here today</b><i>' + off.length +
        (off.length > 1 ? " names" : " name") + "</i></div>" + sets(off) + "</div>";
    }

    body += '<div class="sl-foot">' + marked + " ticked \u00b7 " + away +
      " struck \u00b7 " + Math.max(0, due.length - marked - away) + " still to come";
    if (off.length && !openOff) {
      body += '<button class="more" data-off="1">Someone came on an off day? Show ' +
              off.length + " more</button>";
    }
    body += "</div></div></div>";
    return body;
  }

  /* What the sheet is currently narrowed to, in words. Empty when it
     is showing everybody, so the line stays quiet in the normal case. */
  function narrowedBy() {
    var bits = [];
    if (S.fIns) bits.push(S.fIns);
    if (S.q)    bits.push('"' + S.q + '"');
    return bits.length ? bits.filter(Boolean).join(" \u00b7 ") + " only" : "";
  }


  /* ============================================================
     THE ROLL — the month as a player-piano roll

     Each child is a lane, each day a column, and present is a PUNCHED
     HOLE. The pianola is the one instrument where the hole IS the
     note, so a month of attendance is literally a roll you could feed
     through something and hear.

     It is the same two-table grid underneath, unchanged, because that
     grid was taken from 104ms of layout to 27.8ms and repainting it as
     a roll must not give any of that back. Everything below is paint:
     the holes, the perforations and the hatching are backgrounds and
     classes on cells that already existed.
     ============================================================ */
  function monthGrid(rows) {
    var y = S.month.y, m = S.month.m, days = MZ.monthRange(y, m).days;
    var today = MZ.todayIso();
    var head = "", perf = "", i, iso;
    for (i = 1; i <= days; i++) {
      iso = y + "-" + String(m).padStart(2, "0") + "-" + String(i).padStart(2, "0");
      var d = new Date(y, m - 1, i).getDay();
      head += '<th class="' + (isSunday(iso) ? "shut" : "") +
              (iso === today ? " today" : "") + '"><b>' + i + "</b>" +
              DAY_NAMES[d].slice(0, 2) + "</th>";
      perf += '<td class="pf"></td>';
    }

    /* data-r is the ENROLMENT, not the row number. The row light is
       keyed on it, and a positional key means that filtering by
       instrument silently moves the light onto a different child. It
       also makes the two tables' pairing an identity check rather than
       a counting one. */
    var body = rows.map(function (r, ri) {
      var rid = r.enrollment_id != null ? r.enrollment_id : "i" + ri;
      var cells = "", seen = 0, came = 0;
      for (i = 1; i <= days; i++) {
        iso = y + "-" + String(m).padStart(2, "0") + "-" + String(i).padStart(2, "0");
        var st = r.marks && r.marks[iso];
        var runs = runsOn(r.batch_id, iso) && !isSunday(iso);
        if (st === "present") { came++; seen++; } else if (st === "absent") seen++;
        cells += st === "present" ? '<td class="c pn' + (iso === today ? " today" : "") + '"></td>'
               : st === "absent"  ? '<td class="c ab' + (iso === today ? " today" : "") + '"></td>'
               /* A day this child's class does not run is not
                  "unmarked" — it is never expected, and an empty hole
                  here would read as a register he forgot to punch. */
               : runs ? '<td class="c bl' + (iso === today ? " today" : "") + '"></td>'
                      : '<td class="c shut' + (iso === today ? " today" : "") + '"></td>';
      }
      var rate = seen ? Math.round(came / seen * 100) : 0;
      return '<tr data-r="' + rid + '" style="--hue:' + inst(r.sport).hue + '">' + cells +
        '<td class="tot"><b>' + (seen ? rate + "%" : "\u2013") + "</b>" +
        '<i style="width:' + (seen ? rate : 0) + '%"></i></td></tr>';
    }).join("");

    /* THE NAME COLUMN COMES OUT OF THE TABLE.
       It was position:sticky on ninety-six cells, and sticky is the
       single most expensive thing left in this view: removing it took
       the layout from 40.1ms to 22.7ms, measured. So the names are
       their own narrow table standing beside the scroller instead —
       the frozen-column pattern — and nothing is sticky at all.

       The two tables stay in step because every row is one fixed
       height in both. They are one line of text; nothing can wrap. */
    var names = rows.map(function (r, ri) {
      return '<tr data-r="' + (r.enrollment_id != null ? r.enrollment_id : "i" + ri) +
        '" style="--hue:' + inst(r.sport).hue + '"><td class="nmcol">' +
        esc(r.member_name) + '<span class="sp">' + esc(r.sport || "") + "</span></td></tr>";
    }).join("");

    /* The name table carries the SAME perforation rows. Without them
       its tbody starts 13px above the day table's and every name sits
       against the wrong child's marks — the third time this pair has
       drifted, and the reason both now get identical rows or none. */
    return '<div class="card roll"><div class="gridwrap">' +
      /* The light is ONE absolutely-positioned bar over the whole
         gridwrap, not a class on the cells. Every mark in this grid IS
         a cell background, so tinting cells would wash out the very
         thing he is reading — and a row light that dims the marks is
         worse than none. */
      '<div class="rowlight" hidden></div>' +
      '<table class="reg names"><thead><tr><th class="nmcol"></th></tr></thead>' +
        '<tbody><tr class="perf"><td class="nmcol"></td></tr>' +
          names +
        '<tr class="perf b"><td class="nmcol"></td></tr></tbody></table>' +
      '<div class="gridscroll"><table class="reg days">' +
        "<thead><tr>" + head + '<th class="tot">In</th></tr></thead>' +
        /* the tractor feed, which is what makes it a roll and not a
           spreadsheet with round corners */
        '<tbody><tr class="perf">' + perf + '<td class="tot"></td></tr>' +
          body +
        '<tr class="perf b">' + perf + '<td class="tot"></td></tr></tbody>' +
      "</table></div></div>" +
      '<div class="muted" style="margin-top:10px">Scroll sideways for the rest of the month. ' +
      "Tap <b>One day</b> to mark attendance.</div></div>";
  }

  /* Tap cycles blank → present → absent → blank. One control, three
     states, and the colour says which without reading anything. */
  function cycle(btn) {
    var eid = +btn.getAttribute("data-mark");
    var bid = +btn.getAttribute("data-batch");
    var now = btn.getAttribute("data-now");
    if (!bid) { toast("This student has no class time set."); return; }
    if (S.busy[eid]) return;
    var next = now === "present" ? "absent" : now === "absent" ? null : "present";

    /* PAPER FIRST, INSTRUMENT UNDER IT.
       He is ticking names on a sheet, so the mark sounds like a
       pencil: two strokes for a tick, one long pressed drag for a
       strike-off, a dull brush to rub one out. The child's own
       instrument still speaks underneath at a fifth of the level —
       enough that he learns the sound of his own register and a
       mis-tap is something he HEARS before he looks for it, not
       enough to turn a register into a xylophone. */
    /* The key presses. A row that visibly goes down is the clearest
       receipt there is for a tap, on a screen where a mis-tap marks a
       child absent. */
    /* The setlist gives its own receipt — the line lights under the
       thumb and the tick DRAWS itself — so the key-press animation is
       only for the old row. Both find their container the same way. */
    var row = btn.closest && btn.closest(".sl-ln, .srow");
    if (row && row.classList && row.classList.contains("srow")) {
      row.classList.add("pressed");
      setTimeout(function () { row.classList.remove("pressed"); }, 160);
    }
    var n = +btn.getAttribute("data-note") || 65;
    if (next === "present")     { pencilTick();   tone(n, 0.20); }
    else if (next === "absent")  { pencilStrike(); tone(n - 17, 0.14); }
    else                           paperBrush();
    btn.classList.remove("strike"); void btn.offsetWidth; btn.classList.add("strike");

    /* busy belongs on whichever container the CSS dims: .tick.busy for
       the old row, .sl-ln.busy for the sheet. */
    S.busy[eid] = true; btn.classList.add("busy");
    if (row && row.classList) row.classList.add("busy");
    /* Which section to sound once the paint lands. The sheet is
       re-rendered wholesale on every mark, so the element that should
       move does not exist yet at the moment we decide it should. */
    var mrow = (S.register.rows || []).filter(function (r) { return r.enrollment_id === eid; })[0];
    if (mrow && next) S.pulse = { sport: mrow.sport, kind: next };

    MZ.mark(bid, S.day, eid, next).then(function () {
      delete S.busy[eid];
      var row = (S.register.rows || []).filter(function (r) { return r.enrollment_id === eid; })[0];
      if (row) {
        row.marks = row.marks || {};
        if (next) row.marks[S.day] = next; else delete row.marks[S.day];
      }
      render();
    }).catch(function (e) { delete S.busy[eid]; fail(e); });
  }

  /* ============================================================
     TAB 2 — DUES
     reminder_queue() already knows who is late, and this tenant is
     configured for "one day overdue, keep telling me". Whatever it
     returns is the list. Two buttons per person: send, or paid.
     ============================================================ */
  function loadDues() {
    S.dues = null;
    /* THREE READS, ONE ROUND TRIP.
       reminder_queue() says who OWES; it has no reason to know about
       anybody who does not. The tab shows everyone now, so the member
       list comes too — and the register, because a family's card
       needs their attendance the instant he taps a name. A Tokyo
       round trip is ~180ms and the queries are single digits, so
       asking for all three together costs nothing over asking for one. */
    var r = MZ.monthRange(S.month.y, S.month.m);
    return Promise.all([MZ.dues(), MZ.register(r.from, r.to), MZ.students()])
      .then(function (x) {
        var owed = Array.isArray(x[0]) ? x[0] : [];
        S.dues    = owed;
        S.duesReg = Array.isArray(x[1]) ? x[1] : [];
        S.people  = combine(owed, Array.isArray(x[2]) ? x[2] : []);
        render();
      }).catch(fail);
  }

  /* One row per LIVE ENROLMENT, with the reminder_queue row attached
     if there is one.

     Note what this does not do: it never drops a row that came back
     from reminder_queue(). If a family is in the queue and somehow
     not in the member list, they are still here — otherwise his
     screen and his WhatsApp message could disagree, which is the one
     thing this tab is not allowed to do. */
  function combine(owed, members) {
    var byEnrol = {}, out = [];
    owed.forEach(function (d) { byEnrol[d.enrollment_id] = d; });

    members.forEach(function (m) {
      (m.enrollments || []).forEach(function (en) {
        /* paused stays ON the roll. A paused child is out of the
           register and out of the chase, but he still has to be able
           to find them and bring them back — dropping them here would
           make pausing a one-way door. */
        if (en.status && en.status !== "active" && en.status !== "paused") return;
        out.push({
          key: en.id, member_id: m.id, enrollment_id: en.id,
          name: m.name, sport: en.sport, batch_id: en.batch_id,
          renewal_on: en.renewal_on, phone: m.phone || m.parent_phone,
          paused: en.status === "paused",
          due: byEnrol[en.id] || null
        });
        delete byEnrol[en.id];
      });
    });
    /* anyone the queue named that the member list did not */
    Object.keys(byEnrol).forEach(function (k) {
      var d = byEnrol[k];
      out.push({ key: d.enrollment_id, member_id: d.member_id || null,
                 enrollment_id: d.enrollment_id, name: d.member_name,
                 sport: d.sport, batch_id: null, renewal_on: null,
                 phone: d.phone, due: d });
    });

    /* flat first worst-first, then in tune, then paused at the foot */
    function rank(p) { return p.paused ? 2 : p.due ? 0 : 1; }
    out.sort(function (a, b) {
      if (rank(a) !== rank(b)) return rank(a) - rank(b);
      var ad = a.due ? a.due.days_since || 0 : -1, bd = b.due ? b.due.days_since || 0 : -1;
      if (ad !== bd) return bd - ad;
      return String(a.name).localeCompare(String(b.name));
    });
    return out;
  }

  function waLink(d) {
    var ph = String(d.phone || "").replace(/\D/g, "");
    if (ph.length === 10) ph = "91" + ph;
    var msg = "Namaste" + (d.parent_name ? " " + d.parent_name : "") + ", this is Mezzo School of Music. " +
      "The monthly fee for " + d.member_name + " (" + (d.sport || "class") + ") of " +
      "₹" + Number(d.amount || 0).toLocaleString("en-IN") + " was due on " +
      new Date(d.due_date).toLocaleDateString("en-IN", { day: "numeric", month: "short" }) +
      ". Kindly pay at your convenience. Thank you.";
    return "https://wa.me/" + ph + "?text=" + encodeURIComponent(msg);
  }
  /* ============================================================
     THE TUNER — the dues tab

     Every family is a note being tuned. Dead centre is settled; the
     needle sits FLAT by how many days they are late, and the further
     out, the redder. Late becomes a thing you see the shape of before
     you have read a single number, and a school with nothing owing is
     a screen that has gone perfectly still.

     The list is whatever reminder_queue() returned, in the order it
     returned it. This app does not filter the dues list — that is how
     his screen and his WhatsApp message start disagreeing.
     ============================================================ */
  var TUNER_NOTE = { Piano: "C", Keyboard: "E", Guitar: "E", Violin: "A",
                     Ukulele: "G", Vocals: "A", Drums: "D", Flute: "B" };
  /* days late -> how far off the needle sits, capped and curved so a
     month late and three months late do not look the same. */
  function flatness(days) {
    var d = Number(days) || 0;
    return d <= 0 ? 0 : Math.min(1, Math.pow(d / 26, 0.72));
  }
  /* Three steps, all warm: a nudge, a chase, a problem. Roughly a week,
     three weeks, and beyond. */
  function tuneColour(off) {
    return off < 0.30 ? "var(--warn)" : off < 0.62 ? "#C25A17" : "var(--no)";
  }

  /* ============================================================
     THE TUNER, REBUILT — ONE DIAL, NOT NINETY-SIX

     Every previous version put a full tuning meter on every row:
     eleven ticks, a gate and a needle, ninety-six times. That is not
     a tuner, it is ninety-six tuners, and the furniture drowned the
     one thing each row actually says.

     A real tuner has ONE face. So the face is at the top and reads
     the whole school — dead centre when everybody has paid, swinging
     flat as more of them slip. Underneath, each member is a single
     thin row with one mark on a shared scale: a dot at centre and a
     tick if they are settled, a dot to the left if they are behind.
     No ticks, no gate, no repetition. About half the height per name
     and it finally looks like a list of tunings rather than a stack
     of instruments.
     ============================================================ */
  function polar(cx, cy, r, deg) {
    var a = deg * Math.PI / 180;
    return [cx + r * Math.cos(a), cy - r * Math.sin(a)];
  }
  function arcPath(cx, cy, r, from, to) {
    var p0 = polar(cx, cy, r, from), p1 = polar(cx, cy, r, to);
    /* sweep-flag 0, not 1. Going from the right of the dial to the
       left OVER THE TOP is counter-clockwise once y points down, and
       with sweep 1 the renderer drew the bottom half instead — which
       came out as two curved wedges either side of the face. */
    return "M" + p0[0].toFixed(1) + " " + p0[1].toFixed(1) +
           " A" + r + " " + r + " 0 0 0 " + p1[0].toFixed(1) + " " + p1[1].toFixed(1);
  }

  /* THE DIAL IS BRASS AND IVORY, NOT BLACK GLASS.

     It was a dark slab, and the CSS above it used to argue that "the
     contrast against the cream is most of why it reads at all". That
     is exactly what was wrong with it: it read as a foreign widget
     dropped onto the sheet, the only dark object below the header.

     A real tuner is not the only kind of real instrument. A VU meter
     on a valve amp, or the face of a Wittner metronome, is brass and
     ivory with a printed scale — an OBJECT, warm, and at home on
     paper. Same device, same needle, same lamps; different material.

     ONE reading, and only one: how many of the school are behind.
     Centre is nobody, hard left is everybody. The needle is a fixed
     ink red and never carries the alarm — the lamps do that, which is
     what lamps are for and what stops the dial having two meanings.

     `band` is {flat, ok, paused}, computed ONCE by viewDues and used
     both here and by the section headings, so a lamp and the heading
     it jumps to can never disagree. */
  function tunerFace(band, owedTotal) {
    var flat = band.flat, total = band.flat + band.ok + band.paused;
    var share = total ? flat / total : 0;
    /* dead centre is 90 degrees. Flat swings left, toward 168. */
    var deg = 90 + Math.min(1, share) * 78;
    /* SVG rotates clockwise from the needle's drawn position, which is
       straight up. Positive rotation swings it right, so flat is
       negative. */
    var rot = (90 - deg).toFixed(2);
    var cx = 130, cy = 118, r = 96;

    var ticks = "", labels = "";
    for (var t = 0; t <= 12; t++) {
      var a = 12 + t * 13, big = t % 3 === 0;
      var p0 = polar(cx, cy, r - (big ? 16 : 8), a), p1 = polar(cx, cy, r, a);
      ticks += '<line class="' + (big ? "big" : "") + '" x1="' + p0[0].toFixed(1) +
        '" y1="' + p0[1].toFixed(1) + '" x2="' + p1[0].toFixed(1) +
        '" y2="' + p1[1].toFixed(1) + '"/>';
      /* ONLY THE FLAT SIDE IS NUMBERED.
         Nobody can be sharp on this dial — reminder_queue has no idea
         of "paid ahead" — so numbering the right half printed 0, 0,
         which reads as a broken scale rather than an unused one. The
         left is numbered in members behind; the right keeps its ticks
         and stays blank, the way the sharp side of a tuner does when
         you are only ever flat. */
      /* NOT a >= 90. The centre label is a "0" printed at the exact
         angle the needle rests at when everybody has paid — so the
         happy state drew the needle straight through its own numeral.
         The green band already says zero, and it says it where the
         needle cannot cross it. Same lesson as the readout that had
         to move out from under the sweep. */
      if (big && a > 90) {
        var lp = polar(cx, cy, r - 30, a);
        var v = Math.round((a - 90) / 78 * total);
        labels += '<text x="' + lp[0].toFixed(1) + '" y="' + (lp[1] + 4).toFixed(1) + '">' +
          v + "</text>";
      }
    }

    /* A meter needle is a taper with a counterweight past the pivot,
       not a stick. It is two more points on a polygon and it is most
       of the difference between a drawing and an instrument. */
    var BLADE = "129.2,34 130.8,34 132.4,118 131.2,126 128.8,126 127.6,118";

    /* viewBox cropped to what is actually drawn — the arc tops out at
       y=18 with its stroke and the counterweight ends at 128. The old
       box carried 14px of empty sky and 18px of empty floor, and this
       block sits at the top of a phone screen where that is a row and
       a half of names. */
    /* `off` when anybody is behind. It drives nothing but the waver —
       see the note on @keyframes waver: movement means out of tune and
       stillness means settled, which is a thing you read without
       reading anything. */
    return '<div class="face' + (flat ? " off" : "") + '"><div class="plate">' +
      '<svg viewBox="0 14 260 116" aria-hidden="true">' +
        '<path class="bg" d="' + arcPath(cx, cy, r, 12, 168) + '"/>' +
        '<path class="okband" d="' + arcPath(cx, cy, r, 84, 96) + '"/>' +
        '<g class="tk">' + ticks + "</g>" +
        '<g class="lb">' + labels +
          '<text class="sym" x="26" y="114">\u266d</text>' +
          '<text class="sym dim" x="236" y="114">\u266f</text></g>' +
        /* Drawn straight up and rotated into place, so the swing is one
           attribute rather than two recomputed endpoints. The shadow
           rides in the same group. */
        /* TWO groups, not one. The outer carries the READING as an SVG
           transform attribute, written by paintNeedle(); the inner
           carries the waver as a CSS animation. One element cannot do
           both — a CSS transform replaces the attribute outright, and
           the needle would snap to the middle of the dial the moment
           the animation started. */
        '<g class="nd" data-deg="' + rot + '" transform="rotate(' + rot + ' ' + cx + ' ' + cy + ')">' +
          '<g class="wob">' +
            '<polygon class="sh" points="' + BLADE + '" transform="translate(1.6 2.6)"/>' +
            '<polygon class="ndl" points="' + BLADE + '"/>' +
          "</g>" +
        "</g>" +
        '<circle class="hub" cx="' + cx + '" cy="' + cy + '" r="8.5"/>' +
        '<circle class="hub2" cx="' + cx + '" cy="' + cy + '" r="3.4"/>' +
      "</svg></div>" +
      /* The lamps live INSIDE the bezel, along the foot, which is where
         a tuner puts them and what keeps this one object instead of a
         dial with a row of tiles parked under it. */
      lampRow(band) +
      "</div>" +
      '<div class="facesub">' + total + (total === 1 ? " member" : " members") +
        (owedTotal ? " \u00b7 " + inr(owedTotal) + " owing" : "") + "</div>";
  }

  /* THE LAMPS DO SOMETHING NOW.

     Three lamps were painted along the foot of the dial and none of
     them was a control — they were decoration on a device whose whole
     point is that its lamps mean something.

     They are the three bands, they carry the count, and touching one
     takes you to it. On a roll six thousand pixels long the four
     paused children sit at the bottom of ninety-six names, and this is
     the only way to reach them without scrolling past everybody.

     They JUMP, they do not filter. The list that comes back is still
     the whole list — filtering here is how his screen and his WhatsApp
     message start disagreeing.

     Exactly one is lit, the way a tuner lights one: the band that
     wants him. An empty band is a dead bulb and is not tappable,
     because a control that goes nowhere is worse than no control. */
  var LAMPS = [["flat", "out of tune"], ["ok", "in tune"], ["paused", "paused"]];

  function lampRow(band) {
    var lit = band.flat ? "flat" : "ok";
    return '<div class="lamprow">' + LAMPS.map(function (L) {
      var n = band[L[0]] || 0;
      return '<button class="lamp ' + L[0] + (L[0] === lit ? " on" : "") +
        (n ? "" : " dead") + '" data-band="' + L[0] + '"' + (n ? "" : " disabled") +
        ' aria-label="' + n + " " + L[1] + '">' +
        '<span class="lmp"><i class="jew"></i><b>' + n + "</b></span>" +
        "<span>" + L[1] + "</span></button>";
    }).join("") + "</div>";
  }

  /* Scroll, then flash what you landed on. A jump with no mark left
     behind reads as the page having lost its place.

     TWO THINGS HERE ARE NOT PREFERENCES.

     The target is CLAMPED to the bottom of the document. A smooth
     scroll to a position past the end does not clamp — it silently
     does nothing, measured in the preview: auto went to 5533, smooth
     stayed at 0. Paused is always the LAST section, so its target is
     always past the end, so that lamp never worked at all — and it is
     the one lamp that exists because four names at the bottom of
     ninety-six are otherwise unreachable.

     And the jump is INSTANT, not smooth. Six thousand pixels of glide
     is two seconds of flying past seventy-eight names. A jump control
     promises you are there; the flash says where. */
  function jumpBand(b) {
    var sec = root.querySelector('.msec[data-sec="' + b + '"]');
    if (!sec) return;
