<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Studio — Mezzo</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
/* ============================================================
   STUDIO — Swiss, and completely undecorated.
   White, black, one red. A strict grid, a big type scale, and
   nothing on screen that is not information. The opposite of
   glass: no depth, no texture, no image, no gradient anywhere.
   ============================================================ */
:root{--red:#E5342A;--ink:#0A0A0A;--grey:#8E8E93;--line:#E4E4E7}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#fff;color:var(--ink);font:16px/1.4 Inter,system-ui,sans-serif;
 padding-bottom:88px;-webkit-font-smoothing:antialiased;letter-spacing:-.011em}
.top{padding:26px 22px 0}
.kick{font:600 11px/1 Inter;letter-spacing:.16em;text-transform:uppercase;color:var(--grey)}
h1{font:800 40px/1.02 Inter;letter-spacing:-.035em;margin:12px 0 2px}
.date{font:500 17px/1.3 Inter;color:var(--grey)}
.stat{display:flex;align-items:baseline;gap:8px;padding:26px 22px 18px;border-bottom:2px solid var(--ink)}
.stat b{font:800 62px/.9 Inter;letter-spacing:-.05em}
.stat span{font:500 15px/1 Inter;color:var(--grey)}
ul{list-style:none}
li{display:grid;grid-template-columns:1fr auto;align-items:center;gap:14px;
 padding:0 22px;height:74px;border-bottom:1px solid var(--line)}
.nm{font:600 20px/1.2 Inter;letter-spacing:-.02em}
.in{font:500 13px/1 Inter;letter-spacing:.06em;text-transform:uppercase;color:var(--grey);margin-top:6px}
.mk{width:52px;height:52px;border-radius:0;border:2px solid var(--ink);background:#fff;
 font:800 20px/1 Inter;cursor:pointer;display:grid;place-items:center}
.mk.p{background:var(--ink);color:#fff}
.mk.a{background:var(--red);border-color:var(--red);color:#fff}
.mk.n{border-color:var(--line);color:transparent}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:#fff;border-top:2px solid var(--ink);
 padding-bottom:env(safe-area-inset-bottom)}
.tabs a{flex:1;text-align:center;padding:16px 0 18px;text-decoration:none;color:var(--grey);
 font:600 12px/1 Inter;letter-spacing:.1em;text-transform:uppercase}
.tabs a.on{color:var(--ink)}
.tabs a.on:after{content:"";display:block;width:22px;height:3px;background:var(--red);margin:7px auto -1px}
</style></head><body>
<div class="top"><div class="kick">Mezzo School of Music</div><h1>Register</h1><div class="date" id="d"></div></div>
<div class="stat"><b id="h"></b><span id="c"></span></div>
<ul id="rows"></ul>
<nav class="tabs"><a class="on" href="#">Register</a><a href="#">Dues</a><a href="#">Money</a></nav>
<script src="_data.js"></script><script>
var D=window.MZDEMO;document.getElementById('d').textContent=D.day;
document.getElementById('h').textContent=D.here;
document.getElementById('c').textContent='of '+D.total+' here today';
document.getElementById('rows').innerHTML=D.students.map(function(s){
 var k=s.mark==='present'?'p':s.mark==='absent'?'a':'n',g=s.mark==='present'?'✓':s.mark==='absent'?'✕':'';
 return '<li><div><div class="nm">'+s.name+'</div><div class="in">'+s.inst+'</div></div>'+
        '<button class="mk '+k+'">'+g+'</button></li>';}).join('');
</script></body></html>
