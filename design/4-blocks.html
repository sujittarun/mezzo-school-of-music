<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Blocks — Mezzo</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;1000&display=swap" rel="stylesheet">
<style>
/* ============================================================
   BLOCKS — loud, flat and cheerful.
   A children's music school, drawn like one: fat rounded shapes,
   solid poster colour, heavy friendly type, no texture at all.
   The instrument colour fills the whole row rather than hinting
   at it, so the register can be read from across the room.
   ============================================================ */
:root{--bg:#FFF6E9;--ink:#22201F}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:16px/1.35 Nunito,system-ui,sans-serif;
 padding-bottom:96px;-webkit-font-smoothing:antialiased}
.top{padding:24px 18px 6px;display:flex;align-items:center;gap:12px}
h1{font:1000 27px/1 Nunito;letter-spacing:-.02em}
.pill{margin-left:auto;background:var(--ink);color:#fff;border-radius:100px;
 padding:9px 16px;font:800 13px/1 Nunito}
.date{padding:2px 18px 16px;font:800 17px/1.3 Nunito;color:#6E6862}
ul{list-style:none;padding:0 14px;display:grid;gap:12px}
li{border-radius:22px;padding:16px 16px 16px 18px;display:flex;align-items:center;gap:14px;
 box-shadow:0 4px 0 rgba(0,0,0,.14)}
.nm{font:1000 23px/1.1 Nunito;color:#1B1A19;flex:1}
.in{display:block;font:800 12.5px/1 Nunito;letter-spacing:.06em;text-transform:uppercase;
 opacity:.62;margin-top:6px}
.mk{width:56px;height:56px;flex:0 0 56px;border-radius:18px;border:0;cursor:pointer;
 font:1000 24px/1 Nunito;display:grid;place-items:center;box-shadow:0 3px 0 rgba(0,0,0,.2)}
.mk.p{background:#1B7F4B;color:#fff}
.mk.a{background:#C6382C;color:#fff}
.mk.n{background:rgba(255,255,255,.62);color:rgba(0,0,0,.28)}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;gap:8px;padding:10px 14px calc(12px + env(safe-area-inset-bottom));
 background:var(--bg);border-top:3px solid var(--ink)}
.tabs a{flex:1;text-align:center;padding:13px 0;border-radius:16px;text-decoration:none;
 font:1000 14px/1 Nunito;color:var(--ink);background:rgba(0,0,0,.06)}
.tabs a.on{background:var(--ink);color:#fff}
</style></head><body>
<div class="top"><h1>Mezzo</h1><span class="pill" id="c"></span></div>
<div class="date" id="d"></div>
<ul id="rows"></ul>
<nav class="tabs"><a class="on" href="#">Register</a><a href="#">Dues</a><a href="#">Money</a></nav>
<script src="data.js"></script>
<script>
/* IF THE DATA IS MISSING, SAY SO.
   This page shipped blank for a day because data.js was named
   _data.js, and GitHub Pages runs Jekyll, which silently drops every
   file whose name begins with an underscore. The script 404'd, the
   render threw, and the page showed NOTHING — no error, no clue.
   A blank screen is the worst possible failure: it looks like a
   design that does not work rather than a file that is not there. */
addEventListener('DOMContentLoaded', function () {
  if (window.MZDEMO) return;
  document.body.innerHTML =
    '<div style="padding:34px;font:16px/1.6 system-ui,sans-serif;color:#B4472F">' +
    '<b style="font-size:20px">This prototype could not load its data.</b><br><br>' +
    'data.js did not load, so there is nothing to draw. This is a missing file, ' +
    'not a broken design.</div>';
});
</script>
<script>
var HUE={Piano:"#C9B6F5",Keyboard:"#9FE0DC",Guitar:"#FFCE85",Violin:"#FFAFA6",
         Ukulele:"#FFC2A0",Drums:"#F2B279",Vocals:"#FFB3DA"};
var D=window.MZDEMO;document.getElementById('d').textContent=D.day;
document.getElementById('c').textContent=D.here+' / '+D.total+' here';
document.getElementById('rows').innerHTML=D.students.map(function(s){
 var k=s.mark==='present'?'p':s.mark==='absent'?'a':'n',g=s.mark==='present'?'✓':s.mark==='absent'?'✕':'';
 return '<li style="background:'+(HUE[s.inst]||'#DDD')+'">'+
        '<span class="nm">'+s.name+'<span class="in">'+s.inst+'</span></span>'+
        '<button class="mk '+k+'">'+g+'</button></li>';}).join('');
</script></body></html>
