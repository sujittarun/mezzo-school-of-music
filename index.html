<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Mezzo School of Music</title>
<meta name="theme-color" content="#4B3F72" />
<link rel="icon" href="assets/img/favicon.png" />
<link rel="apple-touch-icon" href="assets/img/icon-192.png" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="stylesheet" href="assets/css/app.css?v=20260820c" />
</head>
<body>
<div id="root"></div>
<div class="tabs" id="tabs" hidden></div>
<script src="assets/js/cloud.js?v=20260820c"></script>
<script src="assets/js/glass.js?v=20260820c" defer></script>
<script>
/* ============================================================
   MEZZO — the whole app.

   Three tabs and nothing else. Everything on screen is either
   something he taps or a number he reads; there is no navigation to
   learn and no screen he can end up on without a way back, because
   the tabs never leave.

   Money is never computed here. resolve_fee prices a student,
   record_fee_payment writes the rupees, reminder_queue decides who is
   late — and this tenant's config already says "one nudge, one day
   late", so the list that comes back IS his list. Filtering it here
   would be how his screen and his WhatsApp start disagreeing.
   ============================================================ */
(function () {
  "use strict";
  var root = document.getElementById("root"), tabs = document.getElementById("tabs");

  var S = {
    tab: "register",
    mode: "today",            // today | month
    day: MZ.todayIso(),
    month: null,              // {y, m}
    q: "",
    fresh: false,             // true for exactly one render, after a tab change
    fIns: null,               // instrument filter, null = all
    fBat: null,               // batch filter, null = all
    showOff: false,
    register: null,           // rows from attendance_month
    dues: null,
    money: null,
    ref: null,
    busy: {},                 // enrollment_id -> true while a mark is in flight
    err: ""
  };
  (function () { var d = new Date(); S.month = { y: d.getFullYear(), m: d.getMonth() + 1 }; })();

  /* ---------- the instruments ----------
     Eight instruments, eight colours and eight notes. This is the only
     place either is decided.

     The colour is not decoration. He teaches eight instruments to
     eighty children and the one thing a register cannot tell him at a
     glance is WHICH — so the colour carries that, down the side of
     every row, through the month grid, into the dues list and the
     money. Scanning becomes seeing.

     The note is the same idea for the ear. Marking a piano student
     sounds like a piano and a guitar student like a plucked string, so
     a mis-tap is something he HEARS before he sees it — on a register
     where a wrong tap marks a child absent, that is worth more than it
     costs.

     PLATFORM.md is explicit that this belongs here: "A batch's colour
     satisfies none of them, and belongs in the app." */
  /* Pitched for a DARK surface. The first set of these was mixed for
     white cards and went muddy the moment the app turned dark — a hue
     that reads as "violin" at 40% lightness on white is a smudge on
     #14101F. Every one is lifted until it holds its own against the
     background it actually sits on. */
  /* Each instrument carries three things: the colour it is drawn in,
     the note it sounds when it is touched, and a mark of itself. The
     marks are deliberately crude — at 22px a violin and a ukulele are
     the same figure of eight, so what tells them apart is the neck,
     the scroll and above all the colour. The icon is reinforcement,
     not the label; the word is right beside it. */
  /* The marks, kept out of the table so the table stays readable as a
     table. Crude on purpose: at 26px a violin and a ukulele are the
     same figure of eight, and what really tells them apart is the
     colour and the word beside them. */
  var I_PIANO  = '<rect x="2.5" y="7" width="19" height="10" rx="1.6"/><path d="M8.8 7v6M15.2 7v6"/><path d="M6.4 7v4.2h2V7M12 7v4.2h2V7M17.6 7v4.2h2V7" fill="currentColor" stroke="none" opacity=".85"/>';
  var I_KEYB   = '<rect x="2.5" y="6" width="19" height="8" rx="1.4"/><path d="M7 6v4.5M12 6v4.5M17 6v4.5"/><path d="M8.5 18h7M12 14v4"/>';
  var I_GUITAR = '<path d="M15.5 2.5 12.2 8"/><circle cx="10" cy="16.4" r="5.2"/><circle cx="13.6" cy="11.6" r="3.6"/><circle cx="11.1" cy="14.4" r="1.5"/>';
  var I_VIOLIN = '<path d="M16.6 2.2c1.4-.5 2.6.6 2 1.9L13 12"/><circle cx="9.4" cy="16.6" r="5"/><circle cx="12.9" cy="12" r="3.4"/><path d="M8 15.2v3M11.4 15.2v3"/>';
  var I_UKE    = '<path d="M14.6 3.4 12 8.4"/><circle cx="10.2" cy="16.8" r="4.6"/><circle cx="13" cy="12.6" r="3.1"/><circle cx="11.2" cy="14.9" r="1.3"/>';
  var I_DRUM   = '<circle cx="12" cy="14" r="6.6"/><circle cx="12" cy="14" r="3"/><path d="M5.4 14v3.4M18.6 14v3.4"/><path d="M4 6.6 9 11M20 6.6 15 11"/>';
  var I_VOCAL  = '<rect x="9.2" y="2.4" width="5.6" height="10" rx="2.8"/><path d="M5.8 11.2a6.2 6.2 0 0 0 12.4 0"/><path d="M12 17.4V21M9 21h6"/>';
  var I_FLUTE  = '<path d="M3.4 15.6 20.6 8.4"/><circle cx="8.2" cy="13.6" r=".9"/><circle cx="11.6" cy="12.2" r=".9"/><circle cx="15" cy="10.8" r=".9"/>';

  var INSTRUMENT = {
    Piano:    { hue: "#A493FF", note: 60, icon: I_PIANO },
    Keyboard: { hue: "#4FD8D8", note: 62, icon: I_KEYB },
    Guitar:   { hue: "#F5B25E", note: 64, icon: I_GUITAR },
    Violin:   { hue: "#FF8A8D", note: 67, icon: I_VIOLIN },
    Ukulele:  { hue: "#FFA184", note: 69, icon: I_UKE },
    Drums:    { hue: "#EDA05C", note: 48, icon: I_DRUM },
    Vocals:   { hue: "#FF93CE", note: 72, icon: I_VOCAL },
    Flute:    { hue: "#AEDB98", note: 71, icon: I_FLUTE }
  };
  function inst(name) {
    return INSTRUMENT[name] || { hue: "#6B5CA5", note: 65, icon: '<circle cx="12" cy="12" r="7"/>' };
  }
  function svgIcon(ins) {
    return '<svg viewBox="0 0 24 24" aria-hidden="true">' + (ins.icon || "") + "</svg>";
  }

  /* ---------- small helpers ---------- */
  function esc(s) { var d = document.createElement("i"); d.textContent = String(s == null ? "" : s); return d.innerHTML; }
  function inr(n) { return "₹" + Number(n || 0).toLocaleString("en-IN"); }
  function el(html) { var d = document.createElement("div"); d.innerHTML = html; return d.firstElementChild; }
  function dayName(iso) {
    var p = iso.split("-"), d = new Date(+p[0], +p[1] - 1, +p[2]);
    return d.toLocaleDateString("en-IN", { weekday: "long", day: "numeric", month: "short" });
  }
  function isSunday(iso) { var p = iso.split("-"); return new Date(+p[0], +p[1] - 1, +p[2]).getDay() === 0; }
  function isoDow(iso) {                       // 1 = Monday … 7 = Sunday
    var p = iso.split("-"), d = new Date(+p[0], +p[1] - 1, +p[2]).getDay();
    return d === 0 ? 7 : d;
  }
  /* Does this student's class actually run on that day?
     Weekday students do not come on Saturday and Saturday students do
     not come midweek. Showing all 80 names every day is noise; worse,
     an unmarked circle against a child who was never expected reads as
     "you forgot to mark them", which is the opposite of the truth. */
  function runsOn(batchId, iso) {
    var bs = (S.ref && S.ref.batches) || [];
    for (var i = 0; i < bs.length; i++) {
      if (bs[i].id === batchId) {
        var d = bs[i].days;
        /* No day pattern is not "no days" — it is "we do not know", and
           the safe answer to not knowing is to show the child. Reading
           an empty array as "never" would empty his whole register on a
           day the reference data came back thin. */
        if (!d || !d.length) return true;
        return d.indexOf(isoDow(iso)) >= 0;
      }
    }
    return true;                               // unknown batch: never hide a child
  }
  function shiftDay(iso, by) {
    var p = iso.split("-"), d = new Date(+p[0], +p[1] - 1, +p[2]);
    d.setDate(d.getDate() + by); return MZ.iso(d);
  }
  var toastT = null;
  function toast(msg) {
    var old = document.querySelector(".toast"); if (old) old.remove();
    var t = el('<div class="toast">' + esc(msg) + "</div>");
    document.body.appendChild(t);
    clearTimeout(toastT); toastT = setTimeout(function () { t.remove(); }, 2200);
  }
  function fail(e) {
    S.err = (e && e.message) || "Something went wrong. Check the internet and try again.";
    render();
  }

  /* ---------- sign in ----------
     The one screen that is allowed to be theatrical. He sees it once a
     day for four seconds; the three tabs behind it are where he works
     and they stay calm. A mis-tap here costs a retry, not a child's
     attendance record, which is why the budget for delight is spent
     at this end of the app and not the other.

     The password field IS a keyboard. There is still a real
     <input type="password"> sitting over the keys — transparent text,
     gold caret — so password managers, autofill and screen readers all
     behave exactly as they did. The keys are what you see instead of
     dots, and each character presses the next one and sounds its note. */

  /* Twelve white keys and the eight black ones that belong between
     them, as MIDI numbers, so a password plays up the scale. */
  var WHITE = [60, 62, 64, 65, 67, 69, 71, 72, 74, 76, 77, 79];
  var BLACK_AFTER = [0, 1, 3, 4, 5, 7, 8, 10];
  var BLACK = [61, 63, 66, 68, 70, 73, 75, 78];
  /* White keys only. Running up every key including the blacks made a
     password of eight characters land on a scatter of black and white
     that read as noise; eight white keys in a row reads as progress,
     and it walks up a plain major scale, which is also the nicest
     thing to hear. The black keys are still drawn — a keyboard without
     them is not a keyboard — they just never light. */
  var ORDER = WHITE.slice();

  function keyboardHtml() {
    var w = 100 / WHITE.length, bw = w * 0.62, html = "";
    for (var i = 0; i < WHITE.length; i++) {
      html += '<i class="kw" data-note="' + WHITE[i] + '" style="left:' + (i * w) +
              "%;width:" + w + '%"></i>';
    }
    for (var j = 0; j < BLACK_AFTER.length; j++) {
      var left = (BLACK_AFTER[j] + 1) * w - bw / 2;
      html += '<i class="kb" data-note="' + BLACK[j] + '" style="left:' + left +
              "%;width:" + bw + '%"></i>';
    }
    return html;
  }

  /* A note, synthesised. No audio file, and wrapped so that a browser
     without Web Audio — or a test harness with no browser at all —
     simply gets silence instead of a sign-in screen that will not load. */
  var AC = null;
  function tone(midi, level) {
    level = level === undefined ? 1 : level;
    try {
      var C = window.AudioContext || window.webkitAudioContext;
      if (!C) return;
      if (!AC) AC = new C();
      if (AC.state === "suspended") AC.resume();
      var t = AC.currentTime, f = 440 * Math.pow(2, (midi - 69) / 12);
      [[1, 0.11 * level], [2.01, 0.04 * level], [3, 0.012 * level]].forEach(function (h) {
        var o = AC.createOscillator(), g = AC.createGain();
        o.type = "sine"; o.frequency.value = f * h[0];
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(h[1], t + 0.006);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 1.1);
        o.connect(g); g.connect(AC.destination);
        o.start(t); o.stop(t + 1.15);
      });
    } catch (e) { /* a sign-in must never fail because of a sound */ }
  }

  function gate() {
    tabs.hidden = true;
    root.innerHTML =
      '<div class="gate"><div class="ginner">' +
        '<img src="assets/img/logo-white.png" alt="" />' +
        "<h1>Mezzo School of Music</h1>" +
        "<p>Sign in to open the register</p>" +
        (S.err ? '<div class="err">' + esc(S.err) + "</div>" : "") +
        '<label class="field"><span>Email</span>' +
          '<div class="sf"><input id="em" type="email" autocomplete="username" inputmode="email" />' +
          '<svg class="wire" viewBox="0 0 300 20" preserveAspectRatio="none" aria-hidden="true">' +
          '<path vector-effect="non-scaling-stroke" d="M0 10 C 75 8.6 75 8.6 150 10 C 225 11.4 225 11.4 300 10"/></svg></div></label>' +
        '<label class="field"><span>Password</span>' +
          '<div class="pf" id="pf"><div class="pkeys" id="pkeys">' + keyboardHtml() + "</div>" +
          '<input id="pw" type="password" autocomplete="current-password" /></div></label>' +
        '<button class="btn" id="go">Sign in</button>' +
      "</div></div>";
    /* Never a value= on these two. This repo is public, and a prefilled
       password here is a live credential on the open web that stays in
       git history after it is removed. */
    var go = document.getElementById("go");
    var pw = document.getElementById("pw");
    var keys = document.getElementById("pkeys");

    /* Press one more key per character, release on delete. Long
       passwords wrap round the keyboard rather than running out of it. */
    var was = 0;
    if (pw && keys) {
      pw.oninput = function () {
        var n = pw.value.length, all = keys.children;
        for (var i = 0; i < all.length; i++) all[i].className = all[i].className.replace(" on", "");
        for (var k = 0; k < n; k++) {
          var note = ORDER[k % ORDER.length];
          for (var j = 0; j < all.length; j++) {
            if (+all[j].getAttribute("data-note") === note) { all[j].className += " on"; break; }
          }
        }
        if (n > was) tone(ORDER[(n - 1) % ORDER.length]);
        was = n;
      };
    }

    /* The email field is a string, and every letter plucks it. You
       WRITE your name on a string and you PLAY your password on the
       keys — that is the whole idea, and both halves have to respond
       per character or the idea is only half there.

       Two things keep it from becoming a nuisance. It is much quieter
       than the keys, and it is throttled: an email address typed at
       speed would otherwise fire thirty notes in two seconds, which is
       a machine gun, not an instrument. The notes are a low pentatonic
       so any order of them is consonant — you cannot play a wrong one. */
    var PLUCK = [45, 47, 50, 52, 55];          /* A minor pentatonic, low */
    var em = document.getElementById("em");
    var wire = document.querySelector(".wire");
    var wirePath = wire && wire.querySelector("path");
    var lastPluck = 0, twang = null;

    /* RESTARTING AN ANIMATION BY TOGGLING A CLASS IS NOT RELIABLE.
       The old way was remove the class, read offsetWidth to force a
       reflow, add it back. That works in Chrome and does nothing in
       WebKit — and he is on an iPad, so for him the string moved once,
       on the first letter, and then never again however hard he typed.
       Two reasons it was never going to hold: the animation is on the
       <path> but the reflow was forced on its parent <svg>, and SVG
       elements do not reliably have offsetWidth at all.

       So the animation is driven directly instead. Cancel the running
       one, start a new one — no classes, no reflow, no guessing about
       what a browser decided to batch. */
    /* NO TWO PLUCKS ARE THE SAME.
       The first version rang down an identical curve every time —
       same amplitude, same direction, same shape — so however often
       you plucked it, it moved in exactly one way and read as a
       mechanism rather than a string.

       A real string does not do that. Where you catch it decides the
       shape of the wave, how hard decides the amplitude, and it never
       lands twice in the same place. So each keystroke picks a fresh
       one: the belly of the wave moves along the string, the pull goes
       up or down, and both the size and the ring-down time vary. */
    function wave() {
      var at   = 0.22 + Math.random() * 0.56;      /* where it was caught */
      var x    = 300 * at;
      var lift = 10 - Math.random() * 4;
      var up   = Math.random() < 0.5 ? -1 : 1;
      var y    = 10 + lift * up;
      /* one belly, at a different place along the string each time */
      return "M0 10 C " + (x * 0.45).toFixed(1) + " 10 " + (x * 0.7).toFixed(1) + " " + y.toFixed(1) +
             " " + x.toFixed(1) + " " + y.toFixed(1) +
             " C " + (x + (300 - x) * 0.3).toFixed(1) + " " + y.toFixed(1) +
             " " + (x + (300 - x) * 0.55).toFixed(1) + " 10 300 10";
    }

    function pluckString() {
      if (!wirePath) return;
      wirePath.setAttribute("d", wave());          /* a new shape to ring down */
      if (!wirePath.animate) return;               /* very old browser: shape only */

      var amp  = 0.75 + Math.random() * 0.5;
      var dir  = Math.random() < 0.5 ? -1 : 1;
      var dur  = 430 + Math.random() * 220;
      var frames = [], n = 7;
      for (var i = 0; i <= n; i++) {
        /* an exponential decay, alternating sides, ending at rest */
        var k = i === n ? 1 : (1 - i / n) * amp * (i % 2 ? -dir : dir) + (i === 0 ? 0 : 0);
        frames.push({ transform: "scaleY(" + (i === n ? 1 : (k * 4).toFixed(2)) + ")",
                      offset: i / n });
      }
      if (twang) twang.cancel();
      twang = wirePath.animate(frames, { duration: dur, easing: "cubic-bezier(.25,.7,.4,1)" });
    }

    if (em && wire) {
      em.oninput = function () {
        pluckString();
        var now = +new Date();
        if (now - lastPluck > 55) {
          lastPluck = now;
          tone(PLUCK[em.value.length % PLUCK.length], 0.42);
        }
      };
    }

    /* Right password: the keys run up the scale under your hand and
       settle on a chord. Wrong one: a dull low pair and a shake, which
       is what a wrong note actually sounds like. */
    function glissando() {
      var all = keys ? keys.children : [];
      ORDER.forEach(function (note, i) {
        setTimeout(function () {
          tone(note);
          for (var j = 0; j < all.length; j++) {
            if (+all[j].getAttribute("data-note") === note) {
              all[j].className += " on";
              break;
            }
          }
        }, i * 34);
      });
      setTimeout(function () { [60, 64, 67, 72].forEach(function (n) { tone(n); }); }, ORDER.length * 34 + 90);
    }
    function wrongNote() {
      tone(47); tone(48);                      /* a semitone apart, on purpose */
      var pf = document.getElementById("pf");
      if (pf) { pf.classList.remove("shake"); void pf.offsetWidth; pf.classList.add("shake"); }
    }

    function submit() {
      var email = document.getElementById("em").value.trim();
      var pass = pw.value;
      if (!email || !pass) { S.err = "Enter the email and password."; return render(); }
      go.disabled = true; go.textContent = "Signing in…";
      MZ.signIn(email, pass).then(function () {
        S.err = "";
        glissando();
        /* Let it finish playing before the screen changes under it. */
        setTimeout(boot, 700);
      }).catch(function (e) {
        go.disabled = false; go.textContent = "Sign in"; wrongNote(); fail(e);
      });
    }
    go.onclick = submit;
    pw.onkeydown = function (e) { if (e.key === "Enter") submit(); };
  }

  /* ---------- chrome ---------- */
  function header(sub) {
    return '<div class="top">' +
      '<img src="assets/img/logo-white.png" alt="" />' +
      '<div class="t"><b>Mezzo</b><span>' + esc(sub) + "</span></div>" +
      '<button id="out">Sign out</button></div>';
  }
  function drawTabs() {
    tabs.hidden = false;
    /* Three marks, drawn in the same hairline as the violin on his
       card, and each one earns its tab rather than illustrating it:
       a metronome counts days the way it counts beats, a bell rings
       until somebody answers, and a drum head seen face-on is also
       the shape of a coin. */
    var ICON = {
      register: '<svg viewBox="0 0 24 24"><path d="M9.2 2.6h5.6l3.4 18.8H5.8z"/><path d="M7.4 13h9.2"/><path d="M15.6 5.4 9.6 17.4"/><circle cx="9.5" cy="17.6" r="1.4"/></svg>',
      dues:     '<svg viewBox="0 0 24 24"><path d="M12 3.2a6.6 6.6 0 0 1 6.6 6.6c0 4 1.2 5.6 2.2 6.6H3.2c1-1 2.2-2.6 2.2-6.6A6.6 6.6 0 0 1 12 3.2z"/><path d="M10 19.4a2.1 2.1 0 0 0 4 0"/><path d="M12 3.2V1.6"/></svg>',
      money:    '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5.6"/><path d="M12 3v2.2M12 18.8V21M3 12h2.2M18.8 12H21"/></svg>'
    };
    var T = [["register", "Register"], ["dues", "Dues"], ["money", "Money"]];
    tabs.innerHTML = T.map(function (t) {
      return '<button data-tab="' + t[0] + '"' + (S.tab === t[0] ? ' class="on"' : "") +
        '><span class="ic">' + ICON[t[0]] + "</span>" + t[1] + "</button>";
    }).join("");
  }

  /* ============================================================
     TAB 1 — REGISTER
     Opens on today, because 99 times out of 100 that is why the app
     is open. The month grid is one tap away and reads the SAME
     function, so the two can never disagree.
     ============================================================ */
  function loadRegister() {
    S.register = null;
    var r = S.mode === "today"
      ? { from: S.day, to: S.day }
      : MZ.monthRange(S.month.y, S.month.m);
    return MZ.register(r.from, r.to).then(function (rows) {
      S.register = { rows: rows || [], from: r.from, to: r.to };
      render();
    }).catch(fail);
  }

  function viewRegister() {
    var body = "";
    if (S.mode === "today") {
      body += '<div class="daybar">' +
        '<button data-day="-1">‹</button>' +
        '<div class="d"><b>' + esc(dayName(S.day)) + "</b><span>" +
          (S.day === MZ.todayIso() ? "Today" : (isSunday(S.day) ? "Sunday · closed" : "")) +
        "</span></div>" +
        '<button data-day="1"' + (S.day >= MZ.todayIso() ? " disabled" : "") + ">›</button>" +
      "</div>";
    } else {
      var mn = new Date(S.month.y, S.month.m - 1, 1)
        .toLocaleDateString("en-IN", { month: "long", year: "numeric" });
      body += '<div class="daybar">' +
        '<button data-mon="-1">‹</button>' +
        '<div class="d"><b>' + esc(mn) + "</b><span>whole month</span></div>" +
        '<button data-mon="1">›</button>' +
      "</div>";
    }

    body += '<div class="sub-toggle">' +
      '<button data-mode="today"' + (S.mode === "today" ? ' class="on"' : "") + ">One day</button>" +
      '<button data-mode="month"' + (S.mode === "month" ? ' class="on"' : "") + ">Whole month</button>" +
    "</div>";

    if (!S.register) return body + '<div class="note">Loading…</div>';

    var rows = S.register.rows;

    /* THE FILTER ROW.
       One line, scrollable sideways, and it is built from what is
       actually in front of him — only the instruments with a student
       on this list, so it is three chips on a quiet Tuesday and seven
       on a Saturday rather than a fixed wall of eight.

       What does it replace? The search box, most of the time. Finding
       "the guitar children" meant typing g-u-i-t-a-r; now it is one
       tap, and the search stays for finding one child by name. The
       chips are 40px rather than the 48 this app holds itself to
       everywhere else — a mis-tap on a filter shows the wrong list for
       a second, where a mis-tap on the register marks a child absent.
       Those two are not the same risk and should not cost the same
       screen. */
    var present = [];
    S.register.rows.forEach(function (r) {
      if (r.sport && present.indexOf(r.sport) < 0) present.push(r.sport);
    });
    present.sort();

    var bats = (S.ref && S.ref.batches) || [];
    if (present.length > 1 || (S.mode === "month" && bats.length > 1)) {
      body += '<div class="filters"><div class="frow">' +
        '<button class="chip' + (S.fIns ? "" : " on") + '" data-fi="">All</button>' +
        present.map(function (n) {
          var h = inst(n).hue;
          return '<button class="chip' + (S.fIns === n ? " on" : "") + '" data-fi="' + esc(n) +
                 '" style="--hue:' + h + '">' + esc(n) + "</button>";
        }).join("") +
        (S.mode === "month" && bats.length > 1
          ? '<span class="fsep"></span>' +
            bats.map(function (b) {
              return '<button class="chip' + (S.fBat === b.id ? " on" : "") + '" data-fb="' + b.id +
                     '">' + esc(b.short_name || b.name) + "</button>";
            }).join("")
          : "") +
      "</div></div>";
    }

    if (S.fIns) rows = rows.filter(function (r) { return r.sport === S.fIns; });
    if (S.fBat) rows = rows.filter(function (r) { return r.batch_id === S.fBat; });
    if (S.q) {
      var q = S.q.toLowerCase();
      rows = rows.filter(function (r) {
        return (r.member_name || "").toLowerCase().indexOf(q) >= 0 ||
               (r.sport || "").toLowerCase().indexOf(q) >= 0;
      });
    }
    if (S.register.rows.length > 12) {
      body += '<input class="search" id="q" placeholder="Find a student or instrument…" value="' + esc(S.q) + '" />';
    }
    if (!S.register.rows.length) {
      return body + '<div class="card"><div class="note">No students yet.<br><br>' +
        '<button class="btn" data-add="1">Add the first student</button></div></div>';
    }
    if (!rows.length) {
      return body + '<div class="card"><div class="note">Nobody matches that.<br><br>' +
        '<button class="btn ghost" data-fi="">Show everyone</button></div></div>';
    }

    if (S.mode === "today") {
      var due = rows.filter(function (r) { return runsOn(r.batch_id, S.day); });
      var off = rows.filter(function (r) { return !runsOn(r.batch_id, S.day); });
      body += due.length ? dayList(due)
            : '<div class="card"><div class="note">No class today.</div></div>';
      /* Never hide them behind a decision he has to remember: a makeup
         lesson on an off day is a real thing, and it is one tap away. */
      if (off.length) {
        body += S.showOff
          ? dayList(off, off.length + " not usually here today")
          : '<button class="btn ghost" data-off="1" style="margin-bottom:12px">' +
            "Someone came on an off day? Show " + off.length + " more</button>";
      }
    } else {
      body += monthGrid(rows);
    }
    body += '<button class="btn ghost" data-add="1" style="margin-top:6px">+ Add a student</button>';
    return body;
  }

  function dayList(rows, heading) {
    var marked = 0;
    var html = rows.map(function (r) {
      var st = r.marks && r.marks[S.day];
      if (st === "present") marked++;
      var cls = st === "present" ? "present" : st === "absent" ? "absent" : "";
      var glyph = st === "present" ? "✓" : st === "absent" ? "✕" : "";
      var ins = inst(r.sport);
      return '<div class="srow key tuned" style="--hue:' + ins.hue + '" data-key="' + r.enrollment_id + '">' +
        '<span class="ig">' + svgIcon(ins) + "</span>" +
        '<div class="nm"><b>' + esc(r.member_name) + "</b><span>" + esc(r.sport || "") + "</span></div>" +
        '<button class="tick ' + cls + (S.busy[r.enrollment_id] ? " busy" : "") + '"' +
          ' data-mark="' + r.enrollment_id + '" data-batch="' + (r.batch_id || "") + '"' +
          ' data-note="' + ins.note + '"' +
          ' data-now="' + (st || "") + '" aria-label="' + esc(r.member_name) + '">' + glyph + "</button>" +
      "</div>";
    }).join("");
    return '<div class="card"><div class="rowline" style="margin-bottom:6px">' +
        '<b style="font-size:15px">' + (heading || (marked + " of " + rows.length + " here")) + "</b>" +
        '<span style="flex:1"></span><span class="muted">tap to mark</span>' +
      "</div>" + html + "</div>";
  }

  function monthGrid(rows) {
    var y = S.month.y, m = S.month.m, days = MZ.monthRange(y, m).days;
    var head = "", i, iso;
    for (i = 1; i <= days; i++) {
      iso = y + "-" + String(m).padStart(2, "0") + "-" + String(i).padStart(2, "0");
      head += '<th class="' + (isSunday(iso) ? "sun" : "") + '">' + i + "</th>";
    }
    var body = rows.map(function (r) {
      var cells = "";
      for (i = 1; i <= days; i++) {
        iso = y + "-" + String(m).padStart(2, "0") + "-" + String(i).padStart(2, "0");
        var st = r.marks && r.marks[iso];
        var runs = runsOn(r.batch_id, iso);
        cells += '<td><span class="cell">' +
          (st ? '<i class="' + (st === "present" ? "p" : "a") + '">' +
                (st === "present" ? "✓" : "✕") + "</i>"
              : runs ? '<i class="n"></i>' : '<i class="off">·</i>') +
          "</span></td>";
      }
      var ins = inst(r.sport);
      return '<tr style="--hue:' + ins.hue + '"><td class="nmcol">' + esc(r.member_name) +
        '<div style="font-weight:600;font-size:11.5px;color:var(--hue)">' + esc(r.sport || "") + "</div></td>" +
        cells + '<td class="tot">' + r.present_days + "</td></tr>";
    }).join("");
    return '<div class="card"><div class="gridwrap"><table class="reg">' +
      "<thead><tr><th class=\"nmcol\"></th>" + head + '<th class="tot">Total</th></tr></thead>' +
      "<tbody>" + body + "</tbody></table></div>" +
      '<div class="muted" style="margin-top:10px">Scroll sideways for the rest of the month. ' +
      "Tap <b>One day</b> to mark attendance.</div></div>";
  }

  /* Tap cycles blank → present → absent → blank. One control, three
     states, and the colour says which without reading anything. */
  function cycle(btn) {
    var eid = +btn.getAttribute("data-mark");
    var bid = +btn.getAttribute("data-batch");
    var now = btn.getAttribute("data-now");
    if (!bid) { toast("This student has no class time set."); return; }
    if (S.busy[eid]) return;
    var next = now === "present" ? "absent" : now === "absent" ? null : "present";

    /* A struck head, and the note of the instrument that child plays.
       Present is that note; absent is the same note a fourth below and
       duller; clearing says nothing at all. He will learn the sound of
       his own register, which means a mis-tap is something he hears
       before he has to look for it. */
    /* The key presses. A row that visibly goes down is the clearest
       receipt there is for a tap, on a screen where a mis-tap marks a
       child absent. */
    var row = btn.closest && btn.closest(".srow");
    if (row && row.classList) {
      row.classList.add("pressed");
      setTimeout(function () { row.classList.remove("pressed"); }, 160);
    }
    var n = +btn.getAttribute("data-note") || 65;
    if (next === "present")      tone(n, 0.85);
    else if (next === "absent")  tone(n - 17, 0.55);
    btn.classList.remove("strike"); void btn.offsetWidth; btn.classList.add("strike");

    S.busy[eid] = true; btn.classList.add("busy");
    MZ.mark(bid, S.day, eid, next).then(function () {
      delete S.busy[eid];
      var row = (S.register.rows || []).filter(function (r) { return r.enrollment_id === eid; })[0];
      if (row) {
        row.marks = row.marks || {};
        if (next) row.marks[S.day] = next; else delete row.marks[S.day];
      }
      render();
    }).catch(function (e) { delete S.busy[eid]; fail(e); });
  }

  /* ============================================================
     TAB 2 — DUES
     reminder_queue() already knows who is late, and this tenant is
     configured for "one day overdue, keep telling me". Whatever it
     returns is the list. Two buttons per person: send, or paid.
     ============================================================ */
  function loadDues() {
    S.dues = null;
    return MZ.dues().then(function (rows) { S.dues = rows || []; render(); }).catch(fail);
  }
  function waLink(d) {
    var ph = String(d.phone || "").replace(/\D/g, "");
    if (ph.length === 10) ph = "91" + ph;
    var msg = "Namaste" + (d.parent_name ? " " + d.parent_name : "") + ", this is Mezzo School of Music. " +
      "The monthly fee for " + d.member_name + " (" + (d.sport || "class") + ") of " +
      "₹" + Number(d.amount || 0).toLocaleString("en-IN") + " was due on " +
      new Date(d.due_date).toLocaleDateString("en-IN", { day: "numeric", month: "short" }) +
      ". Kindly pay at your convenience. Thank you.";
    return "https://wa.me/" + ph + "?text=" + encodeURIComponent(msg);
  }
  function viewDues() {
    if (!S.dues) return '<div class="note">Loading…</div>';
    if (!S.dues.length) {
      return '<div class="card"><div class="note">' +
        '<div style="font-size:34px">✓</div>Nobody is overdue.<br>Everyone has paid.</div></div>';
    }
    var total = S.dues.reduce(function (a, d) { return a + Number(d.amount || 0); }, 0);
    return '<div class="card">' +
      '<div class="rowline" style="margin-bottom:10px">' +
        "<div><b style=\"font-size:19px\">" + S.dues.length + " to collect</b>" +
        '<div class="muted">' + inr(total) + " in total</div></div></div>" +
      S.dues.map(function (d) {
        var blocked = d.blocked_reason === "missing_phone";
        return '<div class="due tuned" style="--hue:' + inst(d.sport).hue + '">' +
          '<div class="hd"><b>' + esc(d.member_name) + "</b><em>" + inr(d.amount) + "</em></div>" +
          '<div class="sub"><span class="late">' + d.days_since + " day" + (d.days_since === 1 ? "" : "s") +
            " late</span> · " + esc(d.sport || "") +
            (d.already_sent ? " · asked today" : "") + "</div>" +
          '<div class="acts">' +
            (blocked
              ? '<button disabled style="opacity:.5">No phone number</button>'
              : '<a class="wa" target="_blank" rel="noopener" href="' + esc(waLink(d)) + '"' +
                ' data-sent="' + d.enrollment_id + '" data-amt="' + d.amount + '"' +
                ' data-ph="' + esc(d.phone || "") + '">WhatsApp</a>') +
            '<button class="paid" data-paid="' + d.enrollment_id + '" data-amt="' + d.amount +
              '" data-nm="' + esc(d.member_name) + '">Paid</button>' +
          "</div></div>";
      }).join("") + "</div>";
  }

  /* ============================================================
     TAB 3 — MONEY
     Three numbers and one form. Adding an expense is amount, what it
     was for, save — nothing else, because anything else is a reason
     not to bother recording it.
     ============================================================ */
  function loadMoney() {
    S.money = null;
    var r = MZ.monthRange(S.month.y, S.month.m);
    return Promise.all([MZ.payments(r.from, r.to), MZ.expenses(r.from, r.to)])
      .then(function (x) {
        S.money = { paid: x[0] || [], spent: x[1] || [], from: r.from, to: r.to };
        render();
      }).catch(fail);
  }
  function viewMoney() {
    var mn = new Date(S.month.y, S.month.m - 1, 1)
      .toLocaleDateString("en-IN", { month: "long", year: "numeric" });
    var head = '<div class="daybar">' +
      '<button data-mon="-1">‹</button>' +
      '<div class="d"><b>' + esc(mn) + "</b><span>this month</span></div>" +
      '<button data-mon="1">›</button></div>';
    if (!S.money) return head + '<div class="note">Loading…</div>';

    var inTot = S.money.paid.filter(function (p) { return p.status !== "void"; })
                            .reduce(function (a, p) { return a + Number(p.amount || 0); }, 0);
    var outTot = S.money.spent.reduce(function (a, p) { return a + Number(p.amount || 0); }, 0);

    return head +
      '<div class="card"><div class="figs">' +
        '<div class="fig in"><b>' + inr(inTot) + "</b><span>Fees collected</span></div>" +
        '<div class="fig out"><b>' + inr(outTot) + "</b><span>Spent</span></div>" +
        '<div class="fig"><b>' + inr(inTot - outTot) + "</b><span>Left</span></div>" +
      "</div></div>" +
      '<div class="card"><h3 style="font-size:15px;margin-bottom:12px">Add an expense</h3>' +
        '<label class="field"><span>How much</span>' +
          '<input id="exAmt" type="number" inputmode="numeric" min="1" placeholder="0" /></label>' +
        '<label class="field"><span>What for</span>' +
          '<input id="exWhat" placeholder="Guitar strings, rent, electricity…" /></label>' +
        '<button class="btn" id="exSave">Save expense</button>' +
      "</div>" +
      (S.money.spent.length
        ? '<div class="card"><h3 style="font-size:15px;margin-bottom:6px">Spent this month</h3>' +
          S.money.spent.map(function (e) {
            return '<div class="srow"><div class="nm"><b>' + esc(e.detail || e.category) + "</b>" +
              "<span>" + new Date(e.on_date).toLocaleDateString("en-IN", { day: "numeric", month: "short" }) +
              "</span></div><b>" + inr(e.amount) + "</b></div>";
          }).join("") + "</div>"
        : "") +
      (S.money.paid.length
        ? '<div class="card"><h3 style="font-size:15px;margin-bottom:6px">Fees received</h3>' +
          '<div class="muted" style="margin-bottom:8px">' + S.money.paid.length + " payment" +
          (S.money.paid.length === 1 ? "" : "s") + "</div>" +
          S.money.paid.slice(0, 30).map(function (p) {
            return '<div class="srow"><div class="nm"><b>' + inr(p.amount) + "</b><span>" +
              new Date(p.on_date).toLocaleDateString("en-IN", { day: "numeric", month: "short" }) +
              " · " + esc(p.mode || "") + "</span></div></div>";
          }).join("") + "</div>"
        : "");
  }

  /* ---------- add a student ---------- */
  function viewAdd() {
    var ins = (S.ref && S.ref.instruments) || [], bs = (S.ref && S.ref.batches) || [];
    return '<div class="card"><h3 style="font-size:17px;margin-bottom:14px">New student</h3>' +
      '<label class="field"><span>Name</span><input id="nsName" /></label>' +
      '<label class="field"><span>Parent’s phone</span>' +
        '<input id="nsPhone" type="tel" inputmode="numeric" placeholder="10 digits" /></label>' +
      '<label class="field"><span>Instrument</span><select id="nsIns">' +
        ins.map(function (i) { return '<option value="' + esc(i.name) + '">' + esc(i.name) + "</option>"; }).join("") +
      "</select></label>" +
      '<label class="field"><span>Comes on</span><select id="nsBatch">' +
        bs.map(function (b) { return '<option value="' + b.id + '">' + esc(b.name) + "</option>"; }).join("") +
      "</select></label>" +
      '<div class="muted" style="margin:-2px 0 14px">The fee is set from the ' +
        "instrument. You do not need to enter it.</div>" +
      '<button class="btn" id="nsSave">Save student</button>' +
      '<button class="btn ghost" id="nsCancel" style="margin-top:8px">Cancel</button></div>';
  }

  /* ---------- render ---------- */
  function render() {
    /* Which instrument is painted behind the page. NOT data-tab: the
       tab buttons are found with closest("[data-tab]"), so putting
       that attribute on <body> made every click anywhere in the app
       match it and be handled as a tab switch. Nothing else in the
       delegated handler ever ran — no marking, no filtering — and it
       still LOOKED right, because re-entering the current tab
       re-renders the same screen. */
    document.body.setAttribute("data-room", S.tab);
    document.body.classList.toggle("signed-out", !MZ.signedIn());
    if (!MZ.signedIn()) return gate();
    drawTabs();
    var sub = S.tab === "register" ? "Attendance register"
            : S.tab === "dues" ? "Fees to collect" : "Money this month";
    var inner = S.tab === "add" ? viewAdd()
              : S.tab === "register" ? viewRegister()
              : S.tab === "dues" ? viewDues() : viewMoney();
    /* Read and clear: the entrance animation belongs to the render
       that follows a tab change, not to the twenty re-renders that
       follow marking twenty children. */
    var fresh = S.fresh; S.fresh = false;
    root.innerHTML = header(sub) + '<div class="wrap' + (fresh ? " fresh" : "") + '">' +
      (S.err ? '<div class="err">' + esc(S.err) + "</div>" : "") + inner + "</div>";
  }

  /* ---------- one delegated click handler ---------- */
  /* EVERYTHING YOU TOUCH SOUNDS.
     Softer than the register — marking a child is the loud thing on
     this screen and nothing else should compete with it. A filter
     chip plays its own instrument, which is the nicest of these: tap
     Violin and you hear one. */
  var TAB_NOTE = { register: 60, dues: 64, money: 67, add: 69 };
  function clickTone(t) {
    if (!t.closest) return;
    var el;
    if ((el = t.closest("[data-tab]")))  return tone(TAB_NOTE[el.getAttribute("data-tab")] || 62, 0.4);
    if ((el = t.closest("[data-fi]")))   { var v = el.getAttribute("data-fi");
                                           return tone(v ? inst(v).note : 60, 0.4); }
    if (t.closest("[data-fb]"))          return tone(59, 0.35);
    if (t.closest("[data-mode]"))        return tone(64, 0.32);
    if (t.closest("[data-day],[data-mon]")) return tone(57, 0.28);
    if (t.closest(".acts .paid"))        return tone(72, 0.5);
    if (t.closest(".btn, .acts a"))      return tone(65, 0.35);
  }

  document.addEventListener("click", function (e) {
    var t = e.target;
    if (t && t.closest && !t.closest("[data-mark]")) clickTone(t);
    var tab = t.closest("[data-tab]");
    if (tab) { S.tab = tab.getAttribute("data-tab"); S.err = ""; enter(); return; }
    if (t.closest("#out")) { MZ.signOut(); location.reload(); return; }

    var mk = t.closest("[data-mark]"); if (mk) { cycle(mk); return; }

    var dd = t.closest("[data-day]");
    if (dd) { S.day = shiftDay(S.day, +dd.getAttribute("data-day")); S.showOff = false; loadRegister(); render(); return; }
    var dm = t.closest("[data-mon]");
    if (dm) {
      var n = S.month.m + (+dm.getAttribute("data-mon"));
      S.month = n < 1 ? { y: S.month.y - 1, m: 12 } : n > 12 ? { y: S.month.y + 1, m: 1 } : { y: S.month.y, m: n };
      (S.tab === "money" ? loadMoney : loadRegister)(); render(); return;
    }
    var fi = t.closest("[data-fi]");
    if (fi) { var v = fi.getAttribute("data-fi"); S.fIns = v || null; S.q = ""; render(); return; }
    var fb = t.closest("[data-fb]");
    if (fb) { var n = +fb.getAttribute("data-fb"); S.fBat = S.fBat === n ? null : n; render(); return; }
    if (t.closest("[data-off]")) { S.showOff = true; render(); return; }
    var md = t.closest("[data-mode]");
    if (md) { S.mode = md.getAttribute("data-mode"); loadRegister(); render(); return; }

    if (t.closest("[data-add]")) {
      S.tab = "add";
      MZ.reference().then(function (r) { S.ref = r; render(); }).catch(fail);
      render(); return;
    }
    if (t.closest("#nsCancel")) { S.tab = "register"; render(); return; }
    if (t.closest("#nsSave")) { saveStudent(); return; }
    if (t.closest("#exSave")) { saveExpense(); return; }

    /* WhatsApp is a real <a> so the OS opens it. window.open returns
       null whenever noopener is set — that is success, not failure —
       so nothing here inspects a handle. We only record that he asked. */
    var wa = t.closest("[data-sent]");
    if (wa) {
      MZ.logReminder({ enrollment: +wa.getAttribute("data-sent"),
                       amount: +wa.getAttribute("data-amt"),
                       phone: wa.getAttribute("data-ph") })
        .then(function () { loadDues(); }).catch(function () {});
      return;
    }
    var pd = t.closest("[data-paid]");
    if (pd) { takePayment(+pd.getAttribute("data-paid"), +pd.getAttribute("data-amt"), pd.getAttribute("data-nm")); return; }
  });
  document.addEventListener("input", function (e) {
    if (e.target.id === "q") { S.q = e.target.value; var v = S.q;
      var cur = document.getElementById("q"); render();
      var n = document.getElementById("q"); if (n) { n.value = v; n.focus(); } }
  });

  function saveStudent() {
    var b = document.getElementById("nsSave");
    b.disabled = true; b.textContent = "Saving…";
    MZ.addStudent({
      name: document.getElementById("nsName").value,
      phone: document.getElementById("nsPhone").value.replace(/\D/g, ""),
      instrument: document.getElementById("nsIns").value,
      batch: +document.getElementById("nsBatch").value,
      centre: (S.ref.centres[0] || {}).id
    }).then(function (m) {
      toast(m.name + " added"); S.tab = "register"; loadRegister(); render();
    }).catch(function (e) { b.disabled = false; b.textContent = "Save student"; fail(e); });
  }

  function saveExpense() {
    var b = document.getElementById("exSave");
    var amt = +document.getElementById("exAmt").value;
    var what = document.getElementById("exWhat").value.trim();
    b.disabled = true; b.textContent = "Saving…";
    MZ.addExpense({ amount: amt, detail: what || "General", category: "General" })
      .then(function () { toast("Expense saved"); loadMoney(); })
      .catch(function (e) { b.disabled = false; b.textContent = "Save expense"; fail(e); });
  }

  /* record_fee_payment does everything: writes the payment, rolls the
     renewal date forward and closes the reminder. That is why there is
     no second step here and no number computed in this file. */
  function takePayment(enrollment, amount, name) {
    if (!window.confirm("Received " + inr(amount) + " from " + name + "?")) return;
    MZ.takePayment({ enrollment: enrollment, amount: amount, months: 1, mode: "UPI" })
      .then(function () { toast("Payment recorded"); loadDues(); })
      .catch(fail);
  }

  /* ---------- entering a tab loads only what that tab needs ---------- */
  function enter() {
    S.fresh = true;
    render();
    if (S.tab === "register") loadRegister();
    else if (S.tab === "dues") loadDues();
    else if (S.tab === "money") loadMoney();
  }
  function boot() {
    MZ.report("page_view", {});
    /* The register needs the batches' day patterns to know who is even
       expected today, and this arrives after the first paint. Without
       the re-render it stayed on the safe fallback — show everybody —
       so the filter looked broken while being perfectly correct about
       what it knew at the time. */
    MZ.reference().then(function (r) { S.ref = r; render(); }).catch(function () {});
    enter();
  }

  window.addEventListener("error", function (e) {
    MZ.report("client_error", { msg: String((e && e.message) || "error").slice(0, 140) });
  });

  if (MZ.signedIn()) boot(); else gate();
})();
</script>
</body>
</html>
